   "level": 1,
   "title": "КӨРКЕМ МӘТІНМЕН ЖҰМЫС CLOSE READING",
   "text": "1. НЕГІЗГІ ҰҒЫМ\n\nClose reading («мұқият/жіті оқу») – мәтінді жалпылама, жылдам оқудан бас тартып, әр сөзге, сөйлемге, детальға ерекше назар аударып, олардың мағыналық қызметін ашуға бағытталған талдау тәсілі. Бұл – көркем мәтінмен «баяу» жұмыс істеу дағдысы.\n\nClose reading тәсілін қазақ әдебиетін оқытуда қолдану үшін оны шетелдік әдіснама ретінде емес, дәстүрлі қазақ мәтінтануындағы «сөз мағынасына үңілу» дәстүрімен (мысалы, Абай өлеңдерін түсіндіру дәстүрі) үндес, оны жүйелейтін құрал ретінде түсіну жөн.\n\n2. НЕ ҮШІН КЕРЕК?\n\nClose reading оқушыны мәтінді «шолып өту» әдетінен арылтады. Оны әр сөздің, әр детальдың кездейсоқ емес екеніне сендіреді. Бұл дағды дәлелді талдаудың, яғни бүкіл құралдың негізін құрайды: жоғарыда сипатталған 22 компоненттің (2-бөлім) әрқайсысы, түптеп келгенде, close reading арқылы жиналған дәйектерге сүйенеді.\n\n3. МҰҒАЛІМ НЕНІ БАЙҚАУЫ КЕРЕК? (Close reading қадамдары)\n\nБелгілеу. Мәтінді оқу барысында назар аударарлық жерлерді (таңқаларлық сөз, қайталанатын бейне, күтпеген сипаттама) белгілеп отыру. Мұғалім оқушыға нақты не белгілеу керегін үйретуі керек: бейтарап ақпарат емес, эмоционалды немесе құрылымдық жүк көтеретін тұстар.\n\nДәйексөз таңдау. Талдауды растайтын нақты, қысқа үзіндіні таңдап алу. Дәйексөз кездейсоқ емес, нақты тұжырымды дәлелдеу үшін таңдалады. «Маған ұнады» дегеннің дәлелі емес, «автор мынаны көрсетеді» дегеннің дәлелі.\n\nҚайталауларды анықтау. Мәтінде қайталанатын сөз, бейне, құрылымды тауып, олардың неге қайталанатынын сұрау. Қайталау – авторлық екпіннің тікелей белгісі.\n\nДетальдарды байқау. 2.15-тармақта сипатталған көркемдік детальді тану және оның қызметін ашу.\n\nСөздердің мағынасын контекст арқылы түсіну. Көнерген сөз, диалектизм немесе ауыспалы мағынадағы сөзді контекст арқылы түсіндіру — сөздікке жүгінумен қатар, сол сөздің осы нақты жерде қандай қосымша мән беретінін іздеу.\n\nАвтор қолданған көркемдік тәсілдердің қызметін анықтау. Тек тәсілді атап қою емес («мұнда теңеу бар»), оның осы нақты жерде не үшін қолданылғанын түсіндіру.\n\n4. ҚАНДАЙ СҰРАҚ ҚОЮҒА БОЛАДЫ?\n\nClose reading-тің негізгі қағидасы мынада: «Мәтінде не бар?» деген сұрақ тек бастапқы сатысы. Одан әрі міндетті түрде «Автор мұны не үшін қолданды?» деген сұраққа көшу керек. Тірек сұрақтар:\n\n«Бұл сөз/сөйлем/деталь неге дәл осылай, басқаша емес?» «Осы жерде автор неге тоқтап, көбірек сипаттайды?» «Бұл тәсіл болмаса, оқырманның әсері қалай өзгерер еді?»\n\n5. МӘТІНМЕН ЖҰМЫС МЫСАЛЫ\n\n«Көксерек» әңгімесіндегі қасқыр мен адам арасындағы алғашқы кездесу эпизодын алайық. Жалпылама оқу деңгейінде: «Құрмашқа көкесі бөлтірік әкеп береді». Close reading деңгейінде мұғалім оқушыға: «Автор осы кездесуді сипаттағанда қандай сөздерді таңдайды: қорқынышты, аяушылық тудыратын сөздер ме, әлде екеуі қатар ма? Осы сөздер таңдауы бізге кейінгі оқиғаны қалай болжауға көмектеседі?» деген сұрақ қояды. Осылайша бір ғана сөйлем бүкіл шығарманың идеясына апаратын маңыздыкілтке айналады.\n\n6. ЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\nClose reading-ті «мәтінді көп рет оқу» деп қана түсініп, нақты не іздеу керегін көрсетпеу;\n\nДәйексөзді талдаусыз, «безендіру» үшін ғана келтіру;\n\nҰзақ үзінділерді толығымен көшіріп алу (авторлық құқықты да, талдау тереңдігін де бұзады) – тек қысқа, нақты дәйексөз жеткілікті;\n\nДетальды тапқаннан кейін оның қызметін түсіндірмей қалдыру.\n\n7. ПРАКТИКАЛЫҚ ТАПСЫРМА\n\nКез келген шығармадан бір абзацты таңдап алыңыз. Онда: (а) назарыңз ауған бір сөзді/тіркесті белгілеңіз; (ә) неге дәл осы сөз таңдалғанын жазыңыз; (б) осы сөзді синонимімен алмастырып көріп, мағына қалай өзгеретінін салыстырыңыз. Бұл жаттығу сөз таңдауының кездейсоқ емес екенін нақты сездіреді.\n\n8. САБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nСыныпта close reading-ті шағын үзіндімен (5-10 сөйлем) жүргізген тиімді: бүкіл шығарманы осы тәсілмен «өткізу» мүмкін емес және қажет те емес. Ең маңызды, «кілт» болатын эпизодты таңдап, оған 15-20 минут арнап, оқушыларды жеке немесе жұппен жұмыс істетіп, содан кейін сыныппен талқылаңыз. Жұмыс дәптерінің «Close reading парағын» (17-парақ) осы жұмысты құрылымдау үшін қолданыңыз.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндетін орындауға негіз болады:\n\n5.1.4.1–9.1.4.1 «Шығарма үзінділерімен жұмыс» (close reading, дәйексөзбен жұмыс).\n\nКәсіби рефлексия: Мен сыныпта close reading-ке қанша минут бөлемін? Бұл жеткілікті ме?"

   "title": "ПОЭЗИЯНЫ ТАЛДАУ",
   "text": "Мұғалімдер арасында жиі кездесетін әдіскерлік қате — өлеңге прозалық шығарманың сюжеттік талдау алгоритмін (экспозиция, шарықтау шегі, кейіпкер эволюциясы) механикалық түрде қолдану. Бұл тәсіл өлеңнің табиғатына қайшы келеді, өйткені:\n\nӨлеңде, әдетте, дамыған сюжет, оқиғалар тізбегі болмайды. Ол көбіне бір сәттік көңіл-күйді, ойды, көріністі бейнелейді;\n\nӨлеңнің орталығында кейіпкер емес, лирикалық субъект – сезім мен ойдың иесі тұрады;\n\nӨлеңнің мағынасы оқиғадан емес, дыбыстық, ырғақтық, бейнелік ұйымдасудан туындайды: ұйқас, ырғақ, дыбыс қайталаулары мазмұнмен тең дәрежеде маңызды. Сондықтан поэзияны талдау үшін жеке модель қажет.\n\nПоэзияны талдаудың моделі: негізгі ұғымдар\n\nЛирикалық субъект – өлеңде сезінуші, ойлаушы «мен» (автормен міндетті түрде теңестірілмейді). Мұғалімге: «Кім сөйлеп тұр?» деген сұрақ қою арқылы ашылады.\n\nЛирикалық көңіл-күй – өлеңнің эмоционалды реңі (сағыныш, қуаныш, нала, тебіреніс). Бүкіл өлең бойында өзгеруі мүмкін.\n\nТақырып пен идея – прозадағыдай, бірақ поэзияда идея көбіне тікелей тұжырымдалмай, бейне мен интонация арқылы беріледі.\n\nОбраз – өлеңдегі көркем бейне (табиғат көрінісі, зат, жан-жануар), ол көбіне символдық немесе эмоционалды жүк көтереді.\n\nМотив – өлеңде (немесе ақынның бүкіл шығармашылығында) қайталанып келетін тақырыптық-бейнелік элемент (мысалы, «жол» мотиві, «ана» мотиві).\n\nСимвол – 2.16-тармақта сипатталғандай, бірақ поэзияда символдың мағынасы дыбыстық-ырғақтық контекстпен тығыз байланысты болады.\n\nМетафора, эпитет, теңеу – негізгі троптар (2.19-тармақты қараңыз), поэзияда бұлар мазмұнның негізгі тасымалдаушысына айналады.\n\nҚайталау (анафора, эпифора, рефрен) – өлең құрылымының маңызды тәсілі, екпінді күшейтеді, ырғақ құрайды.\n\nДыбыстық ұйымдасу (аллитерация, ассонанс) – дауыссыз/дауысты дыбыстардың әдейі қайталануы, өлеңнің «музыкасын» құрайды және мағынаны дыбыс арқылы күшейтеді.\n\nЫрғақ (ритм) – буын, екпін, бунақ негізінде құрылатын өлеңнің қозғалыс сипаты. Қазақ өлеңінде дәстүрлі 7-8, 11-12 буынды жырлар мен қара өлең үлгісін тану маңызды. Ұйқас (рифма) – тармақ соңындағы дыбыстық үйлесім, өлеңнің құрылымдық қаңқасын (шумақ түрін) анықтайды.\n\nКомпозиция – өлеңнің шумақтарға бөліну реті, ой мен көңіл-күйдің даму логикасы (мысалы, сұрақ-жауап құрылымы, градация).\n\nКөркемдік тұтастық – барлық осы элементтердің (мазмұн, дыбыс, ырғақ, бейне) бір-бірімен үйлесіп, біртұтас әсер қалдыруы.\n\nПоэзияны талдаудың қадамдық алгоритмі\n\n1-қадам. Дауыстап оқу. Өлеңді міндетті түрде дауыстап (немесе ішінен ырғағын сезініп) оқу – ырғақ пен дыбыстық ұйымдасуды сезінудің жалғыз жолы.\n\n2-қадам. Лирикалық субъект пен көңіл-күйді анықтау. «Кім сөйлеп тұр, қандай көңіл-күйде?» деген сұраққа жауап беру.\n\n3-қадам. Тақырып пен алғашқы идеяны белгілеу. Өлең не туралы, қандай ой/сезім басым.\n\n4-қадам. Композицияны бақылау. Шумақтарға бөлу, әр шумақтың алдыңғысымен байланысын, ой дамуының логикасын анықтау (мысалы: 1-шумақ – сурет, 2-шумақ – сезім, 3-шумақ – қорытынды ой).\n\n5-қадам. Негізгі образдар мен символдарды тауып, олардың мағынасын ашу.\n\n6-қадам. Троптарды (метафора, теңеу, эпитет) тауып, әрқайсысының қызметін түсіндіру.\n\n7-қадам. Дыбыстық-ырғақтық ұйымдасуды талдау. Ұйқас түрі (шумақтың ұйқас сызбасы: aabb, abab т.б.), буын саны, дыбыс қайталаулары мазмұнға қалай қызмет етеді.\n\n8-қадам. Барлық элементтерді біріктіріп, көркемдік тұтастықты тұжырымдау (интерпретация).\n\nМӘТІНМЕН ЖҰМЫС МЫСАЛЫ\n\nАбайдың табиғат лирикасынан бір мысал: «Жаз» өлеңінде лирикалық субъект табиғат көрінісін бақылаушы позициясында тұрады, бірақ тек сурет салумен шектелмейді – жаздың әр құбылысы (мал, адам, өсімдік) арқылы адам мінезінің әртүрлі қырлары жанама түрде меңзеледі. Мұғалім оқушыға: «Автор жаздың қай көрінісін таңдап отыр және бұл таңдаудың астарында қандай ой жатыр?» деген сұрақ қоя алады.\n\nЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\n• Өлеңнен «сюжет» іздеу немесе оны мазмұндауға тырысу;\n\n• Ырғақ пен ұйқасты «техникалық» деп, мазмұннан бөлек қарау;\n\n• Әр троптың атын тауып қана, қызметін ашпау;\n\n• Өлеңнің идеясын бір таяз тұжырымға дейін тарылту («табиғатты сүю керек»).\n\nПРАКТИКАЛЫҚ ТАПСЫРМА\n\nҚысқа лирикалық өлеңді (8-12 жол) таңдап алып, жоғарыдағы 8 қадамды толық орындаңыз. Әр қадамда жазбаша қысқа жазба (2-3 сөйлем) жасаңыз. Соңында өлеңнің көркемдік тұтастығы туралы бір абзацтық қорытынды жазыңыз.\n\nСАБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nӨлеңмен жұмысты міндетті түрде дауыстап оқудан бастаңыз. Тіпті бірнеше оқушыға әртүрлі ырғақпен оқытып, қайсысы өлеңнің көңіл-күйіне сай келетінін талқылауға болады. Жұмыс дәптерінің «Поэзияны талдау парағын» (18-парақ) қолданып, 8 қадамды кезең-кезеңімен толтыртыңыз.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндеттерін орындауға негіз болады:\n\n5.1.1.1–9.1.1.1 «Көркем шығарманың мазмұны мен пішіні» (поэзияға тән жанрлық ерекшелік). 5.2.3.1–9.2.3.1 «Көркем шығарманың тілі» (троптар мен фигуралар, дыбыстық-ырғақтық ұйымдасу).\n\nКәсіби рефлексия: Мен өлеңді талдағанда прозалық сызбаны еріксіз қолданып жатырмын ба?"

   "title": "ӘҢГІМЕНІ ТАЛДАУ",
   "text": "Жанрлық ерекшелігі. Әңгіме – шағын көлемді, әдетте бір оқиғаға, бір конфликтіге құрылған прозалық жанр. Кейіпкерлер саны шектеулі, уақыт ауқымы тар (бір күн, бір эпизод).\n\nӘңгімеде әр деталь, әр сөз әдетте романға қарағанда әлдеқайда көп. Көлемнің шағындығы автордан үнемдеп, дәл жазуды талап етеді. Сондықтан әңгімені талдағанда close reading (5-бөлім) ерекше маңызды: бір ғана деталь немесе сөйлем бүкіл идеяны ұстап тұруы мүмкін.\n\nПрактикалық тапсырма. Қысқа әңгімеден бір абзацты алып, онда қанша ақпарат «тығыздалғанын» (портрет, мінез, жағдай бір мезгілде қалай беріліп тұрғанын) талдаңыз."

   "title": "ПОВЕСТІ ТАЛДАУ",
   "text": "Жанрлық ерекшелігі. Повесть – әңгіме мен романның аралығындағы жанр: бір негізгі кейіпкердің белгілі бір кезеңдегі (көбіне балалық/жасөспірімдік шақ) өмірін, бірнеше байланысты оқиғалар тізбегі арқылы баяндайды.\n\nПовесть жанрында кейіпкер эволюциясы (3-бөлім) ерекше маңызды орын алады. Көбіне повесть кейіпкердің қалыптасу, есею процесін бейнелейді. Қосалқы кейіпкерлер жүйесі (2.9-тармақ) да кеңірек өрбиді.\n\nПрактикалық тапсырма. Повестің 2-3 тарауын алып, әрқайсысында кейіпкердің қандай жаңа қыры ашылатынын және бұл тараулардың жалпы эволюцияға қалай қызмет ететінін кестеге түсіріңіз."

   "title": "РОМАНДЫ ТАЛДАУ",
   "text": "Жанрлық ерекшелігі. Роман – көлемді, кең уақыттық-кеңістіктік ауқымды қамтитын, бірнеше сюжеттік желісі (негізгі және қосалқы) бар, кейіпкерлер жүйесі күрделі прозалық жанр.\n\nРоманда композиция (2.7-тармақ) және кейіпкерлер жүйесі (2.9-тармақ) ерекше күрделі талдауды талап етеді: бірнеше желінің қалай айқасатынын, қалай бір-бірін толықтыратынын көру маңызды. Романда әдетте әлеуметтік-тарихи контекст (2.20-тармақ) да кеңірек орын алады.\n\nПрактикалық тапсырма. Роман үзіндісінен негізгі және бір қосалқы желіні бөліп алып, олардың қай тұста қиылысатынын және бұл қиылыстың мағыналық рөлін анықтаңыз.\n\n                        ЖАНРЛАРДЫ САЛЫСТЫРУ КЕСТЕСІ\nБелгісі                  Әңгіме                      Повесть                 Роман\nКөлемі                   шағын                       орта                    көлемді\nКейіпкерлер саны         аз                          орташа                  көп\n                         тар (бір күн/бір\nУақыт ауқымы                                         кезең (айлар, жыл)      кең (жылдар/заман)\n                         эпизод)\nСюжеттік желі            бір орталық                 негізгі + қосалқы       бірнеше желі\nТалдаудың басты          деталь, close               кейіпкер                композиция,\nекпіні                   reading                     эволюциясы              желілер жүйесі\n\nЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\n• Барлық прозалық жанрды бір қалыппен (тек «сюжет-кейіпкер-идея» сызбасымен) талдау;\n\n• Повесть пен романды көлеміне қарай ғана ажыратып, құрылымдық айырмашылығын ескермеу;\n\n• Романдағы қосалқы желілерді «артық» деп, талдаудан тыс қалдыру.\n\nСАБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nЖаңа прозалық шығармамен танысу алдында оқушылармен бірге оның жанрын анықтап, жоғарыдағы кестені қолданып, «бұл жанрда талдауда неге ерекше назар аудару керек» деген сұрақты бірге межелеп алыңыз. Бұл шығарманы оқу барысында оқушының назарын дұрыс бағытқа алдын ала бағыттайды.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндетін орындауға негіз болады:\n\n5.1.1.1–9.1.1.1 «Көркем шығарманың мазмұны мен пішіні» (прозаға тән жанрлық ерекшелік).\n\nКәсіби рефлексия: Мен әр жанрға (әңгіме/повесть/роман) бөлек екпін қоя аламын ба, әлде бәрін бір қалыппен өткіземін бе?"

   "title": "ДРАМАЛЫҚ ШЫҒАРМАНЫ ТАЛДАУ",
   "text": "Драмалық шығарма (пьеса) – сахнада қойылуға арналған, өзіндік табиғаты бөлек мәтін түрі. Оны прозалық немесе поэзиялық талдау алгоритмімен механикалық түрде қарастыру елеулі қателерге әкеледі, өйткені:\n\n• Драмада баяндаушы (нарратор) жоқ – автордың дауысы тек ремаркалар (сахналық нұсқаулар) арқылы ғана естіледі. Қалғанының бәрі кейіпкерлердің өз сөзі мен ісі;\n\n• Оқиға оқырманға баяндалмайды, ол диалог пен әрекет арқылы тікелей көрсетіледі. Сондықтан кейіпкерді сипаттайтын авторлық портрет, ішкі толғаныс жоқтың қасы. Бәрі сөз бен қимыл арқылы жанама түрде беріледі;\n\n• Композиция оқиғаның еркін ағымымен емес, акт пен көріністің (сахнаның) қатаң бөлінуімен құрылады. Іс-қимыл көбіне қақтығыстың ортасынан (in medias res) басталады;\n\n• Мәтін – тек оқуға емес, қойылымға арналған жоба: декорация, қимыл, интонация, кідіріс (пауза) сияқты сахналық элементтер драманың ажырамас бөлігі.\n\nДраманы талдаудың негізгі ұғымдары\n\nРемарка (сахналық нұсқау) – автордың жақшаға алынған, кейіпкерлердің сөзінен тыс тұрған сөзі (орын, уақыт, қимыл, интонация, кідіріс сипаттамасы). Драмада авторлық баға мен көзқарасты іздейтін жалғыз орын – дәл осы ремаркалар.\n\nДиалог – кейіпкерлер арасындағы сөз алмасу, драманың негізгі қозғаушы күші: онда бір мезгілде мінез ашылады, оқиға дамиды, конфликт шиеленіседі.\n\nМонолог және ішкі сөз – кейіпкердің жалғыз өзі (немесе өзіне-өзі) айтқан ұзақ сөзі, көбіне оның ішкі қайшылығын, шешім алдындағы күресін ашады.\n\nДрамалық конфликт – прозадағыдан гөрі әдетте анағұрлым ашық, шиеленіскен және шешімін жылдам талап ететін қақтығыс; көбіне тұтас пьесаның құрылымын (акт бөлінісін) осы конфликтінің даму сатылары анықтайды.\n\nАкт және көрініс (сахна) – драманың композициялық бірліктері: акт – ірі бөлім (көбіне бір орын/уақытқа сәйкес), көрініс/сахна – ондағы кіші, кейіпкерлер құрамы өзгерген сайын ауысатын бөлік.\n\nДрама түрлері. Үш негізгі түрі бір-бірінен қақтығыстың сипаты мен шешілу логикасымен ажыратылады:\n\nТүрі                         Қақтығыс сипаты              Шешілу логикасы\n                             адам мен тағдыр/қоғам        кейіпкер өз құндылығынан\n                             арасындағы шешілмейтін,      бас тартпайды, сондықтан\nТрагедия\n                             әдетте қаза не күйреумен     қақтығыс тек апатпен ғана\n                             аяқталатын қайшылық          шешіледі\n                                                          шиеленіс күлкі, әшкерелеу\n                             адам мінезінің/қоғамның      арқылы жеңілдетіліп\nКомедия                      кемшілігі әсірелеу мен       шешіледі, көбіне\n                             келеке арқылы ашылады        жағымды/ирониялық\n                                                          түйінмен аяқталады\n                             шынайы, ауыр, бірақ\n                                                        шешім бар, бірақ ол оңай\nДрама (тар мағынада)         міндетті түрде апатты емес\n                                                        немесе бір мәнді емес\n                             қайшылық\n\nДраманы талдаудың қадамдық алгоритмі\n\n1-қадам. Ремарканы мұқият оқу. Әр ремаркада орын, уақыт, кейіпкердің қимылы мен интонациясы қалай белгіленгенін анықтау.\n\n2-қадам. Кейіпкерді тек сөзі мен ісі арқылы тану. Кейіпкер туралы тұжырым жасамас бұрын: «Мұны маған автор тікелей айтты ма, әлде мен мұны кейіпкердің өз сөзі мен қимылынан шығардым ба?» деген сұрақ қою.\n\n3-қадам. Диалогтың қызметін анықтау. Әр маңызды диалогта не өзгеретінін белгілеу: жаңа ақпарат па, мінездің жаңа қыры ма, конфликттің шиеленісуі ме.\n\n4-қадам. Драмалық конфликтіні белгілеу. Негізгі қақтығысты бір сөйлеммен тұжырымдап, оның қай көріністен басталып, қай көріністерде күшейетінін бақылау.\n\n5-қадам. Композицияны акт/көрініс бойынша карталау. Әр актінің/көріністің қақтығыстың дамуындағы рөлін анықтау (басталуы, шиеленісуі, шарықтау шегі, шешімі қай актіде/көріністе орналасқан).\n\n6-қадам. Монолог болса, оны бөлек талдау. Монологта кейіпкердің қандай ішкі қайшылығы ашылатынын анықтау.\n\n7-қадам. Драма түрін анықтау. Кестедегі үш түрдің қайсысына жақын екенін негіздеп, осы түрдің шешілу логикасы тұрғысынан қорытынды жасауды жоспарлау.\n\n8-қадам. Сахналық қойылым тұрғысынан қорыту. «Бұл көрініс сахнада қалай ойналар еді, режиссер қандай екпін қоятын еді?» деген сұраққа жауап іздеу. Бұл мәтінді «оқылатын» емес, «ойналатын» шығарма ретінде сезінуге көмектеседі.\n\nМӘТІНМЕН ЖҰМЫС МЫСАЛЫ\n\nМ.Әуезовтің «Еңлік-Кебек» драмасында негізгі қақтығыс — сезім мен рулық-әдет-ғұрып арасындағы қайшылық. Кейіпкерлердің ру-жора алдындағы позициясы оқырманға автордың түсіндірмесімен емес, тек олардың өз сөзі мен таңдауы арқылы беріледі. Мұғалім оқушыға: «Автор кімнің дұрыс екенін тікелей айтады ма, әлде мұны сіз кейіпкерлердің сөзі мен ісінен өзіңіз қорытуға тиіссіз бе?» деген сұрақ қоя алады.\n\nЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\n• Драманы прозадай оқып, «автор мұны қалай сипаттайды?» деп, жоқ баяндаушыдан баға іздеу;\n\n• Ремаркаларды «сахна құрастыруға қажет техникалық жазба» деп, талдаудан тыс қалдыру;\n\n• Диалогты тек «ақпарат алмасу» деп қана қарап, оның мінез ашу және конфликт дамыту қызметін елемеу;\n\n• «Драма» терминін жалпы жанр атауы (пьеса) мен үш түрдің бірі (трагедия/комедия/драма) ретінде шатастыру;\n\n• Пьесаны бір ғана «моральмен» қорытып, қақтығыстың көпмағыналылығын жоққа шығару.\n\nПРАКТИКАЛЫҚ ТАПСЫРМА\n\nПьесадан бір көрініс таңдап алып: 1) ондағы барлық ремарканы теріп жазыңыз және әрқайсысының қызметін анықтаңыз; 2) осы көріністегі диалогтың негізгі қызметін (ақпарат/мінез/конфликт) белгілеңіз; 3) осы көрініс тұтас пьесаның қақтығыс дамуында қандай сатыда тұрғанын анықтаңыз.\n\nСАБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nДрамалық үзіндіні сыныпта рөлге бөліп, дауыстап оқытыңыз. Бұл диалогтың табиғатын сезінудің ең тиімді жолы. Оқудан кейін «сіз режиссер болсаңыз, бұл көріністі қалай қойған болар едіңіз?» деген сұрақпен сахналық қиялды қосыңыз. Жұмыс дәптерінің «Драмалық шығарманы талдау парағын» (20-парақ) қолданыңыз.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндеттерін орындауға негіз болады:\n\n5.1.1.1–9.1.1.1 «Көркем шығарманың мазмұны мен пішіні» (драмаға тән жанрлық ерекшелік). 5.2.2.1–9.2.2.1 «Автор бейнесі» (ремаркадағы жасырын авторлық дауыс).\n\nКәсіби рефлексия: Мен драманы прозадай «мазмұндап» өтіп жатырмын ба, әлде ремарка мен диалогқа жеткілікті назар аударамын ба?"

   "title": "БАЛАЛАР ӘДЕБИЕТІН ТАЛДАУ",
   "text": "Балалар әдебиеті мектеп бағдарламасының едәуір бөлігін құрайды. Бірақ оны талдау көбіне ең үстірт деңгейде қалады: мұғалім шығарманы «не үйретеді?» деген бір ғана сұраққа тіреп, оның көркемдік, психологиялық, мәдени қабаттарын ашпай өтеді. Бұл балалар әдебиетінің көркем құндылығын елеусіз қалдыратын елеулі әдіскерлік олқылық.\n\nТек «тәрбиелік мән» арқылы талдау неге аздық етеді?\n\nБалалар шығармасын тек «бұл не үйретеді» тұрғысынан қарау мәтінді дидактикалық құралға ғана айналдырады. Ал шығарма өз алдына көркем әлем, онда бала бейнесі психологиялық, эстетикалық, мәдени тұрғыдан күрделі түрде салынған. «Тәрбиелік мән» – талдаудың бір ғана қыры, әрі көбіне ең соңғы, қорытынды сатысында ғана қарастырылған жөн; оны бірден іздеу мәтіннің көркемдік байлығын елемеу деген сөз. Кәсіби талдау баланың ішкі әлемін, оның қоршаған ортамен қатынасын, қиялы мен қорқынышын – бәрін бір-бірімен байланыста, көркемдік тәсілдер арқылы қалай бейнеленгенін ашуы керек.\n\nТөменде берілген 12 мәселе – балалар әдебиетін осы кең ауқымда талдауға арналған негізгі бағыттар.\n\nБалалар әдебиетін талдаудың негізгі мәселелері\n\n1. Балалық шақ бейнесі. Шығармада бала қандай бейнеде көрсетілген – идеалдандырылған ба, шынайы (қайшылықты, қателесетін) бе? Сұрақ: «Автор балалықты қандай құндылықтардың (қиял, еркіндік, тазалық, білместік) кезеңі ретінде бейнелейді?» Мысалы, Б.Соқпақбаевтың Қожасы – идеалданбаған, қателесетін, кемшіліктері бар бала бейнесі.\n\n2. Бала мен ересек қарым-қатынасы. Бала мен ата-ана/мұғалім арасындағы түсіністік/түсінбеушілік қалай бейнеленеді, кім кімге бейімделеді. Сұрақ: «Ересектер баланың әлемін түсінуге тырыса ма, әлде тек өз талабын ғана орындата ма?»\n\n3. Баланың психологиясы. Баланың эмоционалды әлемі, қабылдау ерекшелігі (әлемді үлкендерден өзгеше көру, сеніп қалу, тез ренжу/тез ұмыту). Сұрақ: «Кейіпкердің реакциясы нақты сол жастағы балаға қаншалықты сай, автор мұны қалай дәл берген?»\n\n4. Қиял. Баланың шындық пен қиялды араластыруы, қиялдың бала үшін «қорғаныс» немесе «тану құралы» қызметі. Сұрақ: «Кейіпкердің қиялы қай жерде пайда болады және не үшін (қорқыныштан қашу, шындықты түсіндіру, ойын)?»\n\n5. Ойын. Бала үшін ойынның әлемді тану, ережелерді меңгеру, әлеуметтенудің тәсілі ретіндегі рөлі. Сұрақ: «Кейіпкердің ойыны тек көңіл көтеру ме, әлде онда терең мән бар ма?»\n\n6. Қорқыныш. Баланың қорқынышы (жалғыздықтан, түсінбеуден, белгісіздіктен) және онымен күресу тәсілдері. Сұрақ: «Кейіпкер нені қорқады және бұл қорқыныш оның қандай дамуына түрткі болады?»\n\n7. Достық. Құрдастар арасындағы қатынас, адалдық пен опасыздық сынағы. Сұрақ: «Достық сынақтан қалай өтеді, ол кейіпкерге не үйретеді?»\n\n8. Отбасы. Отбасының бала үшін қауіпсіздік/қысым көзі ретіндегі екі жақты рөлі. Сұрақ: «Отбасы кейіпкерге қандай құндылық пен қандай шектеу береді?»\n\n9. Моральдық таңдау. Кейіпкердің жас ерекшелігіне сай, бірақ шынайы моральдық дилемма алдында тұруы (әсіре дидактикалық емес). Сұрақ: «Кейіпкердің таңдауы дайын моральдан гөрі оның өз тәжірибесінен қалай туындайды?»\n\n10. Еркіндік. Бала үшін еркіндіктің мәні – ережеден тыс, өз бетінше әрекет ету мүмкіндігі. Сұрақ: «Кейіпкер еркіндікті қалай түсінеді, оны қалай сезінеді (қуаныш па, жауапкершілік ауыртпалығы ма)?»\n\n11. Жауапкершілік. Еркіндіктің қарама-қарсы жағы – бала жауапкершілікті қалай, қандай тәжірибе, іс арқылы түсінеді. Сұрақ: «Кейіпкер жауапкершілікке қалай келеді? Жазадан қорқа ма, әлде ішкі түсінікпен өзі келе ме?»\n\n12. Баланың қоғамдағы орны. Бала кейіпкер қоғамда (мектеп, ауыл/қала қауымдастығы) қандай орын алады, оның даусы, пікірі ескеріле ме. Сұрақ: «Кейіпкердің қоғамдағы орны оның әрекет еркіндігін қалай шектейді немесе кеңейтеді?»\n\nМӘТІНМЕН ЖҰМЫС МЫСАЛЫ\n\nБ.Соқпақбаевтың «Менің атым – Қожа» повесінде осы мәселелердің бірнешеуі бір эпизодта тоғысады: Қожаның мектепте тәртіп бұзуы — бұл тек «бұзақылық» емес, оның еркіндікке деген ішкі қажеттілігі (10-мәселе), ересектермен түсінбеушілігі (2-мәселе) және өз әрекетінің салдарын әлі толық сезбеген бала психологиясының (3-мәселе) көрінісі. Мұғалім бұл эпизодты «Қожа дұрыс істемеді» деген бір өлшемді бағамен қорытпай, осы үш қабатты ашуы керек.\n\nЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\n• Шығарманы бірден «не үйретеді?» сұрағымен бастап, көркемдік-психологиялық талдауды өткізіп жіберу;\n\n• Бала кейіпкерді тек «тәртіпті/тентек» өлшемімен бағалау;\n\n• Балалар әдебиетін «жеңіл», «қарапайым» деп, оған терең талдау қажет емес деп қарау;\n\n• Қазіргі баланың тәжірибесін ескермей, шығармадағы балалық бейнесін бүгінгі оқушыға механикалық түрде «үлгі» ретінде ұсыну.\n\nПРАКТИКАЛЫҚ ТАПСЫРМА\n\nБалалар әдебиетінен таңдаған бір шығармадан жоғарыдағы 12 мәселенің кемінде үшеуін тауып, әрқайсысын нақты эпизодпен дәлелдеңіз. Содан кейін осы шығарманы «тек тәрбиелік мән» тұрғысынан қорытсаңыз не жоғалатынын бір абзацта жазыңыз.\n\nСАБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nБалалар шығармасын талдағанда сабақты «бұл шығарма бізге не үйретеді?» деген сұрақпен емес, «бұл шығармадағы бала кім, оның әлемі қандай?» деген сұрақпен бастаңыз. Тәрбиелік қорытындыны сабақтың соңында, барлық басқа қабаттар ашылғаннан кейін ғана, оқушылардың өз тұжырымы ретінде шығаруға мүмкіндік беріңіз — дайын мораль түрінде емес. Жұмыс дәптерінің «Балалар әдебиетін талдау парағын» (21-парақ) қолданыңыз.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндетін орындауға негіз болады:\n\n5.1.3.1–9.1.3.1 «Көркем шығармадағы образ» (балалар әдебиетіндегі бала образы).\n\nКәсіби рефлексия: Мен балалар әдебиетін тек «тәрбиелік мән» тұрғысынан қорытып жатырмын ба?"
  },

   "title": "ӘДЕБИ ШЫҒАРМАНЫ ОҚУШЫҒА ТАЛДАТУ: СЫНЫП ДЕҢГЕЙЛЕРІНЕ БЕЙІМДЕЛГЕН СҰРАҚТАР",
   "text": "Мұғалімнің өз бетінше терең талдау жасай алуы аз, оның негізгі міндеті осы талдау тәсілдерін оқушыға беру, оны сатылап, жас ерекшелігіне сай үйрету. Бұл бөлімде Блум таксономиясы негізге алынады. Дегенмен ол механикалық түрде, «біле ме, түсіне ме, қолдана ма...», емес, әдеби мәтіннің табиғатына бейімделген түрде қолданылады.\n\nБлум таксономиясын әдеби мәтінге бейімдеу қағидасы\n\nБлумның алты деңгейі (білу, түсіну, қолдану, талдау, бағалау, жасау/синтездеу) әдебиет сабағында мынадай мағынаға ие болады:\n\n• Білу – мәтіндегі факт, оқиға, кейіпкер атын білу (бастапқы, бірақ талдау емес деңгей);\n\n• Түсіну – оқиғаның мағынасын, кейіпкердің себебін өз сөзімен түсіндіре алу;\n\n• Қолдану – үйренген ұғымды (мысалы, «конфликт», «деталь») жаңа мәтінге қолдана білу;\n\n• Талдау – мәтінді бөліктерге бөліп, олардың арасындағы байланысты, қызметін ашу;\n\n• Бағалау – дәлелденген негізде өз пікірін, интерпретациясын қорғау;\n\n• Жасау/синтездеу – жаңа мәтін (өз түсінігін білдіретін шығарма, балама финал, салыстырмалы эссе) құру.\n\nМаңызды қағида: төменгі деңгейлерде (білу, түсіну) тым ұзақ тоқтап қалмау керек. Тіпті 5-сыныпта да оқушыны талдау мен бағалау деңгейіне жеткізуге болатын қарапайым сұрақтар құрастыруға болады.\n\n5-6 сынып оқушыларына арналған сұрақтар\n\nБұл жаста оқушылар нақты, көрнекі, эмоционалды жақын сұрақтарға жақсы жауап береді. Дерексіз ұғымдардан («идея», «проблематика») гөрі нақты сұрақ түрін қолданған жөн.\n\n• Білу/түсіну: «Кейіпкер не істеді? Ол неге дәл осылай істеді деп ойлайсың?»\n\n• Қолдану: «Сен де осындай жағдайда болсаң, қалай әрекет етер едің?»\n\n• Талдау (қарапайым деңгейде): «Кейіпкердің бұл әрекеті оның қандай мінезін көрсетеді? Мәтіннен дәлел тап.» «Егер кейіпкер басқаша істесе, оқиға қалай өзгерер еді?»\n\n• Бағалау: «Кейіпкердің ісін қолдайсың ба? Неге? Мәтіннен бір дәлел келтір.»\n\n• Жасау: «Осы оқиғаға өз атыңнан бір сурет/жалғасын ойлап тап» 7-8 сынып оқушыларына арналған сұрақтар\n\nБұл жаста аналитикалық ойлау дами бастайды, оқушылар себеп-салдарлық байланысты, кейіпкер мотивтерін терең түсінуге қабілетті.\n\n• Түсіну: «Кейіпкердің мақсаты неде? Оның бұл мақсатқа жетуіне не кедергі болады?»\n\n• Қолдану: «Бұл конфликт түрін (тұлға-қоғам, тұлға-өзі) анықта, дәлелде»\n\n• Талдау: «Автор бұл мәселені неге дәл осы кейіпкер арқылы көрсетеді?» «Кейіпкердің сөзі мен ісі сәйкес келе ме? Қайшылық болса, ол неден туындайды?» «Осы эпизод шығармадан алынып тасталса, мәтіннің мағынасы қалай өзгереді?»\n\n• Бағалау: «Автордың позициясын қолдайсың ба? Мәтіндегі қандай детальдар осыны растайды/жоққа шығарады?»\n\n• Жасау: «Осы оқиғаны басқа кейіпкердің көзқарасынан баяндап жаз.»\n\n9-11 сынып оқушыларына арналған сұрақтар\n\nБұл деңгейде оқушылар мәтінаралық байланыс жасауға, контекстпен, символдық мағынамен, авторлық позициямен терең жұмыс істеуге қабілетті.\n\n• Түсіну/қолдану: «Шығармадағы негізгі проблематиканы анықта, оны қазіргі қоғаммен байланыстыр»\n\n• Талдау: «Автордың позициясын мәтіндегі қандай детальдардан байқауға болады?» «Бұл шығарманы автордың басқа шығармасымен/дәуірдегі басқа авторлармен салыстыр. Қандай ортақ нәрсе, қандай айырмашылық бар?» «Символдың (немесе бейненің) мағынасы шығарма бойында қалай өзгереді/дамиды?»\n\n• Бағалау: «Егер осы шығарманың финалы басқаша болса, идея қалай өзгерер еді? Автордың таңдауын негіздей аласың ба?» «Сен келіспейтін интерпретацияны елестет, оның қандай дәлелдері болуы мүмкін?»\n\n• Жасау/синтездеу: «Шығарманың проблематикасы бойынша дәлелді эссе жаз, кемінде үш мәтіндік дәлел қолдан» «Осы шығарманы қазіргі заманға көшірсең, қандай өзгерістер керек болар еді, ал қандай мәселе өзгеріссіз қалар еді?»\n\nЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\n• Барлық сыныпқа бірдей деңгейдегі сұрақ қою (кіші сыныпқа тым дерексіз, жоғары сыныпқа тым қарапайым);\n\n• Блум деңгейлерін механикалық түрде бір-бірлеп «өтіп шығу» (әр сабақта міндетті түрде алтауын да қолдану қажет емес);\n\n• Тек «білу» деңгейінде тоқтап қалу («кейіпкердің аты кім?» деңгейінен әрі аспау).\n\nПРАКТИКАЛЫҚ ТАПСЫРМА\n\nӨзіңіз сабақ беретін сыныпқа арналған бір шығарма бойынша әр Блум деңгейіне сәйкес бір-бірден, барлығы алтау сұрақ құрастырыңыз. Құрастырған сұрақтарыңызды әріптесіңізбен бөлісіп, олардың сыныптың жас ерекшелігіне сай екенін тексеріңіз.\n\nСАБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nСабақ жоспарында сұрақтарды төменнен жоғарыға қарай сатылап құрастырыңыз: сабақтың басында қарапайым түсіну сұрақтарынан бастап, ортасында талдау сұрақтарына көшіп, соңында бағалау/синтездеу сұрағымен қорытыңыз. Бұл құрылым оқушыны бірте-бірте тереңірек ойлауға жетелейді.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның үш блогындағы 12 дағдыны да сынып деңгейіне бейімделген сұрақ түрінде жүзеге асырады — толық код кестесін «Оқу бағдарламасымен сәйкестік» қосымша құжатынан қараңыз.\n\nКәсіби рефлексия: Менің сұрақтарым нақты сынып деңгейіне сай ма, әлде бәріне бірдей деңгейде қоямын ба?"

   "title": "САБАҚТА ӘДЕБИ ТАЛДАУДЫ ҰЙЫМДАСТЫРУ ӘДІСТЕРІ",
   "text": "Бұл бөлімде сыныпта қолдануға дайын 11 әдіс беріледі. Әр әдіс МАҚСАТЫ → ҚАЛАЙ ЖҮРГІЗІЛЕДІ → МҰҒАЛІМ НЕ ІСТЕЙДІ → ОҚУШЫ НЕ ІСТЕЙДІ → НӘТИЖЕ форматында сипатталады.\n\n1. CLOSE READING\n\nМақсаты: оқушыны мәтіннің деталіне мұқият назар аударуға, дәйексөзбен дәлелдеуге үйрету.\n\nҚалай жүргізіледі: шағын үзінді (5-15 сөйлем) таңдалып, оқушылар оны жеке немесе жұппен мұқият оқып, белгілі бір сұрақ бойынша талдайды.\n\nМұғалім не істейді: үзіндіні таңдайды, бағыттаушы сұрақ дайындайды, топ жұмысын бақылайды.\n\nОқушы не істейді: мәтінді белгілейді, дәйексөз таңдайды, сұраққа жазбаша/ауызша жауап дайындайды.\n\nНәтиже: дәйексөзге негізделген нақты, тексерілетін тұжырым.\n\n2. ПІКІРТАЛАС\n\nМақсаты: проблематиканы (2.4-тармақ) ашу, оқушыны дәлелді дау-дамайға, қарсы көзқарасты тыңдауға үйрету.\n\nҚалай жүргізіледі: сынып екі (немесе бірнеше) топқа бөлінеді, әрқайсысы шығармадағы даулы мәселе бойынша қарама-қарсы позицияны қорғайды.\n\nМұғалім не істейді: даулы мәселені тұжырымдайды, топтарға уақыт пен ереже белгілейді, модератор рөлін атқарады.\n\nОқушы не істейді: топпен дәлел жинайды, мәтіннен растама іздейді, қарсы топтың дәлеліне жауап береді.\n\nНәтиже: мәселенің бірмағыналы еместігін түсіну, дәлелді сөйлеу дағдысы.\n\n3. ӘДЕБИ КЕЙС\n\nМақсаты: кейіпкердің жағдайын нақты, шешім қабылдауды талап ететін «кейс» ретінде қарастырып, талдауды практикалық жағдаятқа айналдыру.\n\nҚалай жүргізіледі: кейіпкердің шешуші сәттегі жағдайы (дилеммасы) бөлек беріліп, оқушылар «кеңесші» рөлінде осы жағдайды талдайды.\n\nМұғалім не істейді: кейсті (жағдаятты) дайындайды, кейіпкердің таңдау алдындағы жағдайын нақтылап ұсынады.\n\nОқушы не істейді: жағдаятты талдайды, баламалы шешімдерді қарастырады, өз ұсынысын дәлелдейді, содан кейін кейіпкердің нақты не істегенімен салыстырады.\n\nНәтиже: кейіпкердің таңдауын терең түсіну, эмпатия мен сыни ойлаудың қатар дамуы.\n\n4. САЛЫСТЫРМАЛЫ ТАЛДАУ\n\nМақсаты: екі (немесе одан да көп) шығарманы/кейіпкерді/эпизодты салыстыру арқылы ортақтық пен айырмашылықты, әр авторлық таңдаудың ерекшелігін ашу.\n\nҚалай жүргізіледі: ұқсас тақырыптағы/мәселедегі екі мәтін (немесе бір мәтіндегі екі кейіпкер) қатар қойылып, белгілі бір өлшем бойынша салыстырылады.\n\nМұғалім не істейді: салыстыру өлшемдерін (не бойынша салыстырамыз) белгілейді, екі мәтінді таңдайды.\n\nОқушы не істейді: кестеге немесе диаграммаға (мысалы, Венн диаграммасына) ортақ және өзгеше белгілерді түсіреді, қорытынды жасайды.\n\nНәтиже: әр авторлық шешімнің «жалғыз мүмкін нұсқа» емес, таңдау екенін түсіну.\n\n5. КЕЙІПКЕР КҮНДЕЛІГІ\n\nМақсаты: кейіпкердің ішкі әлеміне (3-бөлім) терең үңіліп, эмпатия мен психологиялық түсінікті дамыту.\n\nҚалай жүргізіледі: оқушы кейіпкердің атынан, шығармадағы белгілі бір оқиғаға қатысты күнделік жазбасын құрастырады.\n\nМұғалім не істейді: қай оқиға/сәт бойынша жазу керегін белгілейді, кейіпкердің «дауысына» сай стильді еске салады.\n\nОқушы не істейді: кейіпкердің ойын, сезімін, оның мәтінде тікелей айтылмаған ішкі уәждерін өз сөзімен жазады.\n\nНәтиже: кейіпкердің мотивтерін терең түсіну, мәтіндегі «үнсіздіктерді» толтыру дағдысы.\n\n6. ДӘЙЕКСӨЗ КАРТАСЫ\n\nМақсаты: белгілі бір тұжырымды (кейіпкер қасиеті, идея, автор позициясы) бірнеше дәйексөзбен жүйелі дәлелдеуге үйрету.\n\nҚалай жүргізіледі: оқушы бір тұжырымды таңдап, оны растайтын 3-5 дәйексөзді мәтіннен теріп, картаға (орталықта тұжырым, айналасында дәйексөздер) орналастырады.\n\nМұғалім не істейді: тұжырым үлгісін ұсынады, дәйексөз көлемінің шектеулі (қысқа) болу қажеттігін ескертеді.\n\nОқушы не істейді: мәтінді оқып, сәйкес дәйексөзді таңдайды, әр дәйексөздің тұжырымды қалай растайтынын қысқаша жазады.\n\nНәтиже: бір ойды бірнеше тәуелсіз дәлелмен растау дағдысы.\n\n7. КОНЦЕПТУАЛДЫҚ КАРТА\n\nМақсаты: шығармадағы ұғымдардың (кейіпкерлер, тақырыптар, символдар) өзара байланысын көрнекі түрде көрсету.\n\nҚалай жүргізіледі: орталық ұғымнан (мысалы, бас кейіпкер немесе негізгі идея) тарамдар тартылып, онымен байланысты барлық элементтер (басқа кейіпкерлер, детальдар, конфликт) карта түрінде байланыстырылады.\n\nМұғалім не істейді: орталық ұғымды белгілейді, картаның негізгі құрылымын үлгі ретінде көрсетеді.\n\nОқушы не істейді: байланыстарды өзі анықтап, картаға түсіреді, әр байланысты бір-екі сөзбен түсіндіреді.\n\nНәтиже: шығарманы бөлек фактілер емес, біртұтас жүйе ретінде көру.\n\n8. ПІКІР ШКАЛАСЫ\n\nМақсаты: дау тудыратын мәселе бойынша оқушылардың әртүрлі дәрежедегі көзқарасын анық көрсету және дәлелдеу.\n\nҚалай жүргізіледі: сыныпта шартты сызық (шкала) белгіленеді («толық қолдаймын» – «толық қарсымын»), оқушылар мәселе бойынша өз позициясына сай орынға тұрады/белгі қояды.\n\nМұғалім не істейді: даулы тұжырымды («кейіпкердің әрекеті ақталған» сияқты) ұсынады, әр оқушыдан дәлел сұрайды.\n\nОқушы не істейді: өз позициясын анықтайды, оны мәтіндік дәлелмен қорғайды, басқа позициядағы дәлелді тыңдап, қажет болса өз орнын өзгертеді.\n\nНәтиже: мәселенің көпқырлылығын көрнекі түрде сезіну, позицияны дәлелмен өзгертуге ашық болу дағдысы.\n\n9. «АВТОРДЫҢ ОРНЫНДА БОЛСАҢ...»\n\nМақсаты: авторлық таңдаудың кездейсоқ емес екенін, әр композициялық/көркемдік шешімнің баламасы болғанын түсіну.\n\nҚалай жүргізіледі: оқушыға белгілі бір көркемдік шешімге (финал, баяндау тәсілі, кейіпкер тағдыры) балама ұсыныс жасау тапсырылады, содан кейін өз баламасы мен авторлық нұсқа салыстырылады.\n\nМұғалім не істейді: қай шешімді «өзгертуге» болатынын белгілейді (мысалы, «финалды өзгертіп көру»).\n\nОқушы не істейді: балама нұсқа ұсынады, содан кейін «неге автор дәл осылай жасады?» деген сұраққа жауап іздейді және өзінің көзқарасын дәлелдейді.\n\nНәтиже: авторлық таңдаудың мағыналық салмағын терең түсіну.\n\n10. «МӘТІНГЕ СҰРАҚ ҚОЮ»\n\nМақсаты: оқушыны пассив оқырманнан белсенді, сұрақ қоятын оқырманға айналдыру.\n\nҚалай жүргізіледі: оқу барысында оқушылар мәтіннің әр бөлігіне өз сұрақтарын жазып отырады (түсінбегенін, күткенін, күмәнданғанын).\n\nМұғалім не істейді: сұрақ түрлерінің үлгісін көрсетеді (болжам сұрағы, себеп сұрағы, күмән сұрағы).\n\nОқушы не істейді: оқу барысында өз сұрақтарын жазады, сабақта ең қызықты сұрақтарды сыныппен талқылайды.\n\nНәтиже: мәтінмен диалогқа түсу дағдысы, өз бетінше сұрақ қоя білу қабілеті.\n\n11. ДӘЛЕЛ – ТҮСІНДІРУ – ҚОРЫТЫНДЫ МОДЕЛІ\n\nМақсаты: кез келген тұжырымды үш қадаммен (дәйек – оны түсіндіру – жалпы қорытынды) құрылымды түрде дәлелдеуге үйрету.\n\nҚалай жүргізіледі: оқушы тұжырым айтқанда, мұғалім оны үш бөлікке бөліп жаздыртады: 1) ДӘЛЕЛ (мәтіннен дәйексөз/факт), 2) ТҮСІНДІРУ (бұл дәлел не көрсетеді), 3) ҚОРЫТЫНДЫ (бұл жалпы тұжырыммен қалай байланысады).\n\nМұғалім не істейді: үлгіні (бір толық мысалды) көрсетеді, әр компонентті бөлек тексереді.\n\nОқушы не істейді: өз тұжырымын осы үш қадаммен жазбаша құрастырады.\n\nНәтиже: академиялық жазбаша дәлелдеу дағдысы, эссе жазуға дайындық.\n\nОсы 11 әдісті бір сабақта бірден қолдану міндетті емес. Әр сабаққа 1-2 әдісті таңдап, оны шығарманың сипатына (проза/поэзия, көлемі, проблематикасы) сай бейімдеу ұсынылады. Барлық әдістердің жұмыс дәптерімен байланысы тиісті парақтарда көрсетілген.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлімдегі әдістер бағдарламаның мына міндеттерін орындауға негіз болады: 5.2.4.1–9.2.4.1 «Шығармашылық жұмыс».\n\n3.3.1 «Әдеби эссе» және 3.4.1 «Әдеби сын» (толық әдістеме «Оқу бағдарламасымен сәйкестік» қосымшасының 4-бөлімінде берілген).\n\nКәсіби рефлексия: Мен соңғы айда осы 11 әдістің қайсысын қолдандым? Қайсысын әлі бір рет те қолданбадым?"

   "title": "ФОЛЬКЛОРЛЫҚ ЖАНРЛАРДЫ ТАЛДАУ",
   "text": "2–11-бөлімдердегі алгоритмдер негізінен жазба (авторлық) әдебиетке арналған. Ертегі, жыр, дастан, терме сияқты фольклорлық шығармалар бірқатар маңызды жайттармен ерекшеленеді, сондықтан оларды дәл сол қалыппен талдау елеулі қателерге әкеледі:\n\n- автор жеке тұлға емес, халық (немесе бір жыраудың дәстүрлі мектебі); мәтін ауызша таралу барысында нұсқалана береді, «канондық» бірегей нұсқа жоқ;\n\n- құрылым қатаң дәстүрлі формулаларға (тұрақты эпитеттер, үштік қайталаулар, дәстүрлі бастама-аяқтама формулалары) бағынады;\n\n- кейіпкер функциясы (В.Я.Пропптың морфологиялық әдісі бойынша – қараңыз: Пайдаланылған әдебиеттер) маңызды, ал 3-бөлімдегідей терең жеке психологиялық даралану көбіне екінші дәрежелі.\n\nБелгісі                  Ертегі                       Жыр / дастан                Терме\nАвторлығы                аноним, халықтық             жырау/ақын дәстүрлі         ақын-жыраудың\n                                                      формула аясында             жеке      толғауы,\n                                                                                  дәстүрлі өлшем\nҚұрылымы                 үштік     қайталау,          лиро-эпикалық: оқиға        философиялық-ди\n                         тұрақты формулалар           + лирикалық толғау          дактикалық,\n                                                                                  оқиғасыз\nТалдаудың      басты     Пропп     бойынша            сюжеттік   желі  +          ой-тұжырым,\nекпіні                   функциялар                   поэтикалық құрылым          өсиет\n                         (тыйым–бұзу–сынақ            (6-бөлім)\n                         –жеңіс)\n\nҚандай сұрақ қоюға болады? «Бұл ертегіде Пропп бойынша қандай функциялар (тыйым, бұзу, сынақ, жәрдемші, жеңіс) бар?» «Жырдағы қайталанатын формулалар (тұрақты эпитеттер) қандай қызмет атқарады?» «Термедегі ой қандай өмірлік тәжірибеден туындайды?»\n\nМәтінмен жұмыс мысалы. «Қозы Көрпеш – Баян сұлу» жырында (2.5-тармақта жанр мысалы ретінде аталған) лиро-эпикалық құрылым — оқиғалы желі (эпикалық) мен кейіпкерлердің сезімін білдіретін толғау-жырлар (лирикалық) кезектесіп келеді.\n\nЖиі жіберілетін қателер. Фольклорлық мәтінді авторлық шығармадай «автор нені меңзейді?» деп сұрау (2.11-тармақтағы автор позициясы ұғымы фольклорда басқаша көрініс табады); ертегі кейіпкерін 3-бөлімдегі 13 аспект бойынша толық психологиялық талдау (мұнда функциясы маңыздырақ).\n\nПрактикалық тапсырма. Бір қазақ халық ертегісін алып, Пропп функцияларының кемінде бесеуін (мысалы: бастапқы жайт, тыйым, тыйымды бұзу, сынақ, жеңіс) белгілеңіз.\n\nСабақта қалай қолдануға болады? Ертегі/жырды оқығанда алдымен «дәстүрлі формулаларды» (қайталанатын тіркестерді) бірге тауып алудан бастаңыз, содан кейін осы формулалардың қызметін талқылаңыз."

   "title": "ЗАМАНАУИ ИНТЕРПРЕТАЦИЯЛЫҚ ПЕРСПЕКТИВАЛАР",

   "title": "Экокритика",
   "text": "Негізгі ұғым. Шығармадағы табиғат бейнесін тек фон немесе символ ретінде емес, адам мен қоршаған ортаның қатынасы тұрғысынан оқу (қараңыз: Пайдаланылған әдебиеттер, Glotfelty & Fromm).\n\nҚандай сұрақ қоюға болады? «Шығармада табиғат адамға бағынышты күш ретінде ме, әлде тең құқылы «субъект» ретінде бейнеленген бе?»\n\nМәтінмен жұмыс мысалы. «Көксерек» әңгімесін (2.20-тармақта тарихи-мәдени контекст тұрғысынан талданған) экокритикалық тұрғыдан қайта оқығанда, қасқырды тек «жау» емес, адамның табиғи тепе-теңдікті бұзуының нәтижесі ретінде көруге болады – бұл 2.11-тармақтағы автор позициясы талдауын толықтырады, оны алмастырмайды."

   "text": "Алдыңғы бөлімдердегі мысалдар негізінен классикалық қазақ прозасынан (Соқпақбаев, Әуезов) алынған. Бұл бөлімде оларды толықтыратын қосымша мысалдар ұсынады.\n\n2.8 / 4.2 Конфликт – Ғ.Мүсіреповтің «Ұлпан» романы. Тұлға-қоғам конфликтісінің әйел бас кейіпкер арқылы берілуі.\n\n2.16 Символ – Ә.Нұрпейісовтің «Қан мен тер» романы. теңіз бен балықшылық символикасы.\n\n6-бөлім Поэзия – Мұқағали Мақатаевтың лирикасы. дыбыстық-ырғақтық ұйымдасуы бай, қазіргі бағдарламада жиі оқытылатын мысал.\n\n7-бөлім Проза жанрлары – О.Бөкейдің «Атау кере» повесі. Адам мен табиғат тақырыбындағы заманауи повесть үлгісі.\n\n2.9 Кейіпкерлер жүйесі (әлемдік әдебиет) – А. де Сент-Экзюпоридің «Кішкентай ханзада» повесі (аударма). Бас кейіпкер мен қосалқы кейіпкерлер (раушан гүл, түлкі) арасындағы функционалдық байланысты көрсетуге ыңғайлы, қысқа әрі әмбебап мысал. 2.22 Интерпретация (әлемдік әдебиет) – Э.Хемингуэйдің «Шал мен теңіз» повесі (аударма). «жеңіліс пе, жеңіс пе?» деген классикалық көп мағыналы интерпретация үлгісі.\n\n9-бөлім Балалар әдебиеті (әлемдік әдебиет) – Руал Даһл “Матилда”, “Чарли және шоколад фабрикасы” және т.б., Steppe&World баспасының балаларға арналған кітаптарын алып қараңыз."

   "id": "16",
   "level": 1,
   "title": "2-БӨЛІМДІ САБАҚТАРҒА БӨЛУ: КҮНТІЗБЕЛІК ҰСЫНЫС",
   "text": "2-бөлімнің 24 тармағын (2.1–2.24) бір мезетте меңгеру қиын. Төмендегі кесте – оларды жеті сабаққа бөлудің бір ұсынысы ғана; нақты уақыт мұғалімнің сынып ерекшелігіне қарай өзгеруі мүмкін (Кіріспеде аталғандай, нұсқаулықты бірізді оқу міндетті емес).\n\nСабақ         Қамтылатын тармақтар                                       Ұсынылатын\n                                                                         уақыт\n1             2.1–2.4 (Алғашқы әсер, Тақырып, Идея, Проблематика)        1 сабақ\n2             2.5–2.8 (Жанр, Сюжет, Композиция, Конфликт)                1 сабақ\n3             2.9–2.12 (Кейіпкерлер жүйесі, Эволюция, Автор              1 сабақ\n              позициясы, Нарратор)\n4             2.13–2.14, 2.24 (Уақыт, Кеңістік, Хронотоп)                1 сабақ\n5             2.15–2.17, 2.23 (Деталь, Символ, Образдар жүйесі, Мотив) 1 сабақ\n6             2.18–2.19 (Көркем тіл, Троптар)                            1 сабақ\n7             2.20–2.22 (Контекст, Қазіргі маңызы, Интерпретация)        1 сабақ\n\nПАЙДАЛАНЫЛҒАН ЖӘНЕ ҰСЫНЫЛҒАН ӘДЕБИЕТТЕР\n\nБұл нұсқаулықтағы талдау әдістемесі әдебиеттану ғылымында бірнеше онжылдық бойы қалыптасқан, әлемдік және қазақстандық әдебиеттану дәстүрінде кеңінен қабылданған ұғымдар, тәсілдер негізінде құрастырылды (мысалы, сюжет пен композиция теориясы, кейіпкер жүйесі, көркем деталь, троп пен фигура, хронотоп, оқырман-жауап теориясы, Блум таксономиясы).\n\nТөменде осы бағыттардың негізін қалаған және оларды тереңдетуге тілек білдірген әріптестерге ұсынылатын классикалық еңбектердің жалпы тізімі. Бұл тізім нұсқаулықтың әр жеке тұжырымына тікелей сілтеме ретінде емес, тақырыпты одан әрі зерттегісі келетін мұғалімдерге бағдар ретінде берілді.\n\nПАЙДАЛАНЫЛҒАН ӘДЕБИЕТТЕР\n\nI. Әдебиет теориясы және көркем шығарманы талдау негіздері\n\n1. Аристотель. Поэтика. – Ежелгі грек әдебиеттану дәстүрінің негізгі еңбектерінің бірі. Көркем жанр, мимесис, катарсис, фабула мен сюжет мәселелерінің теориялық негізін қалыптастырған.\n\n2. Пропп, В. Я. Морфология сказки. – Ленинград, 1928. – Кейінгі басылымдары: Morphology of the Folktale. – Austin: University of Texas Press, 1958; 2nd ed., 1968. – Сюжет құрылымын және кейіпкерлердің функцияларын жүйелі талдау әдістемесінің негізі.\n\n3. Freytag, G. Die Technik des Dramas. – Leipzig, 1863. – Ағылшын тіліндегі нұсқасы: Technique of the Drama. – Драмалық шығарманың бес бөлімді құрылымын («Фрейтаг пирамидасы») теориялық тұрғыдан негіздеген еңбек.\n\n4. Бахтин, М. М. Формы времени и хронотопа в романе // Вопросы литературы и эстетики. – Москва, 1975. – Ағылшын тіліндегі нұсқасы: “Forms of Time and Chronotope in the Novel” // The Dialogic Imagination: Four Essays. – Austin: University of Texas Press, 1981. – Көркем уақыт пен кеңістік, хронотоп ұғымдарын талдаудың теориялық негізі.\n\n5. Genette, G. Figures III. – Paris: Éditions du Seuil, 1972. – Ағылшын тіліндегі нұсқасы: Narrative Discourse: An Essay in Method. – Ithaca: Cornell University Press, 1980. – Нарратив, баяндау деңгейлері, уақыт, фокализация және баяндаушыны талдау әдістемесінің негізгі теориялық көзі.\n\n6. Richards, I. A. Practical Criticism: A Study of Literary Judgment. – London: Kegan Paul, 1929. – Мәтінді тікелей талдау мен close reading дәстүрінің қалыптасуына ықпал еткен классикалық еңбек.\n\n7. Brooks, C., Warren, R. P. Understanding Poetry. – New York: Henry Holt, 1938. – Поэзияны құрылымдық, образдық және мағыналық тұрғыдан талдаудың классикалық оқу-әдістемелік негіздерінің бірі.\n\n8. Rosenblatt, L. M. Literature as Exploration. – New York: Modern Language Association, 1938. – Қайта басылымдары: 1968, 1976, 1995.​\n\nRosenblatt, L. M. The Reader, the Text, the Poem: The Transactional Theory of the Literary Work. – Carbondale: Southern Illinois University Press, 1978. – Оқырман мен мәтіннің өзара әрекеттесуіне негізделген трансактивті оқу теориясының негізгі еңбектері.\n\n9. Выготский, Л. С. Психология искусства. – Москва, 1965. – Көркем қабылдау, эмоция және өнердің психологиялық табиғатын түсіндіруге арналған негізгі еңбек.​\n\nВыготский, Л. С. Мышление и речь. – Москва, 1934. – Ойлау, тіл және танымдық даму мәселелерінің теориялық негізі.\n\nII. Педагогикалық таксономия және оқу мақсаттары\n\n10.​Bloom, B. S. (ed.). Taxonomy of Educational Objectives. Handbook I: Cognitive Domain. – New York: David McKay, 1956. – Оқу мақсаттарын танымдық күрделілік деңгейлері бойынша жіктеудің бастапқы теориялық негізі. 11.​Anderson, L. W., Krathwohl, D. R. (eds.). A Taxonomy for Learning, Teaching, and Assessing: A Revision of Bloom's Taxonomy of Educational Objectives. – New York: Longman, 2001. – Блум таксономиясының қайта қаралған нұсқасы: есте сақтау – түсіну – қолдану – талдау – бағалау – жасау. Нұсқаулықтағы оқу тапсырмалары мен сұрақтарды танымдық деңгейлер бойынша құрастырудың негізі.\n\nIII. Қазақ әдебиеттану дәстүрі\n\n12.​Қабдолов, З. Сөз өнері. – Алматы. – Алғашқы нұсқасы Әдебиет теориясының негіздері атауымен 1970 жылы жарық көрген. Кейін толықтырылып, Сөз өнері атауымен бірнеше рет қайта басылған. – Тақырып, идея, образ, композиция, көркемдік әдіс және әдебиеттің теориялық мәселелерін талдаудың негізгі оқулығы.\n\n13.​Ахметов, З. Өлең сөздің теориясы. – Алматы, 1973. – Қазақ өлеңінің құрылымы, ырғақ, буын, ұйқас және өлең жүйесін талдаудың теориялық негізі.\n\nIV. Заманауи интерпретациялық теориялар\n\n14.​Glotfelty, C., Fromm, H. (eds.). The Ecocriticism Reader: Landmarks in Literary Ecology. – Athens: University of Georgia Press, 1996. – Экокритикалық әдеби талдаудың негізгі теориялық еңбектерінің бірі.\n\n15.​Showalter, E. A Literature of Their Own: British Women Novelists from Brontë to Lessing. – Princeton: Princeton University Press, 1977. – Феминистік және гендерлік әдеби сынның қалыптасуына ықпал еткен негізгі зерттеу. 16.​Said, E. W. Orientalism. – New York: Pantheon Books, 1978. – Постколониалдық әдеби сынның негізгі теориялық еңбектерінің бірі.\n\n17.​Said, E. W. Culture and Imperialism. – New York: Alfred A. Knopf, 1993. – Әдебиетті отаршылдық, мәдени билік және империялық дискурс тұрғысынан талдаудың теориялық негіздерінің бірі.\n\n18.​Freud, S. Der Dichter und das Phantasieren [Creative Writers and Day-Dreaming]. – 1908. – Көркем шығармашылықты, қиялды және әдеби мәтінді психоаналитикалық тұрғыдан түсіндірудің бастапқы теориялық еңбектерінің бірі."
  }
 ]
};
</script>

<script>
'use strict';
/* Index of sheets by id (built from WORKBOOK; never edited by hand). */
const WORKSHEETS = {};
WORKBOOK.worksheets.slice().sort((a, b) => a.order - b.order).forEach(ws => { WORKSHEETS[ws.id] = ws; });

/* ==============================================================================
   STATE
   ============================================================================== */
let storageAvailable = true;
let state = freshState();
let saveTimer = null;
let banner = null;              // { kind: 'error'|'ok'|'warn', text }

function freshState() {
  return {
    app: CONFIG.APP_ID,
    version: CONFIG.DATA_VERSION,
    meta: { genre: CONFIG.DEFAULT_GENRE, title: '', author: '', grade: '' },
    answers: {},
    lessonPlan: { text: '', edited: false },
    ui: freshUi(),
  };
}

function freshUi() {
  return { step: 'ws-01-first-reading', tab: 'book', guideSection: GUIDE.sections[0].id, search: '' };
}

function genre() { return GENRES[state.meta.genre] || GENRES[CONFIG.DEFAULT_GENRE]; }

function sheetsForGenre() {
  return Object.values(WORKSHEETS).filter(ws =>
    ws.genres.includes('all') || ws.genres.includes(state.meta.genre));
}
function isPrintOnly(ws) { return CONFIG.PRINT_ONLY_AUDIENCES.includes(ws.audience); }
function isTeacherSheet(ws) { return CONFIG.TEACHER_AUDIENCES.includes(ws.audience); }

/** Sheets the teacher fills in (they count towards progress). */
function fillableSheets() {
  return sheetsForGenre().filter(ws => ws.id !== CONFIG.RUBRIC_SHEET && !isPrintOnly(ws));
}

/** Navigation groups, in display order. Each step has a unique `key`. */
function stepGroups() {
  const sheets = sheetsForGenre().filter(ws => ws.id !== CONFIG.RUBRIC_SHEET);
  const asStep = ws => ({ key: ws.id, kind: 'sheet', ws: ws });
  return [
    { title: t('groupAnalysis'), steps: sheets.filter(ws => !ws.audience).map(asStep) },
    { title: t('groupTeacher'), steps: sheets.filter(isTeacherSheet).map(asStep) },
    { title: t('groupStudent'), steps: sheets.filter(isPrintOnly).map(asStep) },
    { title: t('groupOutputs'), steps: [
      { key: 'plan', kind: 'plan' },
      { key: 'rubric', kind: 'rubric', ws: WORKSHEETS[CONFIG.RUBRIC_SHEET] },
    ] },
  ].filter(g => g.steps.length);
}
function steps() { return stepGroups().flatMap(g => g.steps); }
function currentIndex() {
  const i = steps().findIndex(s => s.key === state.ui.step);
  return i < 0 ? 0 : i;
}
function currentStep() { return steps()[currentIndex()]; }

function defaultValue(field) {
  switch (field.type) {
    case 'list': return Array(CONFIG.LIST_ROWS).fill('');
    case 'tags': return [];
    case 'table': return Array.from({ length: field.rows }, () => Array(field.columns.length).fill(''));
    default: return '';
  }
}

function getAnswer(wsId, field) {
  const ws = state.answers[wsId];
  const v = ws ? ws[field.id] : undefined;
  if (v === undefined) return defaultValue(field);
  if (field.type === 'list') {            // always exactly LIST_ROWS items
    const arr = v.slice(0, CONFIG.LIST_ROWS);
    while (arr.length < CONFIG.LIST_ROWS) arr.push('');
    return arr;
  }
  if (field.type === 'table') {           // always rows × columns
    return defaultValue(field).map((row, r) => row.map((_, c) => (v[r] && typeof v[r][c] === 'string') ? v[r][c] : ''));
  }
  return v;
}

function setAnswer(wsId, fieldId, value) {
  if (!state.answers[wsId]) state.answers[wsId] = {};
  state.answers[wsId][fieldId] = value;
  onStateChanged();
}

function filled(s) { return typeof s === 'string' && s.trim() !== ''; }

/* Completion rules: text/long/dropdown non-empty; list ≥ LIST_MIN_FILLED rows;
   tags ≥ 1 choice; table ≥ 1 fully filled row. Rubric fields are not inputs. */
function isValueComplete(field, v) {
  switch (field.type) {
    case 'list': return v.filter(filled).length >= CONFIG.LIST_MIN_FILLED;
    case 'tags': return v.length > 0;
    case 'table': return v.some(row => row.every(filled));
    case 'rubric': return true;
    default: return filled(v);
  }
}

function isSheetComplete(ws) {
  return ws.fields.every(f => isValueComplete(f, getAnswer(ws.id, f)));
}

function loadState() {
  try {
    let raw = window.localStorage.getItem(CONFIG.STORAGE_KEY);
    for (const k of CONFIG.LEGACY_STORAGE_KEYS) { if (!raw) raw = window.localStorage.getItem(k); }
    if (raw) {
      const parsed = JSON.parse(raw);
      const clean = validateImport(parsed);
      const u = isObj(parsed.ui) ? parsed.ui : {};
      clean.ui = {
        step: typeof u.step === 'string' ? u.step : clean.ui.step,
        tab: u.tab === 'guide' ? 'guide' : 'book',
        guideSection: typeof u.guideSection === 'string' && GUIDE_INDEX[u.guideSection] ? u.guideSection : clean.ui.guideSection,
        search: typeof u.search === 'string' ? u.search.slice(0, 200) : '',
      };
      state = clean;
    }
  } catch (e) { /* unreadable or blocked storage: start fresh */ }
  try {   // probe that writes work
    const k = CONFIG.STORAGE_KEY + ':probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
  } catch (e) { storageAvailable = false; }
}

function saveStateNow() {
  if (!storageAvailable) return;
  try {
    window.localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
    setSaveStatus(t('saved'));
  } catch (e) {
    storageAvailable = false;
    setSaveStatus();
  }
}

function scheduleSave() {
  if (!storageAvailable) return;
  setSaveStatus(t('saving'));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 300);
}

/** Called after any answer/meta change: persist and refresh light-weight UI. */
function onStateChanged() {
  scheduleSave();
  renderSidebar();
  renderFooter();
}

/* ==============================================================================
   RENDER
   ============================================================================== */

/* Pages opened through a shared link run inside a frame that blocks
   window.print(), file downloads and confirm(); offer alternatives there. */
const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---- In-page dialogs (browser confirm() is blocked in some viewers) ---- */
function openDialog(title, body, actions) {
  const prev = document.activeElement;
  const overlay = h('div', { class: 'dlg-overlay' });
  const close = () => { overlay.remove(); if (prev && prev.focus) prev.focus(); };
  const box = h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-title' },
    h('h2', { id: 'dlg-title', text: title }), body,
    h('div', { class: 'dlg-actions' }, actions.map(a => h('button', {
      type: 'button', class: 'btn' + (a.primary ? ' primary' : ''), text: a.label,
      onclick: e => { if (a.onclick && a.onclick(e) === false) return; close(); },
    }))));
  overlay.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.append(box);
  document.body.append(overlay);
  const first = box.querySelector('textarea:not([readonly]), .btn.primary');
  if (first) first.focus();
  return close;
}

function askConfirm(text, onYes) {
  openDialog(t('confirmTitle'), h('p', { text: text }), [
    { label: t('cancel') },
    { label: t('confirmYes'), primary: true, onclick: () => { onYes(); } },
  ]);
}

/** Copy a textarea's text; falls back to selecting it for Ctrl+C. */
function copyText(el, btn) {
  const ok = () => { if (btn) btn.textContent = t('copied'); };
  const fallback = () => { el.focus(); el.select(); if (btn) btn.textContent = t('copySelected'); };
  try { navigator.clipboard.writeText(el.value).then(ok, fallback); } catch (e) { fallback(); }
}

/** Tiny DOM builder: h('div', {class:'x', onclick: fn}, child, ...). */
function h(tag, props) {
  const el = document.createElement(tag);
  const children = Array.prototype.slice.call(arguments, 2).flat(Infinity);
  let value;
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') value = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  if (value !== undefined) el.value = value;  // after options exist (select)
  return el;
}

function render() {
  renderTopbar();
  renderSidebar();
  renderMain();
  renderFooter();
}

function setSaveStatus(text) {
  const el = document.getElementById('save-status');
  if (!el) return;
  if (!storageAvailable) {
    el.textContent = t('storageOff');
    el.className = 'save-status off';
  } else {
    el.textContent = text || '';
    el.className = 'save-status';
  }
}

function metaInput(id, key, labelKey, phKey, max) {
  return h('div', { class: 'tb-field' },
    h('label', { for: id, text: t(labelKey) }),
    h('input', {
      id: id, type: 'text', maxlength: max, value: state.meta[key],
      placeholder: t(phKey), autocomplete: 'off',
      oninput: e => { state.meta[key] = e.target.value; onStateChanged(); },
    }));
}

function renderTopbar() {
  const bar = document.getElementById('topbar');
  bar.classList.toggle('more-open', moreOpen);
  bar.replaceChildren(
    h('button', { class: 'btn nav-toggle', type: 'button', 'aria-label': t('navOpen'),
      'aria-expanded': document.body.classList.contains('nav-open') ? 'true' : 'false',
      onclick: openNav }, '☰ ', t(state.ui.tab === 'guide' ? 'navGuide' : 'navBook')),
    h('div', { class: 'brand' },
      h('span', { class: 'brand-mark', 'aria-hidden': 'true' }),
      h('div', null,
      h('h1', { text: t('appTitle') }),
      h('p', { text: t('appSubtitle') }))),
    h('button', { class: 'btn more-toggle', type: 'button', 'aria-label': t('moreToggle'), title: t('moreToggle'),
      'aria-expanded': moreOpen ? 'true' : 'false',
      onclick: e => {
        moreOpen = !moreOpen;
        bar.classList.toggle('more-open', moreOpen);
        e.currentTarget.setAttribute('aria-expanded', moreOpen ? 'true' : 'false');
      } }, '⚙'),
    h('div', { class: 'tabs', role: 'tablist', 'aria-label': t('tabsLabel') },
      ['book', 'guide'].map(tab => h('button', {
        type: 'button', role: 'tab', class: 'tab', id: 'tab-' + tab,
        'aria-selected': state.ui.tab === tab ? 'true' : 'false',
        onclick: () => switchTab(tab),
      }, t(tab === 'book' ? 'tabBook' : 'tabGuide')))),
    h('div', { class: 'tb-field' },
      h('label', { for: 'tb-genre', text: t('genre') }),
      h('select', {
        id: 'tb-genre', value: state.meta.genre,
        onchange: e => {
          state.meta.genre = e.target.value;
          if (!state.lessonPlan.edited) state.lessonPlan.text = '';
          onStateChanged(); render();
        },
      }, Object.keys(GENRES).map(id => h('option', { value: id }, GENRES[id].label)))),
    metaInput('tb-title', 'title', 'workTitle', 'workTitlePh', 300),
    metaInput('tb-author', 'author', 'author', 'authorPh', 200),
    h('div', { class: 'tb-field' },
      h('label', { for: 'tb-grade', text: t('grade') }),
      h('select', {
        id: 'tb-grade', value: state.meta.grade,
        onchange: e => { state.meta.grade = e.target.value; onStateChanged(); },
      }, h('option', { value: '' }, t('gradePh')),
        CONFIG.GRADES.map(g => h('option', { value: String(g) }, g + t('gradeSuffix'))))),
    h('div', { class: 'tb-actions' },
      h('button', { class: 'btn', type: 'button', onclick: exportJson, text: t('exportBtn') }),
      h('button', { class: 'btn', type: 'button', onclick: importDialog, text: t('importBtn') }),
      h('button', { class: 'btn primary', type: 'button', onclick: () => printOutputs(defaultPrintTarget()), text: t('printBtn') }),
      h('button', { class: 'btn danger', type: 'button', onclick: resetAll, text: t('resetBtn') }),
      h('span', { id: 'save-status', class: 'save-status', 'aria-live': 'polite' })),
  );
  setSaveStatus();
}

function stepLabel(step) {
  if (step.kind === 'plan') return t('lessonPlan');
  if (step.kind === 'rubric') return t('rubric');
  return step.ws.title;
}

function renderSidebar() {
  if (state.ui.tab === 'guide') { renderGuideSidebar(); return; }
  const nav = document.getElementById('sidebar');
  const active = currentStep().key;
  const parts = [];
  stepGroups().forEach(g => {
    parts.push(h('h2', { text: g.title }));
    parts.push(h('ul', { class: 'steps' }, g.steps.map(step => {
      const done = step.kind === 'sheet' && !isPrintOnly(step.ws) && isSheetComplete(step.ws);
      const marker = step.kind === 'plan' ? '≡' : step.kind === 'rubric' ? '31' : done ? '✓' : String(step.ws.order);
      return h('li', null, h('button', {
        type: 'button',
        class: 'step-btn' + (done ? ' done' : ''),
        'aria-current': step.key === active ? 'step' : null,
        title: done ? step.ws.order + ' — ' + t('complete') : null,
        onclick: () => goTo(step.key),
      },
      h('span', { class: 'step-num', 'aria-hidden': 'true' }, marker),
      h('span', { class: 'step-label' }, stepLabel(step),
        done ? h('span', { class: 'sr-only' }, ' — ' + t('complete')) : null)));
    })));
  });
  parts.push(h('p', { class: 'privacy', text: t('privacy') }));
  nav.replaceChildren.apply(nav, parts);
}

function renderFooter() {
  if (state.ui.tab === 'guide') { renderGuideFooter(); return; }
  const foot = document.getElementById('footer');
  const ws = fillableSheets();
  const done = ws.filter(isSheetComplete).length;
  const pct = ws.length ? Math.round(done / ws.length * 100) : 0;
  const all = steps(), i = currentIndex();
  foot.replaceChildren(
    h('button', { class: 'btn', type: 'button', disabled: i === 0, onclick: () => goTo(all[i - 1].key), text: t('prev') }),
    h('div', { class: 'progress' },
      h('div', { class: 'progress-track', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': pct },
        h('div', { class: 'progress-fill', style: 'width:' + pct + '%' })),
      h('span', { class: 'progress-label', text: t('progress', { done: done, total: ws.length }) })),
    h('button', { class: 'btn primary', type: 'button', disabled: i >= all.length - 1, onclick: () => goTo(all[i + 1].key), text: t('next') }),
  );
}

/* ---- Small screens: sidebar drawer + collapsible top bar ---- */
let moreOpen = false;
function openNav() {
  document.body.classList.add('nav-open');
  const cur = document.querySelector('#sidebar [aria-current]');
  const first = cur || document.querySelector('#sidebar button, #sidebar input');
  if (first) first.focus();
}
function closeNav() { document.body.classList.remove('nav-open'); }

function goTo(key) {
  closeNav();
  state.ui.step = key;
  state.ui.tab = 'book';
  scheduleSave();
  render();
  document.getElementById('main').scrollTop = 0;
}

function showBanner(kind, text) { banner = { kind: kind, text: text }; renderBanner(); }

function renderBanner() {
  const slot = document.getElementById('banner-slot');
  if (!slot) return;
  slot.replaceChildren(banner ? h('div', { class: 'banner ' + banner.kind, role: banner.kind === 'error' ? 'alert' : 'status' },
    h('p', { text: banner.text }),
    h('button', { type: 'button', 'aria-label': t('close'), onclick: () => { banner = null; renderBanner(); } }, '×')) : '');
}

function renderMain() {
  const box = document.getElementById('main-inner');
  if (state.ui.tab === 'guide') {
    box.replaceChildren(h('div', { id: 'banner-slot' }), renderGuideMain());
    renderBanner();
    return;
  }
  const step = currentStep();
  const content = step.kind === 'plan' ? renderLessonPlan()
    : step.kind === 'rubric' ? renderRubric()
    : renderSheet(step.ws);
  box.replaceChildren(h('div', { id: 'banner-slot' }), content);
  renderBanner();
}

/* ---- Sheet rendering (generic, driven by WORKBOOK data) ---- */

function sheetHeader(ws) {
  const meta = [ws.guide ? t('guideRef', { guide: ws.guide }) : '', ws.standard ? t('standardRef', { standard: ws.standard }) : '']
    .filter(Boolean).join(' · ');
  return [
    h('p', { class: 'ws-kicker', text: t('sheetKicker', { n: ws.order }) }),
    h('h2', { class: 'ws-title', text: ws.title }),
    meta ? h('p', { class: 'ws-meta', text: meta }) : null,
    guideRefs(ws.guide).length ? h('div', { class: 'ws-tools' }, guideRefs(ws.guide).map(id => h('button', {
      class: 'btn guide-link', type: 'button', title: guideHeading(GUIDE_INDEX[id]),
      onclick: () => openGuide(id),
    }, t('guideBtn', { id: id })))) : null,
    ws.note ? h('div', { class: 'banner warn' }, h('p', { text: ws.note })) : null,
  ];
}

function renderSheet(ws) {
  const tools = h('div', { class: 'ws-tools' },
    h('button', { class: 'btn', type: 'button', text: t('printBlank'), onclick: () => printOutputs('blank:' + ws.id) }));
  if (isPrintOnly(ws)) {
    return h('section', null, sheetHeader(ws),
      h('div', { class: 'banner warn' }, h('p', { text: t('printOnlyNote') })),
      h('div', { class: 'card' },
        h('span', { class: 'field-label', text: t('printOnlyFields') }),
        h('ol', { class: 'label-list' }, ws.fields.map(f => h('li', { text: f.label })))),
      tools);
  }
  return h('section', null, sheetHeader(ws), tools,
    ws.id === CONFIG.PLOT_SHEET ? renderPlotBar(ws) : null,
    ws.fields.map(f => renderField(ws.id, f)));
}

function fieldDomId(wsId, fid, extra) { return ['f', wsId, fid, extra].filter(x => x != null).join('-'); }

function renderField(wsId, field) {
  const value = getAnswer(wsId, field);
  const id = fieldDomId(wsId, field.id);
  const label = h('label', { class: 'field-label', for: id, text: field.label });
  switch (field.type) {
    case 'text':
    case 'long':
      return h('div', { class: 'card' }, label,
        h(field.type === 'text' ? 'input' : 'textarea', {
          id: id, type: field.type === 'text' ? 'text' : null, value: value,
          maxlength: CONFIG.MAX_TEXT_LENGTH,
          oninput: e => {
            setAnswer(wsId, field.id, e.target.value);
            if (wsId === CONFIG.PLOT_SHEET) updatePlotBar();
          },
        }));

    case 'dropdown':
      return h('div', { class: 'card' }, label,
        h('select', { id: id, value: value, onchange: e => setAnswer(wsId, field.id, e.target.value) },
          h('option', { value: '' }, t('selectPh')),
          field.options.map(o => h('option', { value: o }, o))));

    case 'list':
      return h('div', { class: 'card' },
        h('span', { class: 'field-label', id: id + '-label', text: field.label }),
        h('div', { class: 'list-inputs', role: 'group', 'aria-labelledby': id + '-label' },
          value.map((v, i) => h('div', { class: 'list-row' },
            h('span', { text: (i + 1) + ')' }),
            h('input', {
              type: 'text', value: v, maxlength: 2000, 'aria-label': field.label + ' ' + (i + 1),
              oninput: e => {
                const arr = getAnswer(wsId, field).slice();
                arr[i] = e.target.value;
                setAnswer(wsId, field.id, arr);
              },
            })))));

    case 'tags':
      return h('div', { class: 'card' },
        h('span', { class: 'field-label', id: id + '-label', text: field.label }),
        h('div', { class: 'chips', role: 'group', 'aria-labelledby': id + '-label' },
          field.options.map(o => h('button', {
            type: 'button', class: 'chip', 'aria-pressed': value.includes(o) ? 'true' : 'false',
            onclick: e => {
              const cur = getAnswer(wsId, field);
              const next = cur.includes(o) ? cur.filter(x => x !== o) : field.options.filter(x => x === o || cur.includes(x));
              e.currentTarget.setAttribute('aria-pressed', next.includes(o) ? 'true' : 'false');
              setAnswer(wsId, field.id, next);
            },
          }, o))));

    case 'table':
      return h('div', { class: 'card' },
        h('span', { class: 'field-label', id: id + '-label', text: field.label }),
        h('table', { class: 'ws-table', 'aria-labelledby': id + '-label' },
          h('thead', null, h('tr', null, h('th'), field.columns.map(c => h('th', { scope: 'col', text: c })))),
          h('tbody', null, value.map((row, r) => h('tr', null,
            h('td', { class: 'rownum', text: (r + 1) + '.' }),
            row.map((cell, c) => h('td', null, h('textarea', {
              value: cell, rows: 2, maxlength: 2000,
              'aria-label': field.columns[c] + ', ' + (r + 1),
              oninput: e => {
                const grid = getAnswer(wsId, field).map(x => x.slice());
                grid[r][c] = e.target.value;
                setAnswer(wsId, field.id, grid);
              },
            }))))))));

    case 'rubric':
      return h('div', { class: 'card' }, h('span', { class: 'field-label', text: field.label }), rubricTable(field));
  }
  return null;
}

/* Plot curve: one bar per plot-stage field, coloured once filled. */
let plotCols = {};
function renderPlotBar(ws) {
  const stages = ws.fields.filter(f => CONFIG.PLOT_CURVE[f.id] != null);
  plotCols = {};
  const shortName = f => f.label.replace(/\s*\(.*$/, '');
  const style = '--n:' + stages.length;
  return h('div', { class: 'card' },
    h('div', { class: 'stagebar', style: style, role: 'img', 'aria-label': t('plotBarLabel') },
      stages.map(f => (plotCols[f.id] = h('button', {
        type: 'button', tabindex: '-1', title: shortName(f),
        class: 'stage-col' + (filled(getAnswer(ws.id, f)) ? ' filled' : ''),
        onclick: () => document.getElementById(fieldDomId(ws.id, f.id)).focus(),
      }, h('span', { class: 'stage-bar', style: 'height:' + CONFIG.PLOT_CURVE[f.id] + '%' }))))),
    h('div', { class: 'stage-names', style: style, 'aria-hidden': 'true' }, stages.map(f => h('span', { text: shortName(f) }))));
}
function updatePlotBar() {
  const ws = WORKSHEETS[CONFIG.PLOT_SHEET];
  ws.fields.forEach(f => { if (plotCols[f.id]) plotCols[f.id].classList.toggle('filled', filled(getAnswer(ws.id, f))); });
}

/** Value of one path, or null when empty. Arrays = multi-row values. */
function resolvePath(path) {
  if (path.indexOf('label:') === 0) {
    const p = path.slice(6).split('.');
    const f = findField(p[0], p[1]);
    return f ? f.label : null;
  }
  const p = path.split('.');
  if (p[0] === 'meta') {
    const title = filled(state.meta.title) ? oneLine(state.meta.title) : t('untitled');
    switch (p[1]) {
      case 'title': return title;
      case 'author': return filled(state.meta.author) ? oneLine(state.meta.author) : null;
      case 'genre': return genre().label;
      case 'grade': return state.meta.grade ? state.meta.grade + t('gradeSuffix') : null;
      case 'topicDefault': return '«' + title + '» шығармасын талдау';
      case 'goalDefault': return '«' + title + '» шығармасының мазмұнын, құрылымын және кейіпкерлерін мәтінге сүйеніп талдау.';
      case 'assessDefault': return '31-парақтағы рубрика бойынша (12 балл).';
    }
    return null;
  }
  const field = findField(p[0], p[1]);
  if (!field) return null;
  const v = getAnswer(p[0], field);
  switch (field.type) {
    case 'list': { const xs = v.filter(filled).map(oneLine); return xs.length ? xs : null; }
    case 'tags': return v.length ? v.join(', ') : null;
    case 'table': {
      const rows = v.filter(r => r.some(filled)).map(r => r.map(c => filled(c) ? oneLine(c) : '—').join(' — '));
      return rows.length ? rows : null;
    }
    case 'rubric': return null;
    default: return filled(v) ? oneLine(v) : null;
  }
}

function resolveToken(expr, ctx) {
  if (expr === 'total') return String(ctx.total);
  for (const alt of expr.split('??')) {
    const r = resolvePath(alt.trim());
    if (r != null) return r;
  }
  return null;
}

/** Expand template lines with tokens, applying the given indent. */
function expandLines(lines, indent, ctx) {
  const out = [];
  lines.forEach(raw => {
    const optional = raw.charAt(0) === '?';
    const line = optional ? raw.slice(1) : raw;
    const solo = line.trim().match(/^\{([^{}]+)\}$/);
    if (solo) {
      const r = resolveToken(solo[1], ctx);
      const lead = line.match(/^\s*/)[0];
      if (Array.isArray(r)) { r.forEach((x, i) => out.push(indent + lead + '  ' + (i + 1) + ') ' + x)); return; }
      if (r == null) { if (!optional) out.push(indent + lead + '  ' + t('empty')); return; }
    }
    let any = false, tokens = 0;
    const text = line.replace(/\{([^{}]+)\}/g, (m, expr) => {
      tokens++;
      const r = resolveToken(expr, ctx);
      if (r == null) return t('empty');
      if (!/^label:/.test(expr) && expr !== 'total') any = true;
      return Array.isArray(r) ? r.join('; ') : r;
    });
    if (optional && tokens && !any) return;
    out.push(indent + text);
  });
  return out;
}

function activitySet() {
  return LESSON_PLAN.activities[genre().activities] || LESSON_PLAN.activities.default;
}
function stageMinutes(stage) {
  return stage.activities ? activitySet().reduce((a, x) => a + x.minutes, 0) : stage.minutes;
}

function generateLessonPlan() {
  const total = LESSON_PLAN.stages.reduce((a, s) => a + stageMinutes(s), 0);
  const ctx = { total: total };
  const min = t('minutes');
  let out = expandLines(LESSON_PLAN.header, '', ctx);
  out.push('');
  LESSON_PLAN.stages.forEach((s, i) => {
    out.push((i + 1) + '. ' + s.title + ' — ' + stageMinutes(s) + ' ' + min);
    if (s.lines) out = out.concat(expandLines(s.lines, '   ', ctx));
    if (s.activities) activitySet().forEach((a, j) => {
      out.push('   ' + (i + 1) + '.' + (j + 1) + '. ' + a.title + ' — ' + a.minutes + ' ' + min);
      out = out.concat(expandLines(a.lines, '        ', ctx));
    });
    out.push('');
  });
  out = out.concat(expandLines(LESSON_PLAN.footer, '', ctx));
  return { text: out.join('\n'), total: total };
}

/** Sheets referenced by the current template (for the info banner). */

  const src = JSON.stringify([LESSON_PLAN.header, LESSON_PLAN.stages, LESSON_PLAN.footer, activitySet()]);

const GUIDE_INDEX = {};
GUIDE.sections.forEach((sec, i) => { sec.index = i; GUIDE_INDEX[sec.id] = sec; });

function guideHeading(sec) {

/** Section ids named in a worksheet's "guide" string ("2.8, 4.2", "3 (соңғы тармақ), 2.10"). */
function guideRefs(str) {
  const ids = String(str || '').match(/\d+(?:\.\d+)?/g) || [];
  return ids.filter((id, i) => ids.indexOf(id) === i && GUIDE_INDEX[id]);

/** Sheets visible in the current genre whose "guide" field points at a section. */

function switchTab(tab) {
