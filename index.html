<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Көркем шығарманы талдау</title>
<!--
================================================================================
  КӨРКЕМ ШЫҒАРМАНЫ ТАЛДАУ — мұғалімге арналған құрал (kobem-talday.html)
  «Көркем шығарманы талдау» практикалық жұмыс дәптері (31 парақ) негізінде.
================================================================================

README

  How to open
    - Double-click kobem-talday.html (Chrome / Edge / Firefox / Safari).
      No internet, server or installation needed; the file makes no network
      requests, so it works fully offline.
    - Work is saved automatically in this browser (localStorage). If storage is
      blocked, a warning appears in the top bar — use Export JSON.

  How to export / import
    - "JSON экспорттау" downloads a .json backup of the current analysis.
    - "JSON импорттау" loads such a file on another device. The file is
      validated; a malformed file shows a Kazakh error and nothing is changed.
    - No student personal data is stored. Student-facing sheets (e.g. 26,
      self-assessment) and the "Оқушының аты-жөні" header exist only as blank
      printouts.

  How to change worksheets or add a genre (data only)
    - WORKBOOK (the WORKSHEETS data block) holds all 31 sheets exactly as in the
      workbook JSON. Edit labels there, or paste a newer export of the JSON.
      Field types: text, long, list (3 rows), table (columns × rows),
      dropdown (options), tags (multi-choice options), rubric.
    - A sheet's "genres" says where it appears: ["all"] or a genre id.
    - To add a genre: add an entry to CONFIG → GENRES (label + lessonPlan
      activity set), tag its sheets with the genre id, and optionally add an
      activity set in LESSON_PLAN → activities.
    - UI labels live in STRINGS (one object) so a Russian version can be added.

  Two tabs
    - "Дәптер": the 31 worksheets, lesson plan and rubric. Each worksheet has
      "Нұсқаулық: N →" buttons for the guide sections in its "guide" field.
    - "Нұсқаулық": the methodology guide (GUIDE block), one section at a time,
      with chapter navigation and search. "Дәптерге оралу" goes back to the
      worksheet; typed answers are kept.

  Rebuilding the data blocks (only needed when the PDF or JSON changes)
      pdftotext -layout guide.pdf guide.txt
      python3 build_guide.py guide.txt guide.json      # stops if 1–16 or 2.1–2.24 are missing
      python3 assemble.py base.html worksheets.json guide.json app.html
      python3 theme.py app.html kobem-talday.html       # ornament theme + phone/tablet layout

  Code sections: CONFIG, STRINGS, WORKSHEETS, GUIDE, STATE, RENDER, LESSON_PLAN,
  RUBRIC, GUIDE VIEW, PRINT, IMPORT/EXPORT, INIT.
================================================================================
-->
<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --ink: #1f2328;
    --ink-2: #545b64;
    --line: #dcd7cd;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --accent-soft: #e3f1ec;
    --warn: #8a5a00;
    --warn-soft: #fff4dc;
    --danger: #a3271f;
    --danger-soft: #fde8e6;
    --stage-empty: #e8e3d8;
    --radius: 8px;
    --font: "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
    --overlay: rgba(20, 24, 26, .5);
    --mark: #ffe08a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191b; --surface: #1f2427; --surface-2: #1a1e21; --ink: #e6e9ea; --ink-2: #a2abb1;
      --line: #353c41; --accent: #56b79c; --accent-ink: #0d1a16; --accent-soft: #1c3830;
      --warn: #e4b45e; --warn-soft: #382c14; --danger: #f08b80; --danger-soft: #3b1d1a;
      --stage-empty: #2d3337; --overlay: rgba(0, 0, 0, .6); --mark: #7a5f12; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191b; --surface: #1f2427; --surface-2: #1a1e21; --ink: #e6e9ea; --ink-2: #a2abb1;
    --line: #353c41; --accent: #56b79c; --accent-ink: #0d1a16; --accent-soft: #1c3830;
    --warn: #e4b45e; --warn-soft: #382c14; --danger: #f08b80; --danger-soft: #3b1d1a;
    --stage-empty: #2d3337; --overlay: rgba(0, 0, 0, .6); --mark: #7a5f12; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- App layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "side main" "side foot";
    height: 100%;
  }
  .topbar {
    grid-area: top;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { margin-right: auto; min-width: 180px; }
  .brand h1 { margin: 0; font-size: 18px; line-height: 1.2; }
  .brand p { margin: 0; font-size: 12px; color: var(--ink-2); }
  .tb-field { display: flex; flex-direction: column; gap: 2px; }
  .tb-field label { font-size: 12px; color: var(--ink-2); }
  .tb-field input { width: 210px; }
  .tb-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .save-status { font-size: 12px; color: var(--ink-2); min-width: 70px; }
  .save-status.off { color: var(--warn); }

  .sidebar {
    grid-area: side;
    overflow-y: auto;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    padding: 12px 10px;
  }
  .sidebar h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-2); margin: 10px 8px 6px;
  }
  .steps { list-style: none; margin: 0 0 6px; padding: 0; }
  .step-btn {
    width: 100%; display: flex; align-items: flex-start; gap: 10px;
    text-align: left; padding: 6px 8px; margin-bottom: 1px;
    border: 1px solid transparent; border-radius: var(--radius);
    background: transparent; cursor: pointer;
  }
  .step-btn:hover { background: var(--surface); border-color: var(--line); }
  .step-btn[aria-current="step"] { background: var(--accent-soft); border-color: var(--accent); }
  .step-num {
    flex: none; min-width: 26px; height: 24px; border-radius: 12px; padding: 0 4px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  .step-btn.done .step-num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step-label { font-size: 13.5px; line-height: 1.35; padding-top: 2px; }
  .privacy { font-size: 12px; color: var(--ink-2); margin: 12px 8px; }
  .sr-only { position: absolute; left: -9999px; }

  .main { grid-area: main; overflow-y: auto; padding: 20px 28px 40px; }
  .main-inner { max-width: 900px; margin: 0 auto; }
  .ws-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; margin: 0; }
  .ws-title { font-size: 22px; margin: 0 0 4px; }
  .ws-meta { color: var(--ink-2); font-size: 13px; margin: 0 0 16px; }
  .ws-intro { color: var(--ink-2); margin: 0 0 16px; }
  .ws-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .footer {
    grid-area: foot;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .progress { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .progress-track { height: 8px; background: var(--stage-empty); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .progress-label { font-size: 12px; color: var(--ink-2); }

  /* ---------- Controls ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--surface);
    padding: 7px 12px; border-radius: var(--radius); cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--danger); }
  input[type=text], select, textarea {
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; background: var(--surface); width: 100%;
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, .step-btn:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* ---------- Worksheet fields ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  }
  .field-label { display: block; font-weight: 600; margin-bottom: 6px; }
  .list-inputs { display: grid; gap: 6px; }
  .list-row { display: flex; gap: 8px; align-items: center; }
  .list-row span { color: var(--ink-2); font-size: 13px; width: 18px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
    padding: 4px 12px; cursor: pointer; font-size: 14px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ws-table { width: 100%; border-collapse: collapse; }
  .ws-table th { text-align: left; font-size: 13px; color: var(--ink-2); font-weight: 600; padding: 0 4px 6px; vertical-align: bottom; }
  .ws-table td { padding: 3px 4px; vertical-align: top; }
  .ws-table td.rownum { width: 20px; color: var(--ink-2); font-size: 13px; padding-top: 10px; }
  .ws-table textarea { min-height: 42px; }

  /* Plot bar (shown above sheets that contain the six plot stages) */
  .stagebar {
    display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px;
    align-items: end; height: 100px; margin: 4px 0 4px;
  }
  .stage-col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: pointer; border: 0; background: none; padding: 0; }
  .stage-bar { border-radius: 6px 6px 0 0; background: var(--stage-empty); transition: background .2s; }
  .stage-col.filled .stage-bar { background: var(--accent); }
  .stage-names { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
  .stage-names span { font-size: 12px; text-align: center; color: var(--ink-2); line-height: 1.25; }

  /* Messages */
  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; border-radius: var(--radius); margin-bottom: 14px;
    border: 1px solid;
  }
  .banner p { margin: 0; flex: 1; }
  .banner.error { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .banner.ok { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .banner.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .banner button { border: 0; background: none; cursor: pointer; color: inherit; font-size: 18px; line-height: 1; }
  .label-list { margin: 0; padding-left: 20px; }
  .label-list li { margin-bottom: 4px; }

  /* Lesson plan & rubric */
  .plan-text { min-height: 60vh; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .rubric-table { width: 100%; border-collapse: collapse; background: var(--surface); }
  .rubric-table th, .rubric-table td { border: 1px solid var(--line); padding: 8px; vertical-align: top; font-size: 13.5px; }
  .rubric-table thead th { background: var(--surface-2); text-align: left; }
  .rubric-table tbody th { width: 20%; text-align: left; background: var(--surface-2); }
  .rubric-table .score-col { width: 9%; }
  .rubric-bands { font-size: 13.5px; color: var(--ink-2); }

  #print-area { display: none; }

  /* Tabs */
  .tabs {
    display: inline-flex; gap: 2px; padding: 3px; align-self: center;
    border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2);
  }
  .tab {
    border: 0; background: none; padding: 6px 16px; border-radius: 7px;
    cursor: pointer; font-weight: 600; color: var(--ink-2);
  }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* Guide */
  .step-btn[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); }
  .g-search { padding: 0 4px; }
  .g-search input {
    width: 100%; border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; background: var(--surface);
  }
  .g-results { font-size: 12px; color: var(--ink-2); margin: 6px 8px 4px; min-height: 1.2em; }
  .g-subs { list-style: none; margin: 0 0 4px 14px; padding: 0 0 0 4px; border-left: 1px solid var(--line); }
  .g-item .step-label { flex: 1; }
  .g-item.lvl1 .step-label, .g-item.lvl0 .step-label { font-weight: 600; }
  .g-count {
    flex: none; align-self: center; font-size: 11px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 1px 7px;
  }
  .g-body { font-size: 15.5px; line-height: 1.65; max-width: 74ch; }
  .g-body p { margin: 0 0 12px; }
  .g-sub { font-size: 16px; margin: 20px 0 8px; text-wrap: balance; }
  .g-list { margin: 0 0 12px; padding-left: 22px; }
  .g-list li { margin-bottom: 6px; }
  .g-table {
    overflow-x: auto; margin: 0 0 14px; max-width: 100%;
    border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  }
  .g-table pre {
    margin: 0; padding: 10px 12px; font-size: 12.5px; line-height: 1.45;
    font-family: ui-monospace, Consolas, "Courier New", monospace;
  }
  mark { background: var(--mark); color: var(--ink); border-radius: 2px; padding: 0 1px; }
  .g-refs { margin-top: 18px; }

  /* In-page dialogs */
  .dlg-overlay {
    position: fixed; inset: 0; z-index: 50; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .dlg {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; width: 100%; max-width: 640px; max-height: 90%; overflow: auto;
    padding: 18px 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
  }
  .dlg h2 { margin: 0 0 8px; font-size: 18px; }
  .dlg p { margin: 0 0 10px; }
  .dlg-code { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px; min-height: 200px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 240px minmax(0, 1fr); }
    .tb-field input { width: 170px; }
    .main { padding: 16px 18px 32px; }
  }
  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "side" "main" "foot";
    }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; max-height: 30vh; }
    .tb-field input { width: 100%; }
  }


  /* ==========================================================================
     THEME — ұлттық нақыш: көк (sky) and алтын (gold), қошқар мүйіз band,
     шаңырақ mark. Layout: sidebar becomes a drawer below 900px.
     ========================================================================== */
  :root {
    --bg: #f5f3ec; --surface: #ffffff; --surface-2: #f9f7f1; --ink: #18222e; --ink-2: #4f5b69;

    --gold: #b8892a; --gold-soft: #f5ead0; --stage-empty: #e6e0d2; --mark: #f8dd8a;
    --display: "PT Serif", Cambria, "Noto Serif", "DejaVu Serif", Georgia, serif;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101820; --surface: #18222d; --surface-2: #141d27; --ink: #e8ecef; --ink-2: #a5b0bb;
      --line: #2f3c49; --accent: #6cb4e4; --accent-ink: #08223a; --accent-soft: #16324a;
      --gold: #d6ad55; --gold-soft: #3a2f16; --stage-empty: #283442; --mark: #7a5f12;
      --orn-band: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2240%22 height=%2214%22 viewBox=%220 0 40 14%22%3E%3Cg fill=%22none%22 stroke=%22%23d6ad55%22 stroke-width=%221.4%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M0 13H40%22/%3E%3Cpath d=%22M20 13C20 7 25 3.5 29.5 5C33.5 6.5 33 11 29.8 11C27.6 11 27 8.6 29 8%22/%3E%3Cpath d=%22M20 13C20 7 15 3.5 10.5 5C6.5 6.5 7 11 10.2 11C12.4 11 13 8.6 11 8%22/%3E%3C/g%3E%3C/svg%3E"); --orn-motif: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2226%22 height=%2214%22 viewBox=%227 2 26 12%22%3E%3Cg fill=%22none%22 stroke=%22%23d6ad55%22 stroke-width=%221.6%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M20 13C20 7 25 3.5 29.5 5C33.5 6.5 33 11 29.8 11C27.6 11 27 8.6 29 8%22/%3E%3Cpath d=%22M20 13C20 7 15 3.5 10.5 5C6.5 6.5 7 11 10.2 11C12.4 11 13 8.6 11 8%22/%3E%3C/g%3E%3C/svg%3E"); --brand-mark: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cg fill=%22none%22 stroke=%22%236cb4e4%22 stroke-width=%221.7%22 stroke-linecap=%22round%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%229.5%22/%3E%3Cpath d=%22M12.6 7.2C11.4 13 11.4 19 12.6 24.8M19.4 7.2C20.6 13 20.6 19 19.4 24.8M7.2 12.6C13 11.4 19 11.4 24.8 12.6M7.2 19.4C13 20.6 19 20.6 24.8 19.4%22/%3E%3C/g%3E%3Cg stroke=%22%23d6ad55%22 stroke-width=%221.7%22 stroke-linecap=%22round%22%3E%3Cpath d=%22M16 2.5V5M16 27V29.5M2.5 16H5M27 16H29.5M6.5 6.5L8.3 8.3M23.7 23.7L25.5 25.5M25.5 6.5L23.7 8.3M8.3 23.7L6.5 25.5%22/%3E%3C/g%3E%3C/svg%3E"); color-scheme: dark;
    }
  }

   "text": "Алғы сөз\n\nЖасанды интеллект заманында кітап оқу мен сыни ойлаудың маңызы\n\nБіз кез келген сұраққа бірнеше секундта жауап табатын, кез келген мәтінді жасанды интеллект құралы бір сәтте қысқаша мазмұндап беретін дәуірде өмір сүріп жатырмыз. Тіпті көркем шығарманың әдебиеттанулық тұрғыда талдап беретін құралдар да жеткілікті. Дәл осы жағдай мұғалімдерде «Оқушы әдебиет сабақтарында не істейді? Қайтпек керек?» деген сауал заңды түрде туындайды.\n\nЕгер мақсат тек «шығарманың не туралы екенін білу» болса, бұл міндетті бүгінде адамнан да жылдам орындай алатын ЖИ құралдар көп. Бірақ көркем әдебиетті оқытудың мәні ешқашан ақпарат алумен шектелген емес. Кітап оқу – баяу, зейінді талап ететін, кейде қиын процесс. Оқырман кітап оқи отырып кейіпкердің ішкі әлеміне еніп, шығарма ішінде қайшылық, қиындықтармен бетпе-бет келеді. Дәл осы сәттегі ойлау процессі, эмоционалды интеллектіге әсері, сыни ойлауды шынықтыру сәтін еш ЖИ құрал бере алмайды. Жылт еткен жылдам заманда кітап оқу қалыптастыратын асыл қасиеттерді сақтап қалу, дамыту болашағымыз үшін маңызды болмақ.\n\nОқушы көркем шығарманы оқығанда жасанды интеллект құрап берген дайын шаблонды емес, өзінің жеке көзқарасы арқылы қорытынды шығарып, ойлана білуі керек. Сондықтан бүгінгі Қазақ тілі мен әдебиет пәні сабағының басты міндеті – оқушыға дайын пікірді сіңіріп алуды емес, өзіндік пікірге келу жолын үйретуі тиіс: қандай сұрақ қою керек, қандай дәлел іздеу керек, бір тұжырымды айтпас бұрын оны қалай тексеру керек.\n\nӘдеби көркем шығармаларды оқу – эмпатияны, психологиялық сезімталдықты, төзімділікті, өз бетінше пікір қалыптастыру дағдысын дамытады. Бұлар адамды адам ететін, ешбір құрал орнын баса алмайтын маңызды қасиеттер. Жасанды интеллект дәуірінде мұғалімнің рөлі артпаса кеміген емес: себебі ол енді тек білім беруші ғана емес, оқушыны дербес, терең, сын тұрғысынан ойлай алатын оқырман етіп қалыптастыратын маман. Осы құрал сол міндетіңізге көмекші болсын, ардақты ұстаз!\n\nІзгі ниетпен, Бекжанова Сара, Әдебиеттанушы, PhD кандидат, редактор Алматы, 2026 жыл КІРІСПЕ\n\nҚұрметті әріптес!\n\nҚолыңыздағы құрал қазақ тілі мен әдебиеті пәнінің мұғаліміне арналған, көркем шығарманы жүйелі әрі терең талдауға үйрететін кәсіби оқу-әдістемелік нұсқаулық. Ол екі бөліктен тұрады: Әдістемелік нұсқаулық (теория мен әдістерді түсіндіреді) және Практикалық жұмыс дәптері (сол әдістерді нақты тапсырмалар арқылы бекітеді).\n\nБұл құралдың пайда болу қажеттілігі мектеп тәжірибесінен туындайды. Көбіне сабақта әдеби талдау мазмұндаумен алмастырылады: оқушы «не болды?» дегенге жауап береді, бірақ «неге дәл солай жазылды?», «автор бұл арқылы нені меңзейді?», «мен бұған қалай келдім?» деген сұрақтар шетте қалып қояды. Нәтижесінде оқушы шығарманы «түсінеді», бірақ талдай алмайды. Ал талдай алу дағдысы Оқу бағдарламасының да, өмірлік сын тұрғысынан ойлау құзыреттілігінің де негізгі талабы.\n\nҚұралдың мақсаты\n\nБұл құрал сізге екі нәрсені үйретуді мақсат етеді:\n\n1. Кез келген көркем шығарманы (өлең, әңгіме, повесть, роман, драмалық туындылар) әдеби-теориялық, көркемдік, идеялық, мәдени және психологиялық тұрғыдан кәсіби деңгейде талдау;\n\n2. Осы талдау тәсілдерін оқушыға үйрету, өз бетінше дәлелді пікір құрастыра алатын оқырман етіп қалыптастыру.\n\nҚұрал белгілі бір шығармаға емес, әдіске бағытталған: мұнда берілген алгоритмдер мен сұрақтарды кез келген көркем мәтінге бағдарлама бойынша да, бағдарламадан тыс та қолдана аласыз.\n\nҚұралдың құрылымдық логикасы\n\nӘр теориялық тақырып мына тізбекпен беріледі:\n\nТЕОРИЯ (ұғымның мәні) → ӘДІС (оны қалай қолдану керек) → МЫСАЛ (нақты мәтіннен) → МҰҒАЛІМНІҢ ПРАКТИКАСЫ (өзіңіз орындайтын тапсырма) → ЖҰМЫС ДӘПТЕРІ (сыныпта қолдануға дайын парақ) → САБАҚТА ҚОЛДАНУ (әдістемелік ұсыныс).\n\nБұл логиканы сақтау маңызды: теория тәжірибеден бөлек берілмейді, әр ұғым міндетті түрде мәтінмен жұмыс арқылы бекітіледі.\n\nҚұралды қалай пайдалану керек?\n\nНұсқаулықты бірізді оқып шығу міндетті емес – әр бөлім өз алдына дербес тақырып. Дегенмен алғаш рет қолданатын мұғалімге 1 және 2-бөлімдерден бастауды ұсынамыз: олар қалған барлық бөлімнің негізін құрайды. Жұмыс дәптерінің әр парағы нұсқаулықтың сәйкес бөліміне сілтеме жасайды. Парақты сыныпта қолданбас бұрын сол бөлімді оқып алған жөн.\n\nҚұралда «дайын жауап» жоқ. Бұл сіздің де, оқушыңыздың да әр шығармада жаңа, тың жаңалық ашуына мүмкіндік береді.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл нұсқаулықтың мазмұндау → талдау → интерпретация тізбегі «Қазақ әдебиеті» пәнінің үлгілік оқу бағдарламасындағы үш блоктың (түсіну және жауап беру → анализ және интерпретация → бағалау және салыстыру) тереңдетілген әдістемелік нұсқасы болып табылады. Осыдан былай әр бөлімнің соңында сол бөлім жүзеге асыратын нақты оқыту мақсатының коды көрсетіледі."

   "title": "ӘДЕБИ ШЫҒАРМАНЫ ТАЛДАУДЫҢ НЕГІЗДЕРІ",
   "text": "1. НЕГІЗГІ ҰҒЫМ\n\nӘдеби шығарманы талдау – көркем мәтіннің мазмұны мен формасының өзара байланысын анықтап, автордың нені, не үшін және қалай бейнелегенін дәлелді түрде ашу процесі. Талдау – мәтінді қалай және не үшін дәл осылай құрылғанын түсіну.\n\nТалдаудың үш сүйенетін тірегі бар:\n\n• мазмұн – не туралы айтылады (тақырып, идея, оқиға);\n\n• форма – қалай айтылады (композиция, тіл, көркемдік тәсілдер);\n\n• қызмет – форма мазмұнды ашуға қалай қызмет етеді (неге дәл осы деталь, дәл осы сөз, дәл осы рет).\n\nТалдау нәтижесі – жаттанды қорытынды емес, мәтінмен расталған, дәлелденген пікір.\n\nТалдау мен мазмұндаудың айырмашылығы\n\nМазмұндау «не болды?» деген сұраққа жауап береді: оқиға желісін дәйекті түрде қайталау. Талдау «неге дәл солай болды?», «бұл автордың қандай ойы бар?», «бұл эпизодтың мәтіндегі қызметі қандай?» деген сұрақтарға жауап іздейді.\n\nМазмұндау                                           Талдау\n                                      «Қожаның мектепке кешігуі оның\n                                      кейіпкер ретіндегі негізгі қасиеті\nМысалы, «Қожа мектепке кешігіп қалды»\n                                      (еркелігін, тентектігін) ашатын алғашқы\n                                      деталь»\n                                                    Оқиғаның неге дәл осы ретпен, дәл осы\nОқиғаны хронологиялық ретпен айту\n                                                    көлемде берілгенін түсіндіру\n                                             Кейіпкердің әрекеті мен сөзінің сәйкес не\n\nКейіпкердің не істегенін тізбектеп айту қайшы келуін анықтау\n\nМұғалімнің тәжірибесінде жиі кездесетін жағдай: оқушы шығарманы мұқият оқып, тіпті жатқа айтып бере алады, бірақ «автор бұл арқылы нені айтқысы келді?» деген сұраққа жауап бере алмайды. Бұл – талдау дағдысының қалыптаспағанының белгісі.\n\nТалдау мен интерпретацияның айырмашылығы\n\nБұл екі ұғымды көбіне шатастырады, алайда олардың арасында маңызды бір байланыс бар.\n\nТалдау – мәтіннің құрылымдық-көркемдік элементтерін (композиция, кейіпкер, тіл, деталь, символ) мұқият, дәйекті түрде анықтау және сипаттау. Талдау объективті дәлелге сүйенеді: Мысалы, «мәтінде мынау бар, ол мынадай қызмет атқарады».\n\nИнтерпретация – талдау нәтижесінде жиналған дәлелдер негізінде шығарманың тереңірек мағынасын, авторлық ойдың ауқымын тұжырымдау. Интерпретация субъективті ойлау еркіндігіне басымдық береді. Бірақ ол еркін қиял емес – әр интерпретация талдау арқылы, яғни мәтіндік дәлелмен негізделуі тиіс.\n\nҚысқаша айтсақ, талдау – дәлел жинау, интерпретация – сол дәлелдер негізінде қорытынды жасау. Талдаусыз интерпретация – негізсіз пікір; интерпретациясыз талдау – аяқталмаған жұмыс.\n\n2. БҰЛ НЕ ҮШІН КЕРЕК?\n\nТалдау дағдысы оқушыға мына нәрселерді үйретеді:\n\n• Сын тұрғысынан ойлау: кез келген мәтінді (көркем де, публицистикалық та, медиа мәтінді де) сыртқы әсерге бой алдырмай, дәлелмен бағалау дағдысы;\n\n• Дәлелді пікір құрастыру: «маған ұнайды/ұнамайды» деңгейінен «мен мұны нақты негіздермен дәлелдей аламын» деңгейіне көтеру;\n\n• Эмпатия мен психологиялық сауаттылық: кейіпкердің ішкі әлемін, мотивтерін, қайшылықтарын түсіну арқылы адами қарым-қатынасты терең түсіну;\n\n• Мәдени сауаттылық: шығарманы өз дәуірінің, қоғамының, құндылықтар жүйесінің көрінісі ретінде қабылдау;\n\n• Тілдік сезімталдық: сөздің, бейненің, көркемдік тәсілдің қызметін сезіну – бұл, өз кезегінде, оқушының жазба тілін де байытады.\n\n3. МҰҒАЛІМ НЕНІ БАЙҚАУЫ КЕРЕК?\n\nМұғалімнің талдаудағы рөлі – дайын қорытындыны жеткізуші емес, талдау процесін ұйымдастырушы болу. Бұл үшін мұғалім өзі:\n\n• шығарманы алдын ала мұқият, кемінде екі рет оқып, өз болжамдарын, сұрақтарын жазып алуы керек;\n\n• «дұрыс жауап» іздеу емес, «қандай дәлелдер бар?» деген қағидамен жұмыс істеуі керек;\n\n• оқушының өзінікінен өзгеше, бірақ мәтінмен негізделген пікірін қабылдауға дайын болуы керек;\n\n• дайын интерпретацияны бірден бермей, оқушыны сол интерпретацияға өзі жетелейтін сұрақтар тізбегін құра білуі керек.\n\nДайын интерпретация берудің кемшіліктері:\n\nМұғалім сабақ уақытын үнемдеу немесе «дұрыс түсінік қалыптастыру» ниетімен шығарманың идеясын, кейіпкердің бағасын дайын түрде беруге бейім келеді. Бұл тәсілдің бірнеше елеулі кемшілігі бар:\n\n1. Оқушының өз ойлау процесіне кедергі келтіреді – ол талдамайды, тек жаттайды;\n\n2. Мәтінмен тікелей байланыс үзіледі – оқушы мәтіннің өзін емес, мұғалімнің сөзін есте сақтайды;\n\n3. Шығарманың көпмағыналылығы жасырын қалады – көркем мәтін әрдайым бір ғана «дұрыс» интерпретацияға сыя бермейді, ал дайын жауап шектеу жасайды;\n\n4. Сын тұрғысынан ойлау дағдысы дамымайды – оқушы емтиханда немесе шынайы өмірде, яғни дайын жауап жоқ жағдайда дәрменсіз қалады.\n\nМұғалімнің міндеті — «нендей идея бар?» деп айту емес, «мына деталь сізге не айтады?» деп сұрап, оқушыны сол идеяға өзі жеткізу.\n\n4. ҚАНДАЙ СҰРАҚ ҚОЮҒА БОЛАДЫ?\n\n• Бұл эпизодта нақты не сипатталады, ал автор оны қандай мақсатпен таңдаған болуы мүмкін?\n\n• Егер осы эпизод/деталь/сөз алынып тасталса, мәтіннің мағынасы қалай өзгереді?\n\n• Мәтіндегі қай жер сізді таң қалдырды және неге?\n\n• Автордың позициясын мәтіннің қай тұсынан байқауға болады?\n\n5. МӘТІНМЕН ЖҰМЫС МЫСАЛЫ\n\nБ. Соқпақбаевтың «Менің атым – Қожа» повесінен үзінді: Қожаның мектепке кешігуі туралы эпизод. Мазмұндау деңгейінде мұғалім: «Қожа ұйықтап қалып, мектепке кешікті» дейді. Талдау деңгейінде мұғалім оқушыға: «Автор Қожаның кешігу себебін қалай сипаттайды, бұл кездейсоқтық па, әлде кейіпкердің мінезіне тән қасиет пе? Осы эпизод повесте қалай өрбиді деп ойлайсың?» деген сұрақ қояды. Осы арқылы жекелеген факт кейіпкер жүйесінің бір бөлшегіне айналады.\n\n6. ЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР\n\n• Талдауды мазмұндаумен алмастыру («не болды?» деңгейінде тоқтап қалу);\n\n• Оқушыға идеяны дайын түрде ұсыну;\n\n• Мәтіндік дәлелсіз жалпы тұжырым жасау («шығарма адамгершілікке үйретеді» деп, нақты қай эпизод, қай деталь арқылы екенін көрсетпеу);\n\n• Талдауды тек «тәрбиелік мән» деп мағына аясын тарылту;\n\n• Барлық оқушыдан бірдей интерпретация талап ету.\n\n7. ПРАКТИКАЛЫҚ ТАПСЫРМА\n\nӨзіңіз жуырда сабақта өткен (немесе өтуге жоспарлаған) шығармадан бір эпизодты алыңыз. Оны алдымен бір сөйлеммен мазмұндаңыз, содан кейін сол эпизод бойынша үш аналитикалық сұрақ құрастырыңыз (мысалы: «Автор неге дәл осы эпизодты таңдады?», «Бұл эпизод кейіпкердің қандай қасиетін ашады?», «Бұл эпизод болмаса, оқиға желісі қалай өзгерер еді?»). Жауаптарыңызды мәтіннен алынған нақты дәлелмен растаңыз.\n\n8. САБАҚТА ҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?\n\nСабақ басында оқушыларға «бүгін біз не болғанын емес, автор неге дәл солай жазғанын анықтаймыз» деп мақсат қоюдан бастаңыз. Сабақ барысында әр рет оқушы жалаң тұжырым айтқанда («кейіпкер жақсы адам»), «мәтіннің қай жерінен көрдіңіз?» деп қайтара сұраңыз. Бұл дағды бірте-бірте автоматты деңгейге жетеді.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндетін орындауға негіз болады:\n\n5.1.2.1–9.1.2.1 «Әдеби шығарманың тұжырымдамасы» (тақырып пен идеяны ажырату).\n\nКәсіби рефлексия: Мен өз сабақтарымда талдауды мазмұндаудан қаншалықты нақты ажыратамын? Соңғы сабағымда «неге?» деген сұрақты қанша рет қойдым?"

   "title": "КӨРКЕМ ШЫҒАРМАНЫ ТАЛДАУДЫҢ ӘМБЕБАП АЛГОРИТМІ",
   "text": "Бұл бөлімде берілген 22 компонент – кез келген көркем шығармаға (жанрына, көлеміне, авторына қарамастан) қолдануға болатын әмбебап құрылым. Компоненттердің реті шартты: іс жүзінде талдау барысында оларға бірнеше рет оралуға, компоненттерді айқастыруға тура келеді. Дегенмен алғаш рет талдау жасайтын мұғалімге немесе оқушыға үшін осы реттілікті сақтауға кеңес береміз.\n\nӘр компонент мына құрылыммен беріледі: НЕГІЗГІ ҰҒЫМ → БҰЛ НЕ\n\nҮШІН КЕРЕК? → МҰҒАЛІМ НЕНІ БАЙҚАУЫ КЕРЕК? → ҚАНДАЙ СҰРАҚ\n\nҚОЮҒА БОЛАДЫ? → МӘТІНМЕН ЖҰМЫС МЫСАЛЫ → ЖИІ ЖІБЕРІЛЕТІН ҚАТЕЛЕР → ПРАКТИКАЛЫҚ ТАПСЫРМА → САБАҚТА\n\nҚАЛАЙ ҚОЛДАНУҒА БОЛАДЫ?"

   "title": "АЛҒАШҚЫ ӘСЕР",
   "text": "Негізгі ұғым. Алғашқы әсер – шығарманы алғаш рет оқығаннан кейінгі, әлі талдауға түспеген, тікелей эмоционалды-интуитивті реакция: не ұнады, не таң қалдырды, не түсініксіз қалды, қандай көңіл-күй қалдырды.\n\nБұл не үшін керек? Алғашқы әсер – талдаудың бастапқы нүктесі әрі тексерілетін болжам көзі. Ол «таза оқырмандық» тәжірибені сақтайды: талдау тереңдеген сайын осы алғашқы әсерге қайта оралып, оның неліктен пайда болғанын түсіндіруге болады.\n\nМұғалім нені байқауы керек? Оқушылардың алғашқы әсерлерінің әртүрлілігі – қалыпты құбылыс және шығарманың көпмағыналылығының дәлелі. Мұғалім «дұрыс» алғашқы әсер деген болмайтынын түсінуі керек.\n\nҚандай сұрақ қоюға болады? «Мәтінді оқып болғанда көңіл-күйің қандай болды?» «Қай жер сені ойландырды немесе таң қалдырды?» «Не түсініксіз болып қалды?»\n\nМәтінмен жұмыс мысалы. Ы.Алтынсариннің «Асан мен Үсен» әңгімесін алғаш оқыған оқушы: «Маған Асанның еңбекқорлығы ұнады, бірақ соңында аяп кеттім» деп жазуы мүмкін. Бұл – кейінгі талдауда «неге дәл аяушылық сезімі?» деген сұраққа жалғасатын бастапқы дәйек.\n\nЖиі жіберілетін қателер. Алғашқы әсерді бірден «дұрыс» немесе «бұрыс» деп бағалау; оны талдаудың соңына дейін ескермей, ұмыт қалдыру.\n\nПрактикалық тапсырма. Кез келген жаңа шығарманы оқығаннан кейін өз алғашқы әсеріңізді үш сөйлеммен жазып алыңыз. Толық талдау жасағаннан соң осы жазбаға қайта оралып, әсеріңіз қаншалықты өзгергенін салыстырыңыз.\n\nСабақта қалай қолдануға болады? Сабақты «Алғашқы әсер парағын» толтырудан бастаңыз (жұмыс дәптерінің 1-парағы). Сабақ соңында осы параққа қайта оралып, талдаудан кейін көзқарас өзгерді ме, соны талқылаңыз."

   "title": "ТАҚЫРЫП",
   "text": "Негізгі ұғым. Тақырып – шығармада не туралы айтылатыны, автордың назарын аударған өмір құбылысы, оқиға немесе мәселе ауқымы («не туралы?» деген сұраққа жауап).\n\nБұл не үшін керек? Тақырыпты дәл анықтау – идея мен мәселені танудың алғышарты. Тақырыпты тым жалпылама («өмір туралы») немесе тым тарылтып («мектепке кешігу туралы») анықтау кейінгі талдауды қиындатады.\n\nМұғалім нені байқауы керек? Тақырып пен сюжеттің фактісін шатастырмау керек: сюжет – «не болды», тақырып – «не туралы». Бір шығармада бірнеше тақырып қатар өрбуі мүмкін (негізгі және қосалқы).\n\nҚандай сұрақ қоюға болады? «Автор оқырманның назарын ең алдымен неге аударады?» «Шығармадағы оқиғалардың бәрі қандай ортақ мәселе төңірегінде өрбиді?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесіндегі сюжет Қожаның мектептегі, отбасындағы оқиғаларынан құралған; тақырыбы – жасөспірімнің қалыптасу жолы, ересектер әлемімен қақтығысы.\n\nЖиі жіберілетін қателер. Тақырыпты бір сөзбен ғана атап, нақтыламау («достық туралы» деп қана қою, қандай достық, қандай жағдайда екенін ашпау); тақырыпты идеямен шатастыру.\n\nПрактикалық тапсырма. Соңғы өткен шығарманың тақырыбын алдымен бір сөзбен, содан кейін толық сөйлеммен («шығармада ... мәселесі ... арқылы көрсетіледі») деп тұжырымдаңыз.\n\nСабақта қалай қолдануға болады? Оқушыларға тақырыпты «бір сөзбен» және «бір сөйлеммен» екі рет тұжырым жасатыңыз. Бұл жаттығу терең ойлап, өзінше пайымдауға көмектеседі."
  },
  {
   "id": "2.3",
   "level": 2,
   "title": "ИДЕЯ",
   "text": "Негізгі ұғым. Идея – автордың таңдаған тақырып арқылы жеткізгісі келген негізгі ой, оның өмірге, адамға, қоғамға қатысты көзқарасының көркем түрде тұжырымдалуы.\n\nБұл не үшін керек? Идеяны анықтау шығарманың мақсатын, авторлық позицияны түсінуге апарады. Дегенмен идея дайын мораль емес – ол мәтіннің бүкіл құрылымынан (сюжет, кейіпкерлер, детальдар) жинақталады.\n\nМұғалім нені байқауы керек? Идеяны бір таяз сөйлеммен («достыққа адал болу керек») деп қорытпай, оның қаншалықты күрделі, тіпті қайшылықты болуы мүмкін екенін ескеру керек.\n\nҚандай сұрақ қоюға болады? «Шығармадағы оқиғалар, кейіпкерлер тағдыры бізге не туралы ой салады?» «Автор оқырманды нені қайта қарауға шақырады?»\n\nМәтінмен жұмыс мысалы. Б. Соқпақбаевтің «Балалық шаққа саяхат» жай ғана «балалық шақты сағыну» емес, жетім баланың жетілу жолы, мінез-құлқының қалыптасуы, арман-тілегі суреттелген хикаят.\n\nЖиі жіберілетін қателер. Идеяны дайын мақал-мәтелмен алмастыру; идеяны шығарманың бір ғана эпизодынан шығарып, тұтас мәтінмен растамау.\n\nПрактикалық тапсырма. Шығарманың идеясын екі түрлі тұжырыммен жазыңыз: біреуі – қысқа, тікелей; екіншісі – күрделірек, қайшылықты жақтарын қамтуға тырысыңых. Қайсысы мәтінге дәлірек сәйкес келетінін негіздеңіз.\n\nСабақта қалай қолдануға болады? Идеяны сабақтың соңында ғана емес, сабақ барысында бірнеше рет («байқауымызша, автор не айтқысы келеді?») қайта тұжырымдатып отырыңыз, бұл идеяның қалыптасу процесін көрсетеді."
  },
  {
   "id": "2.4",
   "level": 2,
   "title": "ШЫҒАРМАДАҒЫ ПРОБЛЕМАТИКА",
   "text": "Негізгі ұғым. Проблематика – шығармада көтерілген мәселелер жиынтығы, автордың назар аударып, шешу немесе талқылау үшін ұсынған қайшылықтар (адамгершілік, әлеуметтік, психологиялық, философиялық).\n\nБұл не үшін керек? Идея – автордың жауабы болса, проблематика – оның қойған сұрақтары. Проблематиканы анықтау шығарманың неге әлі де өзекті екенін көрсетеді.\n\nМұғалім нені байқауы керек? Бір шығармада бірнеше проблема қатар өрбуі мүмкін (мысалы, ұрпақтар арасындағы түсінбеушілік және жеке жауапкершілік мәселесі). Проблема міндетті түрде шешіле бермейді – кейде автор оны ашық қалдырады.\n\nҚандай сұрақ қоюға болады? «Автор қандай қайшылықты, шешілмеген мәселені көрсетеді?» «Бұл мәселе бүгінгі оқырманға қаншалықты таныс?»\n\nМәтінмен жұмыс мысалы. М.Әуезовтің «Көксерек» әңгімесінде проблематика — табиғат пен адам арасындағы қатынас, күштің қатыгездікке айналу қаупі.\n\nЖиі жіберілетін қателер. Проблематиканы тақырыппен шатастыру; барлық мәселені бір ғана «жақсылық пен жамандық күресіне» тарылту.\n\nПрактикалық тапсырма. Шығармадан кемінде екі түрлі проблеманы бөліп жазыңыз және олардың бір-бірімен қалай байланысатынын түсіндіріңіз.\n\nСабақта қалай қолдануға болады? Проблематиканы «пікірталас» әдісімен ашуға болады (10-бөлімді қараңыз): оқушыларды екі топқа бөліп, көтерілген мәселе бойынша қарама-қарсы позициядан дәлел іздетіңіз."

  {
   "id": "2.5",
   "level": 2,
   "title": "ЖАНР",
   "text": "Негізгі ұғым. Жанр – шығарманың құрылымдық-мазмұндық типі (әңгіме, повесть, роман, өлең, поэма, ертегі, мысал т.б.), белгілі бір дәстүрге, көркемдік заңдылыққа бағынатын мәтін түрі.\n\nБұл не үшін керек? Жанрды анықтау оқырманнан қандай «оқу тәсілін» талап ететінін көрсетеді: ертегіден шындыққа сәйкестік талап етпейміз, ал реалистік повестен талап өзгеше.\n\nМұғалім нені байқауы керек? Жанрлық белгілерді формальды түрде («бұл әңгіме, өйткені қысқа») емес, мазмұндық-құрылымдық негізде анықтау керек (баяндау сипаты, уақыт ауқымы, кейіпкерлер саны).\n\nҚандай сұрақ қоюға болады? «Бұл шығарманы қандай жанрлық белгілері арқылы таныдыңыз?» «Автор осы жанрды таңдауымен нені ұтты?»\n\nМәтінмен жұмыс мысалы. «Қозы Көрпеш – Баян сұлу» жырын жанрлық жағынан лиро-эпикалық поэма/дастан ретінде анықтау – оның қалай оқылатынын (ырғақ, қайталаулар, дәстүрлі формулалар) айқындап береді.\n\nЖиі жіберілетін қателер. Жанрды тек көлеміне қарап анықтау; аралас жанрлық белгілері бар мәтіндерді (мысалы, лирикалық проза) бір қалыпқа салып қою.\n\nПрактикалық тапсырма. Екі әртүрлі жанрдағы (мысалы, ертегі мен реалистік әңгіме) шығарманы салыстырып, қалай әсер ететінін жазыңыз.\n\nСабақта қалай қолдануға болады? Жаңа шығарманы таныстырар алдында оқушыларға жанрлық белгілерін өздігінен анықтатыңыз."
  },
  {
   "id": "2.6",
   "level": 2,
   "title": "СЮЖЕТ",
   "text": "Негізгі ұғым. Сюжет – шығармадағы оқиғалардың себеп-салдарлық, уақыттық байланыста өрбитін тізбегі.\n\nБұл не үшін керек? Сюжетті талдау оқиғалардың белгілі бір көркемдік мақсатқа (идеяны ашуға, кейіпкерді сынауға) қызмет ететінін көрсетеді.\n\nМұғалім нені байқауы керек? Сюжет пен фабуланың (оқиғалардың хронологиялық реті) айырмашылығын ескеру: автор оқиғаны әдейі хронологиядан тыс беруі мүмкін (ретроспекция, интрига үшін).\n\nҚандай сұрақ қоюға болады? «Оқиғалардың қайсысы негізгі, қайсысы қосалқы желі?» «Автор неге оқиғаны дәл осы ретпен береді?»\n\nМәтінмен жұмыс мысалы. М. Әуезовтің «Көксерек» әңгімесінде сюжет желісінің әрбір сатысы (бөлтірікті қолға үйретуі → қарым-қатынастың өзгеруі → қақтығыс) идеяны сатылап ашуға қызмет етеді.\n\nЖиі жіберілетін қателер. Сюжетті тек мазмұндау деңгейінде қайталау; оқиғалардың себеп-салдарлық байланысын көрсетпей, тек хронологиялық ретте тізбектеу.\n\nПрактикалық тапсырма. Шығарманың сюжеттік желісін 5-6 негізгі оқиғаға дейін қысқартып жазыңыз, әр оқиғаның алдыңғысымен себеп-салдарлық байланысын бір сөйлеммен түсіндіріңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Сюжет картасы» парағын (4-парақ) қолданып, оқиғаларды кестеге түсіріп, әр буынның қызметін талқылаңыз."

   "level": 2,
   "title": "КОМПОЗИЦИЯ",
   "text": "Негізгі ұғым. Композиция – шығарма бөліктерінің (тараулар, эпизодтар, лирикалық шегіністер, портреттер, пейзаждар) өзара орналасу тәртібі мен байланысы.\n\nБұл не үшін керек? Композицияны талдау автордың мазмұнды ұйымдастыру тәсілін, екпін қою нүктелерін көрсетеді (мысалы, неге белгілі бір эпизод басында, ал басқасы соңында тұр).\n\nМұғалім нені байқауы керек? Композициялық тәсілдерге назар аудару: айна композиция, шеңберлі композиция, ретроспекция, параллель желілер, лирикалық шегіністер.\n\nҚандай сұрақ қоюға болады? «Шығарма неден басталып, немен аяқталады, бұл таңдаудың мәні неде?» «Қандай эпизодтар қатар/қарама-қарсы қойылған және неге?»\n\nМәтінмен жұмыс мысалы. «Көксерек» әңгімесінің шеңберлі құрылымы (басы мен соңындағы қасқыр бейнесінің қайталануы) идеяның тұйықталуы, тағдыр тәлкегі.\n\nЖиі жіберілетін қателер. Композицияны сюжетпен шатастыру; композициялық элементтерді (лирикалық шегініс, портрет) кездейсоқ қосымша деп қарау.\n\nПрактикалық тапсырма. Шығарманың құрылымдық сызбасын (экспозициядан шешімге дейін) сызып, әр бөліктің көлемін салыстырыңыз — қай бөлікке автор көбірек орын берген және неге.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Композиция картасы» парағын (5-парақ) толтыртып, оқушыларға шығарманың «сәулет жоспарын» сызғызыңыз."

   "level": 2,
   "title": "КОНФЛИКТ",
   "text": "Негізгі ұғым. Конфликт – шығарманың қозғаушы күші болатын қайшылық, қарама-қайшы күштердің (кейіпкерлер, идеялар, ұмтылыстар) қақтығысы.\n\nБұл не үшін керек? Конфликтіні анықтау сюжеттің неге дәл осылай өрбитінін, кейіпкерлердің неге дәл осылай әрекет ететінін түсіндіреді. (Конфликт түрлерінің толық сипаттамасы 4-бөлімде беріледі.)\n\nМұғалім нені байқауы керек? Конфликт әрдайым бір ғана деңгейде болмайды: сыртқы конфликтпен қатар ішкі (психологиялық) конфликт те қатар жүруі мүмкін.\n\nҚандай сұрақ қоюға болады? «Кім/не кіммен/немен қақтығысады?» «Бұл қақтығыс тек сыртқы ма, әлде кейіпкердің ішінде де жүре ме?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде конфликт: Қожаның еркін мінезі мен мектептің/отбасының қатаң талаптары арасында (тұлға-қоғам), сонымен қатар кейіпкердің өз ішінде жауапкершілік пен еркіндік арасында толғанысы (тұлға-өзі).\n\nЖиі жіберілетін қателер. Конфликтіні тек «жақсы кейіпкер – жаман кейіпкер» қақтығысына тарылту; ішкі конфликтіні байқамай өткізіп жіберу.\n\nПрактикалық тапсырма. Шығармадағы конфликтіні бір сөйлеммен тұжырымдап, оның қай түрге (тұлға-тұлға, тұлға-қоғам, тұлға-табиғат, тұлға-өзі) жататынын анықтаңыз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Конфликт картасы» парағын (6-парақ) қолданыңыз."

   "level": 2,
   "title": "КЕЙІПКЕРЛЕР ЖҮЙЕСІ",
   "text": "Негізгі ұғым. Кейіпкерлер жүйесі – шығармадағы барлық кейіпкерлердің өзара байланысы, олардың орналасу иерархиясы (бас кейіпкер, қосалқы кейіпкерлер, эпизодтық кейіпкерлер) және функционалдық қызметі.\n\nБұл не үшін керек? Кейіпкерлер жүйесін көру бас кейіпкерді басқалардан оқшауламай, қосалқы кейіпкерлермен қатынасында ашылатынын түсінуге көмектеседі.\n\nМұғалім нені байқауы керек? Әр кейіпкердің мәтіндегі функциясын анықтау: ол бас кейіпкерге қарама-қарсы қойылған ба (антипод), оның ойын жеткізуші ме (сенімді адам), сынама жағдай тудырушы ма.\n\nҚандай сұрақ қоюға болады? «Бұл кейіпкер болмаса, бас кейіпкердің бейнесі қалай өзгерер еді?» «Кейіпкерлер бір-бірімен қалай (қарама-қарсы, ұқсас, толықтырушы) байланысады?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде Қожа мен Жантастың образы бір-бірін салыстыру арқылы ашылады.\n\nЖиі жіберілетін қателер. Тек бас кейіпкерге назар аударып, қосалқы кейіпкерлердің қызметін ескермеу.\n\nПрактикалық тапсырма. Шығармадағы 3-4 кейіпкерді алып, әрқайсысының бас кейіпкерге қатысты функциясын («салыстыру үшін», «қайшылық тудыру үшін», «көмекші» т.б.) анықтаңыз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Кейіпкерлер арасындағы байланыс картасы» парағын (9-парақ) қолданыңыз."
  },
  {
   "id": "2.10",
   "level": 2,
   "title": "КЕЙІПКЕР ЭВОЛЮЦИЯСЫ",
   "text": "Негізгі ұғым. Кейіпкер эволюциясы – кейіпкердің шығарма барысында мінезінде, көзқарасында, құндылықтарында болатын өзгеріс (немесе әдейі өзгермей қалуы).\n\nБұл не үшін керек? Эволюцияны бақылау кейіпкерді статикалық емес, «тірі» тұлға ретінде түсінуге, даму себебін (қандай оқиға, таңдау түрткі болғанын) анықтауға мүмкіндік береді. (Толық әдістеме 3-бөлімде.)\n\nМұғалім нені байқауы керек? Әр кейіпкер өзгере бермейді – кейбір кейіпкерлер әдейі статикалық болып қалады (мысалы, антагонист), бұл да көркемдік тәсіл.\n\nҚандай сұрақ қоюға болады? «Кейіпкер шығарманың басы мен соңында қалай өзгерді?» «Осы өзгеріске қандай оқиға түрткі болды?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде Қожаның жауапкершілікке деген қатынасы бірнеше «сабақ болған» жағдайдан кейін бірте-бірте өзгереді.\n\nЖиі жіберілетін қателер. Өзгерісті бір оқиғамен ғана байланыстырып, бүкіл процесті ескермеу; әр кейіпкердің «өзгеруін» іздеу.\n\nПрактикалық тапсырма. Кейіпкердің шығарма басындағы және соңындағы күйін салыстырып, өзгеріс/өзгермеу себебін мәтіндік дәлелмен көрсетіңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Кейіпкер эволюциясы» парағын (8-парақ) қолданыңыз."
  },
  {
   "id": "2.11",
   "level": 2,
   "title": "АВТОР ПОЗИЦИЯСЫ",
   "text": "Негізгі ұғым. Автор позициясы – жазушының бейнеленген оқиғаларға, кейіпкерлерге деген қатынасы. Оның құндылықтар жүйесінің мәтінде көрініс табуы.\n\nБұл не үшін керек? Автор позициясын анықтау шығарманың идеясын дәлірек тұжырымдауға көмектеседі. Идея көбіне автор позициясының жинақталған көрінісі.\n\nМұғалім нені байқауы керек? Автор позициясы әрдайым тікелей айтылмайды (әсіресе реалистік прозада): ол интонация, деталь таңдау, кейіпкерге берілген «баға» арқылы жанама түрде беріледі. Автор позициясын баяндаушының позициясымен шатастырмау керек (келесі тармақты қараңыз).\n\nҚандай сұрақ қоюға болады? «Автор бұл кейіпкерге қалай қарайды, оны сынай ма, ақтай ма, түсіністікпен қарай ма?» «Бұл қатынас қандай тілдік/көркемдік құралдар арқылы беріледі?»\n\nМәтінмен жұмыс мысалы. «Көксерек» әңгімесінде автордың адам мен табиғат арасындағы үйлесімнің бұзылуына деген алаңдаушылығы Құрмаштың кейінгі әрекеттерінен жанама түрде көрінеді.\n\nЖиі жіберілетін қателер. Автор позициясын кейіпкердің пікірімен бірдей деп қабылдау; авторлық баға берілмеген жерде оны «ойдан шығарып» тыңу.\n\nПрактикалық тапсырма. Мәтіннен автордың кейіпкерге қатынасын білдіретін 2-3 деталь/сөз тіркесін тауып, олардың қызметін түсіндіріңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Автор позициясын анықтау» парағын (10-парақ) қолданыңыз."
  },
  {
   "id": "2.12",
   "level": 2,
   "title": "БАЯНДАУШЫ/НАРРАТОР",
   "text": "Негізгі ұғым. Баяндаушы (нарратор) – оқиғаны әңгімелеуші тұлға немесе инстанция, ол автордың өзі емес болуы мүмкін. Баяндау I жақтан (кейіпкер-баяндаушы), III жақтан (объективті немесе «бәрін білетін» баяндаушы) жүруі мүмкін.\n\nБұл не үшін керек? Баяндаушының түрін анықтау оқиғаға деген «көзқарас бұрышын», ақпараттың қаншалықты сенімді/шектеулі екенін түсінуге көмектеседі.\n\nМұғалім нені байқауы керек? I жақтан баяндалған шығармада баяндаушы-кейіпкердің көзқарасы шектеулі, тіпті біржақты болуы мүмкін. Бұл автордың қолданып отырған көркемдік тәсілі (мысалы, Қожаның атынан баяндау оқиғаны балалық аңғалдықпен қабылдауға әсер етеді).\n\nҚандай сұрақ қоюға болады? «Оқиғаны кім әңгімелеп отыр?» «Баяндаушының көзқарасы қаншалықты сенімді, толық?» «Егер баяндаушы басқа кейіпкер болса, оқиға қалай өзгерер еді?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде баяндау Қожаның атынан (I жақтан) жүреді. Бұл оқырманға оның ойлау тәсілін, әзіл-әсерін тікелей сезінуге мүмкіндік береді. Бірақ басқа кейіпкерлердің ішкі әлемін тек сырттай көреміз.\n\nЖиі жіберілетін қателер. Баяндаушыны автормен теңестіру; баяндаушының позициясын бір рет қана анықтап, оның шектеулігін кейінгі талдауда ескермеу.\n\nПрактикалық тапсырма. Бір эпизодты басқа кейіпкердің атынан («ол қалай көрер еді?») қайта жазып көріңіз. Бұл жаттығу баяндаушының рөлін нақты сездіреді. Сабақта қалай қолдануға болады? Жұмыс дәптерінің «Нарраторды талдау» парағын (11-парақ) қолданыңыз.\n\nТерминдік қосымша: сенімсіз баяндаушы. Әдебиеттануда I жақтан баяндайтын, көзқарасы шектеулі немесе танымдық/адамгершілік тұрғыдан толық сенім арта алмайтын баяндаушы «сенімсіз баяндаушы» (ағылш. unreliable narrator) деп аталады. Жоғарыдағы Қожа мысалы — дәл осы тәсілдің үлгісі: оқырман оқиғаны тек баланың, әлі толық жетілмеген түсінігі арқылы көреді, сондықтан кейбір ересектердің іс-әрекетін бағалауда оқырманның өзі баяндаушыдан гөрі кеңірек қорытынды жасауға тура келеді."
  },

   "id": "2.13",
   "level": 2,
   "title": "УАҚЫТ",
   "text": "Негізгі ұғым. Көркем уақыт – шығармада бейнеленген оқиғалардың өту ұзақтығы, реті және ырғағы, ол күнтізбелік уақыттан өзгеше болуы мүмкін (шегіну, жеделдету, баяулату).\n\nБұл не үшін керек? Уақытпен жұмыс автордың қай эпизодқа неге көбірек/азырақ орын бергенін, қандай сәттерді «баяулатып», егжей-тегжейлі бергенін көрсетеді.\n\nМұғалім нені байқауы керек? Кейбір эпизодтар (маңызды ішкі толғаныс) бірнеше секундты бірнеше беттей баяу сипаттауы мүмкін, ал жылдар бірнеше сөйлеммен өтіп кетуі мүмкін.\n\nҚандай сұрақ қоюға болады? «Автор қай сәтті баяулатып, қайсысын жылдам өткізіп жіберген?» «Бұны қалай түсіндірсек болады?»\n\nМәтінмен жұмыс мысалы. «Балалық шаққа саяхат» повесінде балалық шақтың бір күнгі оқиғасы бірнеше беттей толық сипатталса, кейінгі жылдар бірер сөйлеммен ғана беріледі. Бұл автордың естелікке деген эмоционалды басымдығын көрсетеді.\n\nЖиі жіберілетін қателер. Көркем уақытты нақты тарихи уақытпен шатастыру; уақыт ырғағының өзгеруін байқамай өту.\n\nПрактикалық тапсырма. Мәтіннен «баяу» баяндалған және «тез» баяндалған екі үзіндіні тауып, автордың неге дәл солай бергенін түсіндіріңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Уақыт пен кеңістікті талдау» парағын (12-парақ) қолданыңыз."

   "level": 2,
   "title": "КЕҢІСТІК",
   "text": "Негізгі ұғым. Көркем кеңістік – шығармада бейнеленген орта, орын (үй, дала, мектеп, қала, ауыл), ол көбіне символдық не психологиялық мәнге ие.\n\nБұл не үшін керек? Кеңістікті талдау автордың кейіпкерді белгілі бір ортамен байланыстыруы арқылы қандай мағына үстейтінін ашады (мысалы, «ашық дала – еркіндік», «тар үй – шектеу»).\n\nМұғалім нені байқауы керек? Кеңістік кейіпкердің ішкі күйінің «айнасы» болуы мүмкін: сыртқы пейзаж кейіпкердің көңіл-күйіне сәйкес немесе оған қарама-қарсы берілуі мүмкін.\n\nҚандай сұрақ қоюға болады? «Оқиға қай кеңістікте өтеді және бұл таңдаудың мәні неде?» «Кеңістіктің сипаттамасы кейіпкердің көңіл-күйімен қалай үндеседі/қайшы келеді?»\n\nМәтінмен жұмыс мысалы. «Көксерек» әңгімесіндегі табиғат көріністері, ауыл мен дала, тағы хайуан мен қолға үйретілген иттер.\n\nЖиі жіберілетін қателер. Кеңістік сипаттамасын тек «пейзаж» деп қарап, оның мағыналық қызметін ескермеу.\n\nПрактикалық тапсырма. Шығармадағы негізгі оқиға өрбитін 2 кеңістікті салыстырып, олардың символдық/психологиялық мәнін анықтаңыз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Уақыт пен кеңістікті талдау» парағын (12-парақ) қолданыңыз."

   "id": "2.15",
   "level": 2,
   "title": "КӨРКЕМДІК ДЕТАЛЬ",
   "text": "Негізгі ұғым. Көркемдік деталь – мәтіндегі көзге түсерліктей ерекше емес, бірақ терең мағына таситын, көп нәрсені бір штрихпен жеткізетін нақты бөлшек (зат, қимыл, сөз, түс).\n\nБұл не үшін керек? Деталь — «аз сөзбен көп айту» тәсілі. Оны тани білу оқырманды мәтіннің әр бөлшегіне мұқият қарауға үйретеді.\n\nМұғалім нені байқауы керек? Деталь қайталанып келеді немесе оқиғаның шешуші сәтінде ерекше көзге түседі. Осы қайталау/орналасу деталь маңыздылығының белгісі.\n\nҚандай сұрақ қоюға болады? «Бұл деталь неге ерекше көзге түседі?» «Ол қайталана ма? Қайталанса, не үшін?» «Осы деталь болмаса, эпизодтың мәні кем болар ма еді?»\n\nМәтінмен жұмыс мысалы. Мысалы, «Менің атым – Қожа» повесіндегі Қожаның бас киімі немесе белгілі бір заты (нақты шығармадан алынған нысан) кейіпкердің мінез-құлқының белгісіне айналуы мүмкін.\n\nЖиі жіберілетін қателер. Әрбір сипаттаманы деталь деп қабылдап, олардың арасынан мағыналы бөлшекті бөлектей алмау.\n\nПрактикалық тапсырма. Мәтіннен бір деталь тауып, оның шығарма бойында қанша рет кездесетінін, әр жолы қандай мағына қосатынын бақылаңыз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Көркемдік детальдарды анықтау» парағын (13-парақ) қолданыңыз."

   "level": 2,
   "title": "СИМВОЛ",
   "text": "Негізгі ұғым. Символ – нақты бейненің (зат, жануар, құбылыс) өзінен әлдеқайда кең, жалпыланған мағынаны білдіретін көркемдік тәсіл.\n\nБұл не үшін керек? Символды тану мәтіннің тура мағынадан асатын терең қабатына жол ашады.\n\nМұғалім нені байқауы керек? Символды таңбамен (белгі) шатастырмау: символдың мағынасы контекстке байланысты әр шығармада өзгеше болуы мүмкін (мысалы, «қасқыр» бір шығармада қатыгездік, екіншісінде – еркіндік символы болуы мүмкін).\n\nҚандай сұрақ қоюға болады? «Бұл бейне тура мағынасынан тыс тағы не білдіреді?» «Осы символ шығарманың қай идеясымен байланысады?»\n\nМәтінмен жұмыс мысалы. «Көксерек» атауындағы қасқыр бейнесі – тек әңгіме кейіпкері емес, табиғат заңын бұзған адами қатыгездіктің символы.\n\nЖиі жіберілетін қателер. Кез келген затты «символ» деп атап, оны негізсіз қалдыру; Символды бір мағынаға қатаң бекітіп, басқасын жоққа шығару.\n\nПрактикалық тапсырма. Шығармадан бір символдық бейнені тауып, оның мүмкін болатын кемінде екі мағынасын жазыңыз, әрқайсысын мәтінмен негіздеңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Символдар мен образдар» парағын (14-парақ) қолданыңыз."
  },
  {
   "id": "2.17",
   "level": 2,
   "title": "ОБРАЗДАР ЖҮЙЕСІ",
   "text": "Негізгі ұғым. Образдар жүйесі – шығармадағы барлық көркемдік бейнелердің (кейіпкер образы, табиғат образы, зат образы, ұжымдық образ) өзара байланысы мен тұтастығы.\n\nБұл не үшін керек? Образдар жүйесін көру жеке образдарды бір-бірінен оқшауламай, олардың бір-бірін толықтырып, шығарманың біртұтас көркемдік әлемін құрайтынын түсінуге көмектеседі.\n\nМұғалім нені байқауы керек? Образдар жүйесінде қарама-қарсы қойылған (антитеза) немесе параллель дамитын бейнелерге назар аудару.\n\nҚандай сұрақ қоюға болады? «Шығармадағы негізгі образдар бір-бірімен қалай байланысады – қарама-қарсы ма, ұқсас па?» «Табиғат/зат бейнелері кейіпкер бейнесімен қалай үндеседі?»\n\nМәтінмен жұмыс мысалы. «Көксерек» әңгімесінде қасқыр образы мен адам (Құрмаш) образы бастапқыда жақындасып, кейін қарама-қарсы полюске ажырайды. Бұл образдар жүйесінің динамикасы идеяны аша түседі.\n\nЖиі жіберілетін қателер. Тек кейіпкер образдарын қарап, табиғат не зат образдарын назардан тыс қалдыру.\n\nПрактикалық тапсырма. Шығармадағы 3 негізгі образды (кейіпкер, табиғат/орта, зат/символ) алып, олардың бір-бірімен байланысын сызбамен көрсетіңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Символдар мен образдар» парағын (14-парақ) кеңейтіп қолдануға болады."
  },
  {
   "id": "2.18",
   "level": 2,
   "title": "КӨРКЕМ ТІЛ",
   "text": "Негізгі ұғым. Көркем тіл – автордың сөз саптауы, сөйлем құрылысы, стилі – тілдік құралдар жиынтығы.\n\nБұл не үшін керек? Көркем тілді талдау «не айтылғаны» ғана емес, «қалай айтылғанын» көрсететін маңызды құрал.\n\nМұғалім нені байқауы керек? Автордың сөздік қорына, сөйлем ырғағына (қысқа/ұзын сөйлемдер), диалект пен ауызекі тіл элементтеріне назар аудару – кейіпкерді, ортаны сипаттаудың құралы.\n\nҚандай сұрақ қоюға болады? «Автор қандай сөздік қабатты (кітаби, ауызекі, диалект) қолданады және неге?» «Сөйлем құрылысы (қысқа, үзік-үзік немесе ұзақ, толғаулы) не үшін таңдалған?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде балаға тән ауызекі, әзіл-оспақты оралымдарды қолданыуы баяндаушының жасын, мінезін бірден сездіреді.\n\nЖиі жіберілетін қателер. Тілдік ерекшеліктерді тек «көркем» деп жалпылама айтып, нақты мысалмен көрсетпеу.\n\nПрактикалық тапсырма. Мәтіннен бір абзацты алып, онда қолданылған сөздік қабатты (кітаби/ауызекі/диалект) анықтап, бұл таңдаудың мазмұнға әсерін жазыңыз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Көркем тілге талдау» парағын (15-парақ) қолданыңыз."
  },
  {
   "id": "2.19",
   "level": 2,
   "title": "ТРОПТАР МЕН ФИГУРАЛАР",
   "text": "Негізгі ұғым. Троптар (метафора, теңеу, эпитет, метонимия, әсірелеу) мен стильдік фигуралар (қайталау, инверсия, риторикалық сұрақ) – сөздің ауыспалы мағынада немесе ерекше синтаксистік құрылымда қолданылу тәсілдері.\n\nБұл не үшін керек? Бұл тәсілдерді тану ғана емес, олардың мәтіндегі нақты қызметін түсіндіре білу маңызды. Көркемдік тәсіл өз алдына мақсат емес, мазмұн күшейту құралы.\n\nМұғалім нені байқауы керек? «Тапсырма – эпитеттерді тауып, астын сызу» деңгейінде тоқтап қалмау; Әр тәсілдің нақты осы жерде не үшін қолданылғанын түсіндіру талап ету.\n\nҚандай сұрақ қоюға болады? «Бұл теңеу/метафора арқылы автор нені салыстырады және не үшін?» «Осы тәсіл болмаса, сөйлемнің әсері қалай кемір еді?»\n\nМәтінмен жұмыс мысалы. Абайдың өлеңдеріндегі табиғат құбылыстарын адам мінезіне теңеу («Жаз» өлеңіндегі теңеулер) — бұл тек көркемдік тәсіл емес, адамның мінез-құлқын табиғи заңдылықпен байланыстыру тәсілі.\n\nЖиі жіберілетін қателер. Троптарды жаттанды түрде «тауып алу» жаттығуымен шектеу, олардың қызметін талқыламау.\n\nПрактикалық тапсырма. Мәтіннен бір теңеу немесе метафораны тауып, «автор нені немен, не үшін салыстырды?» деген сұраққа толық жауап жазыңыз.\n\nСабақта қалай қолдануға болады? «Тапты – түсіндірді – дәлелдеді» моделін қолданыңыз (10-бөлімдегі дәлел-түсіндіру-қорытынды әдісімен байланыстырыңыз)."
  },
  {
   "id": "2.20",
   "level": 2,
   "title": "МӘТІННІҢ ТАРИХИ-МӘДЕНИ КОНТЕКСТІ",
   "text": "Негізгі ұғым. Тарихи-мәдени контекст – шығарманың жазылған дәуірінің қоғамдық, тарихи, мәдени жағдайлары, олардың мәтін мазмұнына, мәселелеріне тигізген әсері.\n\nБұл не үшін керек? Контекстіні білу шығармадағы кейбір оқиғаларды, қаhармандардың мінез-құлқын, автордың позициясын дәлірек түсінуге көмектеседі.\n\nМұғалім нені байқауы керек? Контекст талдауды толықтыра түседі: тарихи фактіні айтып қана қоймай, оның мәтінмен нақты байланысын көрсету керек.\n\nҚандай сұрақ қоюға болады? «Шығарма жазылған дәуірде қандай қоғамдық жағдай болды?» «Бұл жағдай кейіпкерлердің таңдауына, мәселелерге қалай әсер етеді?»\n\nМәтінмен жұмыс мысалы. С.Мұқановтың шығармаларындағы ауыл өмірінің бейнесін түсіну үшін ХХ ғасыр басындағы қазақ ауылының әлеуметтік жағдайын білу маңызды.\n\nЖиі жіберілетін қателер. Сабақты тарихи анықтамаға айналдырып, мәтіннің өзін талдамау.\n\nПрактикалық тапсырма. Шығарма жазылған дәуір туралы 3-4 негізгі факт жинап, олардың қайсысы мәтінді түсінуге тікелей қатысты екенін таңдаңыз.\n\nСабақта қалай қолдануға болады? Контекстіні сабақтың басында қысқа (5 минуттық) кіріспе түрінде беріп, негізгі уақытты мәтінмен жұмысқа қалдырыңыз."
  },
  {
   "id": "2.21",
   "level": 2,
   "title": "ШЫҒАРМАНЫҢ ҚАЗІРГІ ОҚУШЫ ҮШІН МАҢЫЗЫ",
   "text": "Негізгі ұғым. Бұл компонент – шығарманың тек тарихи ескерткіш емес, бүгінгі оқырманға да қатысы бар, өзекті мәселелер көтеретінін анықтау.\n\nБұл не үшін керек? Оқушыны шығармаға «өз өмірінің призмасы» арқылы қарауға шақыру – бұл әдебиетке деген қызығушылықты арттырудың басты жолдарының бірі.\n\nМұғалім нені байқауы керек? Шығарманы «қазіргі заманға көшіру» деңгейінде тарылтпай, дәуір ерекшелігін сақтай отырып, ортақ адами мәселені көрсету.\n\nҚандай сұрақ қоюға болады? «Бұл мәселе қазіргі күнде де кездесе ме? Қалай?» «Сіз кейіпкердің орнында болсаңыз, қазіргі жағдайда қалай әрекет етер едіңіз?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесіндегі ересектермен түсінбеушілік, өз бетінше шешім қабылдау мәселесі қазіргі оқушыға да таныс.\n\nЖиі жіберілетін қателер. Шығарманы толық «бүгінгі күнге» ауыстырып, тарихи-мәдени өзгешелігін жоққа шығару.\n\nПрактикалық тапсырма. Шығармадағы мәселенің қазіргі өмірдегі ұқсас көрінісін (мысал арқылы) сипаттаңыз.\n\nСабақта қалай қолдануға болады? Сабақ соңында «бұл шығарма бізге бүгін не айтады?» деген қорытынды талқылау ұйымдастырыңыз."
  },
  {
   "id": "2.22",
   "level": 2,
   "title": "ИНТЕРПРЕТАЦИЯ",
   "text": "Негізгі ұғым. Интерпретация – талдаудың барлық компоненттерінен (тақырып, идея, кейіпкерлер, деталь, символ, контекст) жиналған дәлелдерді біріктіріп, шығармаға тұтас, дәлелденген түсінік беру.\n\nБұл не үшін керек? Интерпретация – талдаудың қорытынды сатысы.\n\nМұғалім нені байқауы керек? Оқушылардың әртүрлі, тіпті бір-біріне қайшы интерпретациясын, әрқайсысы мәтінмен негізделген болса, заңды нұсқа ретінде қабылдау.\n\nҚандай сұрақ қоюға болады? «Барлық жинаған дәлелдеріңіз негізінде шығарма туралы қандай тұтас қорытынды жасайсыз?» «Интерпретацияңызды қолдамайтын оқырман қандай қарсы дәлел келтіре алар еді?»\n\nМәтінмен жұмыс мысалы. «Көксерек» әңгімесін бір оқырман «табиғатты бағындыруға болмайтыны туралы ескерту» деп интерпретацияласа, екіншісі «адам мен жабайы табиғаттың арасындағы шекараны сақтау қажеттігі» деуі мүмкін. Екеуі де дұрыс. Екеуі де мәтінмен негізделген.\n\nЖиі жіберілетін қателер. Интерпретацияны бір «дұрыс» жауап аясында тарылту; интерпретацияны дәлелсіз, тек субъективті әсер ретінде беру.\n\nПрактикалық тапсырма. Өз интерпретацияңызды бір абзацта тұжырымдап, оны растайтын кемінде үш мәтіндік дәлел келтіріңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Қорытынды интерпретация парағын» (22-парақ) қолданып, әр оқушыдан жеке, дәлелденген интерпретация талап етіңіз, оларды бір бірімен салыстырыңыз.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\n22 қадамдық әмбебап алгоритм бағдарламаның мына міндеттерін кешенді түрде жүзеге асырады: 5.1.1.1–9.1.1.1 «Көркем шығарманың мазмұны мен пішіні» — алгоритмнің тақырып, идея, жанр қадамдары. 5.2.1.1–9.2.1.1 «Әдеби шығарманың композициясы» — сюжет, композиция, конфликт қадамдары. 5.2.2.1–9.2.2.1 «Автор бейнесі» — авторлық позиция мен баяндау қадамы.\n\n5.2.3.1–9.2.3.1 «Көркем шығарманың тілі» — көркемдік құралдар мен стиль қадамы.\n\n5.3.1.1–9.3.1.1 «Тарихи және көркемдік құндылық» — қорытынды бағалау қадамы.\n\n5.3.2.1–9.3.2.1 «Заманауилығы мен жаңашылдығы» — қорытынды бағалау қадамы."
  },
  {
   "id": "2.23",
   "level": 2,
   "title": "МОТИВ",
   "text": "Негізгі ұғым. Мотив – шығарма бойында (немесе бір автордың бүкіл шығармашылығында) қайталанып келетін тұрақты тақырыптық-бейнелік элемент (белгілі бір жағдай, әрекет, зат, эмоция), ол әр қайталанған сайын жаңа мағыналық реңк қосады. Мотивті бір реттік детальден (2.15-тармақ) және тұрақты символдан (2.16-тармақ) ажырататын басты белгі – оның қайталана беруі.\n\nБұл не үшін керек? Мотивтерді бақылау шығарманың (немесе автордың бүкіл шығармашылық жүйесінің) ішкі бірлігін, қандай мәселенің автор үшін неге маңызды екенін көрсетеді.\n\nМұғалім нені байқауы керек? Мотивті кездейсоқ қайталанудан ажырату: егер элемент бір рет қана кездессе, ол — деталь; егер шығарма бойында бірнеше рет, әр жолы жаңа мән қосып оралса — бұл мотив.\n\nҚандай сұрақ қоюға болады? «Бұл жағдай/бейне/әрекет шығармада тағы қайда кездеседі?» «Әр қайталану алдыңғысынан немен ерекшеленеді?» «Бұл мотив шығарманың қай идеясымен байланысады?»\n\nМәтінмен жұмыс мысалы. Б.Соқпақбаевтың «Менің атым — Қожа» повесінде «жаза мен кешірім» мотиві бірнеше рет қайталанады (мектептен қуылу қаупі, үйде жазалану, ақыры кешірілу): әр қайталану Қожаның жауапкершілікке деген қатынасының бірте-бірте өзгеруін көрсетеді (3-бөлімдегі кейіпкер эволюциясымен тікелей байланысты).\n\nЖиі жіберілетін қателер. Мотивті символмен шатастыру (символ – бір бейненің терең мағынасы, мотив – қайталанатын элемент); бір рет кездескен элементті мотив деп қате атау.\n\nПрактикалық тапсырма. Шығармадан кемінде екі рет қайталанатын бір мотивті тауып, әр қайталанудың контекстін жазып, олардың арасындағы мағыналық дамуды түсіндіріңіз.\n\nСабақта қалай қолдануға болады? Оқушыларға шығарманы оқу барысында бір «қайталанатын нәрсені» (сөз, жағдай, бейне) белгілеп отыруды тапсырыңыз, сабақ соңында осы белгілеулерді салыстырып, ортақ мотивті бірге тұжырымдаңыз."
  },

   "title": "ХРОНОТОП: УАҚЫТ ПЕН КЕҢІСТІКТІҢ БІРТҰТАСТЫҒЫ",
   "text": "Негізгі ұғым. Хронотоп («уақыт-кеңістік») – М.М.Бахтин ұсынған ұғым (қараңыз: Пайдаланылған әдебиеттер), шығармадағы уақыт (2.13-тармақ) пен кеңістіктің (2.14-тармақ) бір-бірінен бөлек емес, өзара тығыз байланысқан, біртұтас көркемдік категория ретінде жұмыс істеуін білдіреді.\n\nБұл не үшін керек? Уақыт пен кеңістікті бөлек қарау кейде олардың бірігіп тудыратын мағынасын жіберіп алуға әкеледі: белгілі бір орын әрдайым белгілі бір уақыт ырғағымен, тіршілік үлгісімен байланысты болады.\n\nМұғалім нені байқауы керек? Дәстүрлі әдебиеттануда кейбір хронотоп түрлері жеке аталады: «жол хронотопы» (саяхат, іздену — үнемі қозғалыстағы уақыт-кеңістік), «табалдырық хронотопы» (шешім қабылданатын шектес сәт/орын), «идиллиялық хронотоп» (тұйық, өзгермейтін, үйлесімді ауыл/отбасы әлемі).\n\nҚандай сұрақ қоюға болады? «Оқиға өтетін орын мен уақыт бір-бірімен қалай байланысады?» «Кейіпкер бір хронотоптан (мысалы, ауыл) екіншісіне (мысалы, қала) көшкенде не өзгереді?»\n\nМәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде ауыл/мектеп кеңістігі – балалық шақтың, әлі толық қалыптаспаған жауапкершіліктің «идиллиялық» хронотопы; повесть барысында осы хронотоптың ішінде уақыт кейіпкердің есеюімен бірге «ширата» түседі.\n\nЖиі жіберілетін қателер. Хронотопты жай ғана «іс-әрекет орны әрі уақыты» деп жаттанды анықтамамен шектеу, оның мағына тудырушы қызметін ашпау.\n\nПрактикалық тапсырма. Шығармадан кейіпкер бір кеңістіктен екінші кеңістікке ауысатын сәтті тауып, осы ауысу оқиғаның қарқыны мен кейіпкердің ішкі күйін қалай өзгертетінін сипаттаңыз.\n\nСабақта қалай қолдануға болады? 2.13 және 2.14-тармақтардың толтырылған нұсқаларын (жұмыс дәптерінің 12-парағы) салыстырып, оқушылармен «бұл екеуі бір-біріне қалай әсер етеді?» деген талқылау жүргізіңіз.\n\nКәсіби рефлексия: 22 компоненттің қайсысын мен өз тәжірибемде жиі ұмытып кетемін? Неліктен?"

   "title": "КЕЙІПКЕРДІ ТАЛДАУ ӘДІСТЕМЕСІ",
   "text": "Мектепте кейіпкерді талдау көбіне бір өлшемге: «бұл кейіпкер жақсы ма, жаман ба?» деп бағалайтынын жиі көреміз. Бұл тәсіл кейіпкерді біржақты бейнеге айналдырады және көркем әдебиеттің басты құндылығы, адам жанының күрделілігін, қайшылығын көрсете алмайды.\n\nКәсіби талдау кейіпкерге баға беруден бұрын оны түсінуге тырысады: Неге ол дәл осылай әрекет етті? Оның ішкі себептері қандай? Оның таңдауы қандай құндылықтан туындайды? Бағалау (егер қажет болса) осы түсінуден кейін, дәлелденген негізде жасалады. Төменде берілген 13 аспект кейіпкерді осы терең деңгейде талдауға арналған құрал.\n\nКейіпкер талдаудың 13 аспектісі\n\n1. Портрет. Кейіпкердің сыртқы бейнесі (кескін-келбеті, киімі, қимыл-қозғалысы). Байқау: портрет толық па, үзік-үзік пе, қандай детальға екпін түседі. Сұрақ: «Автор портретте нені атап көрсетеді және бұл кейіпкердің мінезіне қалай меңзейді?» Мысалы: киімінің тозығы арқылы кейіпкердің әлеуметтік жағдайын жанама түрде беру. Тапсырма: кейіпкердің портретінен мінезіне қатысты болжам жасап, оны кейінгі әрекеттерімен тексеріңіз.\n\n2. Мінез. Кейіпкерге тән тұрақты қасиеттер (батылдық, қызғаншақтық, адалдық). Мінез автордың тікелей сипаттауымен емес, әрекеттер арқылы ашыла ма, байқаңыз. Сұрақ: «Кейіпкердің қай әрекеті оның мінезін ең айқын көрсетеді?» Мысалы: қиын жағдайдағы таңдау арқылы батылдықты көрсету. Тапсырма: Кейіпкердің үш мінез қасиетін тізіп, әрқайсысын растайтын нақты эпизодты жазыңыз.\n\n3. Іс-әрекет. Кейіпкердің нақты қимылдары, шешімдері. Байқау: әрекет пен сөздің сәйкестігін тексеру. Сұрақ: «Кейіпкер бір жағдайда не істейді, ал не істей алар еді?» Мысал: жауапкершіліктен қашу немесе оны мойындау сәттері. Тапсырма: кейіпкердің бір шешуші әрекетін тауып, оның салдарын сипаттаңыз.\n\n4. Сөзі. Кейіпкердің тілі, сөйлеу мәнері, лексикасы. Байқау: сөйлеу мәнері оның біліміне, ортасына, жасына сай ма? Сұрақ: «Кейіпкердің сөзі оның ойымен/әрекетімен үндесе ме, әлде қайшы келе ме?» Мысал: батыл сөйлейтін, бірақ іс жүзінде қорқақ кейіпкер. Тапсырма: кейіпкердің бір тұтас репликасын талдап, онда не жасырын, не анық айтылғанын ажыратыңыз.\n\n5. Ойы. Кейіпкердің ішкі монологы, толғанысы (автор берген жағдайда). Байқау: кейіпкердің ойы мен сыртқы әрекетінің арасындағы алшақтық. Сұрақ: «Кейіпкер сыртынан не көрсетеді, іштей нені сезінеді?» Мысал: сыртынан сабырлы, ал ішінен қатты алаңдаған кейіпкер. Тапсырма: кейіпкердің бір сәттегі ішкі күйін өз сөзіңізбен жазып көріңіз.\n\n6. Басқа кейіпкерлермен қарым-қатынасы. Кейіпкердің достарымен, отбасымен, қарсыластарымен байланысы. Байқау: қарым-қатынас қалай өзгереді, кіммен қалай сөйлеседі? Сұрақ: «Кейіпкер әр адаммен қалай өзгеше сөйлеседі/әрекет етеді, бұл не туралы айтады?» Мысал: ата-анасымен бір, құрдастарымен басқа мінез көрсету. Тапсырма: кейіпкердің екі түрлі қарым-қатынасын салыстырыңыз.\n\n7. Мақсаты. Кейіпкердің ұмтылысы, не үшін әрекет ететіні. Байқау: мақсат ашық айтыла ма, әлде әрекеттен шығарылады ма. Сұрақ: «Кейіпкер нені қалайды және неге дәл соны?» Мысал: тану/мойындалу қажеттілігі негізінде әрекет ету. Тапсырма: кейіпкердің басты мақсатын бір сөйлеммен тұжырымдаңыз.\n\n8. Ішкі қайшылығы. Кейіпкердің қарама-қайшы ұмтылыстары, құндылықтар арасындағы тартыс. Байқау: кейіпкер бір мезгілде екі түрлі нәрсені қалай ма? Сұрақ: «Кейіпкердің бойында қандай екі құндылық/ұмтылыс қақтығысады?» Мысал: еркіндік пен жауапкершілік арасындағы тартыс. Тапсырма: кейіпкердің ішкі қайшылығын екі қарама-қарсы ұмтылыс түрінде сипаттаңыз.\n\n9. Құндылықтары. Кейіпкердің нені маңызды деп санайтыны (отбасы, ар-намыс, еркіндік, әділдік). Байқау: құндылық тікелей айтылмаса, таңдаулардан шығарылады. Сұрақ: «Кейіпкердің таңдаулары оның қандай құндылықтарын көрсетеді?» Мысал: қиын жағдайда достықты пайдадан жоғары қою. Тапсырма: кейіпкердің екі негізгі құндылығын анықтап, дәлелдеңіз.\n\n10. Таңдауы. Кейіпкердің шешуші сәттегі нақты таңдауы. Байқау: таңдау қандай баламалар арасында жасалады. Сұрақ: «Кейіпкердің алдында қандай баламалар болды, ол неге дәл осыны таңдады?» Мысал: жеке ұтысты құрбандыққа шалу таңдауы. Тапсырма: кейіпкердің бір таңдауын баламаларымен бірге сипаттаңыз.\n\n11. Конфликтісі. Кейіпкердің қатысатын сыртқы және/немесе ішкі қақтығысы (4-бөлімде толық қаралады). Байқау: конфликт кейіпкерді қалай сынайды. Сұрақ: «Бұл конфликт кейіпкердің қандай қасиетін ашады?» Мысал: қоғам талабына қарсы жеке таңдау. Тапсырма: кейіпкердің негізгі конфликтісін бір сөйлеммен белгілеңіз.\n\n12. Өзгеруі (эволюциясы). Төменде жеке қаралады.\n\n13. Автордың кейіпкерге қатынасы. Автордың кейіпкерге деген жанама бағасы (11-бөлімшемен, «Автор позициясы» тарауымен байланысты). Байқау: автор кейіпкерді ақтай ма, сынай ма, түсіністікпен қарай ма. Сұрақ: «Автор кейіпкерге қандай тілдік/композициялық құралдар арқылы қатынасын білдіреді?» Мысал: кейіпкердің қатесін жұмсақ юмормен беру арқылы түсіністік таныту. Тапсырма: автордың кейіпкерге қатынасын білдіретін бір деталь/сөз тіркесін тауып түсіндіріңіз.\n\nКейіпкер эволюциясы ұғымы\n\n1. Кейіпкер эволюциясы – кейіпкердің шығарма барысында мінезінде, көзқарасында, құндылықтар жүйесінде болатын, оқиғалармен себеп-салдарлық байланысты өзгеріс. Эволюция міндетті түрде «жақсаруды» білдірмейді — кейіпкердің азып-тозуы, күйзелуі, түңілуі де мүмкін; кейбір кейіпкерлер әдейі статикалық (өзгермейтін) болып қалады, бұл да авторлық тәсілдің бірі.\n\n2. Бұл не үшін керек? Эволюцияны бақылау кейіпкерді дамитын тұлға (бірақ үнемі емес!) ретінде көруге үйретеді және шығарманың ішкі динамикасын, идеясының қалай сатылап ашылатынын түсінуге көмектеседі.\n\n3. Мұғалім нені байқауы керек? Өзгеріс бір ғана оқиғадан емес, бірнеше сатыдан тұратынын; әр сатыда қандай нақты оқиға/таңдау түрткі болғанын мұғалімнің өзі алдын ала белгілеп қоюы керек.\n\n4. Қандай сұрақ қоюға болады? «Кейіпкер шығарманың басында кім еді, соңында кім болды?» «Бұл өзгеріске қандай нақты оқиға(лар) түрткі болды?» «Егер кейіпкер өзгермесе, бұл немен түсіндіріледі?»\n\n5. Мәтінмен жұмыс мысалы. «Менің атым – Қожа» повесінде Қожаның жауапкершілікке, ересектердің талабына деген қатынасы бірнеше «сабақ болған» жағдайдан кейін бірте-бірте өзгереді, бірақ өзінің әзілқой, қиялшыл табиғатын толық жоймайды. Кейіпкер «мүлдем басқа адамға» айналмайды.\n\n6. Жиі жіберілетін қателер. Эволюцияны бір оқиғаға телу; «түзелу» моделін барлық кейіпкерге механикалық қолдану; статикалық кейіпкерді «нашар жазылған» деп қате бағалау.\n\n7. Практикалық тапсырма. Кейіпкердің шығарма басындағы және соңындағы күйін екі бағанға жазып салыстырыңыз, өзгерістің (немесе өзгермеудің) 2-3 сатысын және әр сатыдағы түрткі оқиғаны көрсетіңіз.\n\n8. Сабақта қалай қолдануға болады? Жұмыс дәптерінің «Кейіпкер эволюциясы» парағын (8-парақ) қолданып, оқушыларға уақыт өсі бойынша кейіпкердің өзгеру «сызбасын» сыздырыңыз (бастапқы күй → түрткі оқиға → аралық күй → соңғы күй).\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндетін орындауға негіз болады:\n\n5.1.3.1–9.1.3.1 «Көркем шығармадағы образ» (кейіпкер образын талдау әдістемесі).\n\nКәсіби рефлексия: Мен кейіпкерді бағалауда «жақсы/жаман» бинарлы бағаға қаншалықты жиі ауысып кетемін?"

   "text": "Классикалық сюжет құрылымы алты сатыдан тұрады.\n\nЭкспозиция. Негізгі оқиғаға дейінгі жағдай: кейіпкерлер, орта, уақыт таныстырылады. Экспозиция қысқа болуы мүмкін (бір абзац) немесе бүкіл тарауға созылуы мүмкін. Оның көлемі автордың нені маңызды деп есептейтініне қарай жазылады. ​ Не іздеу керек: бастапқы жағдай қандай, оған кейін қандай жағдайлар әсер етті? бұзылады. «Оқиға басталмас бұрын әлем қандай күйде болды?» Мысал: «Менің атым – Қожа» повесінің басындағы отбасы мен мектеп өмірінің қалыпты суреттелуі.\n\nТапсырма: экспозициядан кейінгі оқиғаның бастауын болжайтын бір деталь тауыңыз.\n\nБайланыс. Негізгі қақтығысқа себеп болатын оқиға. Сұрақ: «Қандай оқиға бәрін өзгертті?» Мысал: кейіпкердің күтпеген шешім қабылдауы немесе жаңа кейіпкердің пайда болуы.\n\nТапсырма: байланыс сәтін бір сөйлеммен анықтап, одан кейін оқиғаның қалай өзгеше бағытқа түскенін жазыңыз.\n\nОқиғаның дамуы. Байланыстан кейінгі, қақтығыс күшейе беретін оқиғалар тізбегі. Не іздеу керек: әр жаңа эпизод қақтығысты қалай тереңдетеді, кейіпкерге қандай жаңа сынақ қояды. Сұрақ: «Әр келесі оқиға алдыңғысынан қалай ауыр/күрделі?» Мысал: кейіпкердің бірнеше рет сәтсіздікке ұшырауы, әр жолы жаңа қиындықпен бетпе-бет келуі.\n\nТапсырма: даму сатысындағы 3 оқиғаны тізіп, олардың арасындағы байланысты көрсетіңіз.\n\nШиеленіс. Қақтығыстың шешуші сәтке жақындауы, ең жоғары эмоционалды-драмалық кернеу алдындағы кезең. Не іздеу керек: баяндау ырғағының жеделдеуі, оқиғалардың жиілей түсуі. Сұрақ: «Оқиға шарықтау шегіне қалай жақындайды, қандай белгілер бар?» Мысал: шешуші кездесу/қақтығысқа дейінгі күту, дайындық сәттері.\n\nТапсырма: шиеленіс сатысын тауып, автордың күшейткіш құралдарын (тіл, ырғақ арқылы) сипаттаңыз.\n\nШарықтау шегі (кульминация). Қақтығыстың ең жоғары, шешуші нүктесі. Кейіпкердің түбегейлі таңдау жасайтын немесе қақтығыстың ашық көрінетін сәті. Бұл – шығармадағы ең маңызды сәт, кейіпкер туралы ең көп ақпарат осы жерде ашылады. Сұрақ: «Осы сәтте кейіпкер қандай түбегейлі шешім қабылдайды, ол оның бүкіл мінезін қалай қорытындылайды?»\n\nТапсырма: шарықтау шегін анықтап, неге дәл осы сәт шығарманың ең маңызды нүктесі екенін дәлелдеңіз.\n\nШешім (развязка). Қақтығыстың нәтижесі, оқиғаның қорытындысы. Не іздеу керек: шешім қаншалықты «толық» – барлық сұраққа жауап бере ме, әлде ашық қалдырыла ма (ашық финал). Сұрақ: «Қақтығыс қалай аяқталды және бұл аяқталу идеямен қалай байланысады?» Мысал: кейіпкердің өзгерген/өзгермеген күйінің көрінісі.\n\nТапсырма: шешімнің экспозициядағы бастапқы жағдаймен қалай салыстырылатынын (не өзгерді, не өзгермеді) жазыңыз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Сюжет картасы» (4-парақ) және «Композиция картасы» (5-парақ) парақтарын қолданып, оқушыларға осы алты сатыны шығармадан нақты дәйексөзбен/эпизодпен толтыртыңыз."

   "title": "КОНФЛИКТ ТҮРЛЕРІ",
   "text": "Конфликт екі негізгі өлшем бойынша жіктеледі: сипаты бойынша (сыртқы/ішкі) және қатысушылары бойынша (тұлға-тұлға, тұлға-қоғам, тұлға-табиғат, тұлға-өзі).\n\nСыртқы конфликт. Кейіпкердің сыртқы күштермен (басқа кейіпкер, қоғам, табиғат) ашық қақтығысы, көбіне әрекет, оқиға арқылы көрінеді. Не іздеу керек: қақтығысқа қатысушы екі тарап нақты кім/не. Сұрақ: «Кейіпкер сыртта кіммен/немен күреседі?» Мысал: екі кейіпкердің мүддесінің тікелей қайшы келуі.\n\nІшкі конфликт. Кейіпкердің өз ішінде жүретін, екі құндылық/ұмтылыс арасындағы психологиялық тартыс, сыртқы әрекетте бірден көрінбеуі мүмкін. Не іздеу керек: кейіпкердің толғанысы, кідірісі, қарама-қайшы ойлары. Сұрақ: «Кейіпкер өз ішінде нені шеше алмай тұр?»\n\nТұлға – тұлға. Екі кейіпкердің мүддесінің, көзқарасының тікелей қайшы келуі. Мысал: бас кейіпкер мен антагонистің (қарама-қарсы кейіпкер) қақтығысы.\n\nТұлға – қоғам. Кейіпкердің қоғамдық норма, дәстүр, ортақ пікірге қарсы тұруы. Мысал: жеке таңдауды қоғам талабына қарсы қою.\n\nТұлға – табиғат. Кейіпкердің табиғи күштермен (аштық, дауыл, жабайы аң) күресі. Мысал: «Көксерек» әңгімесіндегі адам мен қасқыр арасындағы қатынастың табиғи заңдылыққа ұласуы.\n\nТұлға – өзі. Кейіпкердің өз ар-ожданымен, қорқынышымен, күмәнімен күресі (ішкі конфликтпен тығыз байланысты). Мысал: қателігін мойындау немесе жасыру арасындағы тартыс.\n\nПрактикалық тапсырма. Соңғы өткен шығармадан бір сыртқы, бір ішкі конфликт мысалын тауып, олардың бір-бірімен қалай байланысатынын (ішкі конфликт сыртқы оқиғаны қалай тудырады немесе одан туындайды) түсіндіріңіз.\n\nСабақта қалай қолдануға болады? Жұмыс дәптерінің «Конфликт картасы» парағында (6-парақ) оқушыларға конфликтіні екі бағанмен (сыртқы/ішкі) және қатысушылар түрімен белгілетіңіз, содан кейін екеуінің арасындағы байланысты сызбамен көрсетуді сұраңыз.\n\nОҚУ БАҒДАРЛАМАСЫМЕН БАЙЛАНЫСЫ\n\nБұл бөлім бағдарламаның мына міндетін тереңдете жүзеге асырады: 5.2.1.1–9.2.1.1 «Әдеби шығарманың композициясы» (сюжет, композиция, конфликт).\n\nКәсіби рефлексия: Соңғы өткен шығармамда конфликтінің ішкі және сыртқы түрін бөлек көрсете алдым ба?"
