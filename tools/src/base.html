<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">

<title>Көркем шығарманы талдау</title>
<!--
================================================================================
  КӨРКЕМ ШЫҒАРМАНЫ ТАЛДАУ — мұғалімге арналған құрал (kobem-talday.html)
  «Көркем шығарманы талдау» практикалық жұмыс дәптері (31 парақ) негізінде.
================================================================================

README

  How to open
    - Double-click kobem-talday.html (Chrome / Edge / Firefox / Safari).
      No internet, server or installation needed; the file makes no network
      requests, so it works fully offline.
    - Work is saved automatically in this browser (localStorage). If storage is
      blocked, a warning appears in the top bar — use «Файлға сақтау».

  How to export / import
    - «Файлға сақтау» downloads a backup file (.json) of the current analysis.
    - «Файлдан ашу» loads such a file on another device. The file is
      validated; a malformed file shows a Kazakh error and nothing is changed.
    - No student personal data is stored. Student-facing sheets (e.g. 26,
      self-assessment) and the "Оқушының аты-жөні" header exist only as blank
      printouts.

  How to change worksheets or add a genre (data only)
    - WORKBOOK (the WORKSHEETS data block) holds all 31 sheets exactly as in the
      workbook JSON. Edit labels there, or paste a newer export of the JSON.
      Field types: text, long, list (3 rows), table (columns × rows),
      dropdown (options), tags (multi-choice options), rubric.
    - A sheet's "genres" says where it appears: ["all"] or a genre id.
    - To add a genre: add an entry to CONFIG → GENRES (label + lessonPlan
      activity set), tag its sheets with the genre id, and optionally add an
      activity set in LESSON_PLAN → activities.
    - UI labels live in STRINGS (one object) so a Russian version can be added.

  Code sections: CONFIG, STRINGS, WORKSHEETS, STATE, RENDER, LESSON_PLAN,
  RUBRIC, PRINT, IMPORT/EXPORT, INIT.
================================================================================
-->
<style>
  /* ---------- Tokens ---------- */
  :root {
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #faf8f4;
    --ink: #1f2328;
    --ink-2: #545b64;
    --line: #dcd7cd;
    --accent: #1f6f5c;
    --accent-ink: #ffffff;
    --accent-soft: #e3f1ec;
    --warn: #8a5a00;
    --warn-soft: #fff4dc;
    --danger: #a3271f;
    --danger-soft: #fde8e6;
    --stage-empty: #e8e3d8;
    --radius: 8px;
    --font: "Segoe UI", "Noto Sans", Roboto, "Helvetica Neue", Arial, sans-serif;
    --overlay: rgba(20, 24, 26, .5);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15191b; --surface: #1f2427; --surface-2: #1a1e21; --ink: #e6e9ea; --ink-2: #a2abb1;
      --line: #353c41; --accent: #56b79c; --accent-ink: #0d1a16; --accent-soft: #1c3830;
      --warn: #e4b45e; --warn-soft: #382c14; --danger: #f08b80; --danger-soft: #3b1d1a;
      --stage-empty: #2d3337; --overlay: rgba(0, 0, 0, .6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15191b; --surface: #1f2427; --surface-2: #1a1e21; --ink: #e6e9ea; --ink-2: #a2abb1;
    --line: #353c41; --accent: #56b79c; --accent-ink: #0d1a16; --accent-soft: #1c3830;
    --warn: #e4b45e; --warn-soft: #382c14; --danger: #f08b80; --danger-soft: #3b1d1a;
    --stage-empty: #2d3337; --overlay: rgba(0, 0, 0, .6); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---------- App layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 290px minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "top top" "side main" "side foot";
    height: 100%;
  }
  .topbar {
    grid-area: top;
    display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--line);
  }
  .brand { margin-right: auto; min-width: 180px; }
  .brand h1 { margin: 0; font-size: 18px; line-height: 1.2; }
  .brand p { margin: 0; font-size: 12px; color: var(--ink-2); }
  .tb-field { display: flex; flex-direction: column; gap: 2px; }
  .tb-field label { font-size: 12px; color: var(--ink-2); }
  .tb-field input { width: 210px; }
  .tb-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .save-status { font-size: 12px; color: var(--ink-2); min-width: 70px; }
  .save-status.off { color: var(--warn); }

  .sidebar {
    grid-area: side;
    overflow-y: auto;
    background: var(--surface-2);
    border-right: 1px solid var(--line);
    padding: 12px 10px;
  }
  .sidebar h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--ink-2); margin: 10px 8px 6px;
  }
  .steps { list-style: none; margin: 0 0 6px; padding: 0; }
  .step-btn {
    width: 100%; display: flex; align-items: flex-start; gap: 10px;
    text-align: left; padding: 6px 8px; margin-bottom: 1px;
    border: 1px solid transparent; border-radius: var(--radius);
    background: transparent; cursor: pointer;
  }
  .step-btn:hover { background: var(--surface); border-color: var(--line); }
  .step-btn[aria-current="step"] { background: var(--accent-soft); border-color: var(--accent); }
  .step-num {
    flex: none; min-width: 26px; height: 24px; border-radius: 12px; padding: 0 4px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 600;
    border: 1.5px solid var(--line); background: var(--surface); color: var(--ink-2);
  }
  .step-btn.done .step-num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .step-label { font-size: 13.5px; line-height: 1.35; padding-top: 2px; }
  .privacy { font-size: 12px; color: var(--ink-2); margin: 12px 8px; }
  .sr-only { position: absolute; left: -9999px; }

  .main { grid-area: main; overflow-y: auto; padding: 20px 28px 40px; }
  .main-inner { max-width: 900px; margin: 0 auto; }
  .ws-kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; margin: 0; }
  .ws-title { font-size: 22px; margin: 0 0 4px; }
  .ws-meta { color: var(--ink-2); font-size: 13px; margin: 0 0 16px; }
  .ws-intro { color: var(--ink-2); margin: 0 0 16px; }
  .ws-tools { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .footer {
    grid-area: foot;
    display: flex; align-items: center; gap: 14px;
    padding: 10px 20px;
    background: var(--surface);
    border-top: 1px solid var(--line);
  }
  .progress { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .progress-track { height: 8px; background: var(--stage-empty); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  .progress-label { font-size: 12px; color: var(--ink-2); }

  /* ---------- Controls ---------- */
  .btn {
    border: 1px solid var(--line); background: var(--surface);
    padding: 7px 12px; border-radius: var(--radius); cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .btn.danger { color: var(--danger); }
  input[type=text], select, textarea {
    border: 1px solid var(--line); border-radius: 6px;
    padding: 7px 9px; background: var(--surface); width: 100%;
  }
  textarea { min-height: 76px; resize: vertical; }
  input:focus, select:focus, textarea:focus, .btn:focus-visible, .step-btn:focus-visible, .chip:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  /* ---------- Worksheet fields ---------- */
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px;
  }
  .field-label { display: block; font-weight: 600; margin-bottom: 6px; }
  .list-inputs { display: grid; gap: 6px; }
  .list-row { display: flex; gap: 8px; align-items: center; }
  .list-row span { color: var(--ink-2); font-size: 13px; width: 18px; text-align: right; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 99px;
    padding: 4px 12px; cursor: pointer; font-size: 14px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .ws-table { width: 100%; border-collapse: collapse; }
  .ws-table th { text-align: left; font-size: 13px; color: var(--ink-2); font-weight: 600; padding: 0 4px 6px; vertical-align: bottom; }
  .ws-table td { padding: 3px 4px; vertical-align: top; }
  .ws-table td.rownum { width: 20px; color: var(--ink-2); font-size: 13px; padding-top: 10px; }
  .ws-table textarea { min-height: 42px; }

  /* Plot bar (shown above sheets that contain the six plot stages) */
  .stagebar {
    display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px;
    align-items: end; height: 100px; margin: 4px 0 4px;
  }
  .stage-col { display: flex; flex-direction: column; justify-content: flex-end; height: 100%; cursor: pointer; border: 0; background: none; padding: 0; }
  .stage-bar { border-radius: 6px 6px 0 0; background: var(--stage-empty); transition: background .2s; }
  .stage-col.filled .stage-bar { background: var(--accent); }
  .stage-names { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; }
  .stage-names span { font-size: 12px; text-align: center; color: var(--ink-2); line-height: 1.25; }

  /* Messages */
  .banner {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 12px; border-radius: var(--radius); margin-bottom: 14px;
    border: 1px solid;
  }
  .banner p { margin: 0; flex: 1; }
  .banner.error { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
  .banner.ok { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
  .banner.warn { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
  .banner button { border: 0; background: none; cursor: pointer; color: inherit; font-size: 18px; line-height: 1; }
  .label-list { margin: 0; padding-left: 20px; }
  .label-list li { margin-bottom: 4px; }

  /* Lesson plan & rubric */
  .plan-text { min-height: 60vh; font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
  .rubric-table { width: 100%; border-collapse: collapse; background: var(--surface); }
  .rubric-table th, .rubric-table td { border: 1px solid var(--line); padding: 8px; vertical-align: top; font-size: 13.5px; }
  .rubric-table thead th { background: var(--surface-2); text-align: left; }
  .rubric-table tbody th { width: 20%; text-align: left; background: var(--surface-2); }
  .rubric-table .score-col { width: 9%; }
  .rubric-bands { font-size: 13.5px; color: var(--ink-2); }

  #print-area { display: none; }

  /* In-page dialogs */
  .dlg-overlay {
    position: fixed; inset: 0; z-index: 50; background: var(--overlay);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .dlg {
    background: var(--surface); color: var(--ink); border: 1px solid var(--line);
    border-radius: 10px; width: 100%; max-width: 640px; max-height: 90%; overflow: auto;
    padding: 18px 20px; box-shadow: 0 12px 40px rgba(0, 0, 0, .3);
  }
  .dlg h2 { margin: 0 0 8px; font-size: 18px; }
  .dlg p { margin: 0 0 10px; }
  .dlg-code { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px; min-height: 200px; }
  .dlg-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .app { grid-template-columns: 240px minmax(0, 1fr); }
    .tb-field input { width: 170px; }
    .main { padding: 16px 18px 32px; }
  }
  @media (max-width: 760px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas: "top" "side" "main" "foot";
    }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; max-height: 30vh; }
    .tb-field input { width: 100%; }
  }

  /* ---------- PRINT (A4) ---------- */
  @page { size: A4; margin: 15mm 15mm; }
  @media print {
    body { background: #fff; color: #000; font-size: 11pt; }
    .app { display: none !important; }
    #print-area { display: block; }
    .print-section { page-break-after: always; break-after: page; }
    .print-section:last-child { page-break-after: auto; break-after: auto; }
    .print-section h2 { font-size: 14pt; margin: 0 0 6pt; }
    .print-head { font-size: 10.5pt; margin: 0 0 8pt; border-bottom: 1px solid #000; padding-bottom: 6pt; }
    .print-head div { margin-bottom: 3pt; }
    .print-note { font-size: 10pt; font-style: italic; margin: 0 0 8pt; }
    .print-plan { white-space: pre-wrap; font-size: 11pt; line-height: 1.45; }
    .p-field { margin: 0 0 9pt; page-break-inside: avoid; break-inside: avoid; }
    .p-label { font-weight: 600; }
    .p-line { border-bottom: 1px solid #000; height: 1.75em; }
    .p-opts { margin-top: 3pt; }
    .p-opts span { margin-right: 14pt; white-space: nowrap; }
    .p-table, .rubric-table { width: 100%; border-collapse: collapse; background: #fff; }
    .p-table th, .p-table td, .rubric-table th, .rubric-table td { border: 1px solid #000; font-size: 10pt; padding: 4pt 5pt; vertical-align: top; text-align: left; }
    .p-table td { height: 2.4em; }
    .rubric-table thead th, .rubric-table tbody th, .p-table th { background: #eee; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .rubric-table tr { page-break-inside: avoid; break-inside: avoid; }
    .rubric-bands { color: #000; font-size: 10pt; }
    .print-std { font-size: 9.5pt; margin-top: 10pt; }
  }
</style>
</head>
<body>
<div class="app" id="app">

  <footer class="footer" id="footer"></footer>
</div>
<div id="print-area" aria-hidden="true"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script>
'use strict';
/* Index of sheets by id (built from WORKBOOK; never edited by hand). */
const WORKSHEETS = {};
WORKBOOK.worksheets.slice().sort((a, b) => a.order - b.order).forEach(ws => { WORKSHEETS[ws.id] = ws; });

/* ==============================================================================
   STATE
   ============================================================================== */
let storageAvailable = true;
let state = freshState();
let saveTimer = null;
let banner = null;              // { kind: 'error'|'ok'|'warn', text }

function freshState() {
  return {
    app: CONFIG.APP_ID,
    version: CONFIG.DATA_VERSION,
    meta: { genre: CONFIG.DEFAULT_GENRE, title: '', author: '', grade: '' },
    answers: {},
    lessonPlan: { text: '', edited: false },
    ui: { step: 'ws-01-first-reading' },
  };
}

function genre() { return GENRES[state.meta.genre] || GENRES[CONFIG.DEFAULT_GENRE]; }

function sheetsForGenre() {
  return Object.values(WORKSHEETS).filter(ws =>
    ws.genres.includes('all') || ws.genres.includes(state.meta.genre));
}
function isPrintOnly(ws) { return CONFIG.PRINT_ONLY_AUDIENCES.includes(ws.audience); }
function isTeacherSheet(ws) { return CONFIG.TEACHER_AUDIENCES.includes(ws.audience); }

/** Sheets the teacher fills in (they count towards progress). */
function fillableSheets() {
  return sheetsForGenre().filter(ws => ws.id !== CONFIG.RUBRIC_SHEET && !isPrintOnly(ws));
}

/** Navigation groups, in display order. Each step has a unique `key`. */
function stepGroups() {
  const sheets = sheetsForGenre().filter(ws => ws.id !== CONFIG.RUBRIC_SHEET);
  const asStep = ws => ({ key: ws.id, kind: 'sheet', ws: ws });
  return [
    { title: t('groupAnalysis'), steps: sheets.filter(ws => !ws.audience).map(asStep) },
    { title: t('groupTeacher'), steps: sheets.filter(isTeacherSheet).map(asStep) },
    { title: t('groupStudent'), steps: sheets.filter(isPrintOnly).map(asStep) },
    { title: t('groupOutputs'), steps: [
      { key: 'plan', kind: 'plan' },
      { key: 'rubric', kind: 'rubric', ws: WORKSHEETS[CONFIG.RUBRIC_SHEET] },
    ] },
  ].filter(g => g.steps.length);
}
function steps() { return stepGroups().flatMap(g => g.steps); }
function currentIndex() {
  const i = steps().findIndex(s => s.key === state.ui.step);
  return i < 0 ? 0 : i;
}
function currentStep() { return steps()[currentIndex()]; }

function defaultValue(field) {
  switch (field.type) {
    case 'list': return Array(CONFIG.LIST_ROWS).fill('');
    case 'tags': return [];
    case 'table': return Array.from({ length: field.rows }, () => Array(field.columns.length).fill(''));
    default: return '';
  }
}

function getAnswer(wsId, field) {
  const ws = state.answers[wsId];
  const v = ws ? ws[field.id] : undefined;
  if (v === undefined) return defaultValue(field);
  if (field.type === 'list') {            // always exactly LIST_ROWS items
    const arr = v.slice(0, CONFIG.LIST_ROWS);
    while (arr.length < CONFIG.LIST_ROWS) arr.push('');
    return arr;
  }
  if (field.type === 'table') {           // always rows × columns
    return defaultValue(field).map((row, r) => row.map((_, c) => (v[r] && typeof v[r][c] === 'string') ? v[r][c] : ''));
  }
  return v;
}

function setAnswer(wsId, fieldId, value) {
  if (!state.answers[wsId]) state.answers[wsId] = {};
  state.answers[wsId][fieldId] = value;
  onStateChanged();
}

function filled(s) { return typeof s === 'string' && s.trim() !== ''; }

/* Completion rules: text/long/dropdown non-empty; list ≥ LIST_MIN_FILLED rows;
   tags ≥ 1 choice; table ≥ 1 fully filled row. Rubric fields are not inputs. */
function isValueComplete(field, v) {
  switch (field.type) {
    case 'list': return v.filter(filled).length >= CONFIG.LIST_MIN_FILLED;
    case 'tags': return v.length > 0;
    case 'table': return v.some(row => row.every(filled));
    case 'rubric': return true;
    default: return filled(v);
  }
}

function isSheetComplete(ws) {
  return ws.fields.every(f => isValueComplete(f, getAnswer(ws.id, f)));
}

function loadState() {
  try {
    const raw = window.localStorage.getItem(CONFIG.STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      const clean = validateImport(parsed);
      clean.ui = { step: parsed.ui && typeof parsed.ui.step === 'string' ? parsed.ui.step : clean.ui.step };
      state = clean;
    }
  } catch (e) { /* unreadable or blocked storage: start fresh */ }
  try {   // probe that writes work
    const k = CONFIG.STORAGE_KEY + ':probe';
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
  } catch (e) { storageAvailable = false; }
}

function saveStateNow() {
  if (!storageAvailable) return;
  try {
    window.localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(state));
    setSaveStatus(t('saved'));
  } catch (e) {
    storageAvailable = false;
    setSaveStatus();
  }
}

function scheduleSave() {
  if (!storageAvailable) return;
  setSaveStatus(t('saving'));
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveStateNow, 300);
}

/** Called after any answer/meta change: persist and refresh light-weight UI. */
function onStateChanged() {
  scheduleSave();
  renderSidebar();
  renderFooter();
}

/* Pages opened through a shared link run inside a frame that blocks

const EMBEDDED = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

/* ---- In-page dialogs (browser confirm() is blocked in some viewers) ---- */
function openDialog(title, body, actions) {
  const prev = document.activeElement;
  const overlay = h('div', { class: 'dlg-overlay' });
  const close = () => { overlay.remove(); if (prev && prev.focus) prev.focus(); };
  const box = h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'dlg-title' },
    h('h2', { id: 'dlg-title', text: title }), body,
    h('div', { class: 'dlg-actions' }, actions.map(a => h('button', {
      type: 'button', class: 'btn' + (a.primary ? ' primary' : ''), text: a.label,
      onclick: e => { if (a.onclick && a.onclick(e) === false) return; close(); },
    }))));
  overlay.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  overlay.addEventListener('click', e => { if (e.target === overlay) close(); });
  overlay.append(box);
  document.body.append(overlay);
  const first = box.querySelector('textarea:not([readonly]), .btn.primary');
  if (first) first.focus();
  return close;
}

function askConfirm(text, onYes) {
  openDialog(t('confirmTitle'), h('p', { text: text }), [
    { label: t('cancel') },
    { label: t('confirmYes'), primary: true, onclick: () => { onYes(); } },
  ]);
}

/** Copy a textarea's text; falls back to selecting it for Ctrl+C. */
function copyText(el, btn) {
  const ok = () => { if (btn) btn.textContent = t('copied'); };
  const fallback = () => { el.focus(); el.select(); if (btn) btn.textContent = t('copySelected'); };
  try { navigator.clipboard.writeText(el.value).then(ok, fallback); } catch (e) { fallback(); }
}

/** Tiny DOM builder: h('div', {class:'x', onclick: fn}, child, ...). */
function h(tag, props) {
  const el = document.createElement(tag);
  const children = Array.prototype.slice.call(arguments, 2).flat(Infinity);
  let value;
  if (props) {
    for (const k of Object.keys(props)) {
      const v = props[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k === 'value') value = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const c of children) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : String(c));
  }
  if (value !== undefined) el.value = value;  // after options exist (select)
  return el;
}

function render() {
  renderTopbar();
  renderSidebar();
  renderMain();
  renderFooter();
}

function setSaveStatus(text) {
  const el = document.getElementById('save-status');
  if (!el) return;
  if (!storageAvailable) {
    el.textContent = t('storageOff');
    el.className = 'save-status off';
  } else {
    el.textContent = text || '';
    el.className = 'save-status';
  }
}

function stepLabel(step) {
  if (step.kind === 'plan') return t('lessonPlan');
  if (step.kind === 'rubric') return t('rubric');
  return step.ws.title;
}

function renderSidebar() {
  const nav = document.getElementById('sidebar');
  const active = currentStep().key;
  const parts = [];
  stepGroups().forEach(g => {
    parts.push(h('h2', { text: g.title }));
    parts.push(h('ul', { class: 'steps' }, g.steps.map(step => {
      const done = step.kind === 'sheet' && !isPrintOnly(step.ws) && isSheetComplete(step.ws);
      const marker = step.kind === 'plan' ? '≡' : step.kind === 'rubric' ? '31' : done ? '✓' : String(step.ws.order);
      return h('li', null, h('button', {
        type: 'button',
        class: 'step-btn' + (done ? ' done' : ''),
        'aria-current': step.key === active ? 'step' : null,
        title: done ? step.ws.order + ' — ' + t('complete') : null,
        onclick: () => goTo(step.key),
      },
      h('span', { class: 'step-num', 'aria-hidden': 'true' }, marker),
      h('span', { class: 'step-label' }, stepLabel(step),
        done ? h('span', { class: 'sr-only' }, ' — ' + t('complete')) : null)));
    })));
  });
  parts.push(h('p', { class: 'privacy', text: t('privacy') }));
  nav.replaceChildren.apply(nav, parts);
}

function renderFooter() {
  const foot = document.getElementById('footer');
  const ws = fillableSheets();
  const done = ws.filter(isSheetComplete).length;
  const pct = ws.length ? Math.round(done / ws.length * 100) : 0;
  const all = steps(), i = currentIndex();
  foot.replaceChildren(
    h('button', { class: 'btn', type: 'button', disabled: i === 0, onclick: () => goTo(all[i - 1].key), text: t('prev') }),
    h('div', { class: 'progress' },
      h('div', { class: 'progress-track', role: 'progressbar', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': pct },
        h('div', { class: 'progress-fill', style: 'width:' + pct + '%' })),
      h('span', { class: 'progress-label', text: t('progress', { done: done, total: ws.length }) })),
    h('button', { class: 'btn primary', type: 'button', disabled: i >= all.length - 1, onclick: () => goTo(all[i + 1].key), text: t('next') }),
  );
}

function goTo(key) {
  state.ui.step = key;
  scheduleSave();
  render();
  document.getElementById('main').scrollTop = 0;
}

function showBanner(kind, text) { banner = { kind: kind, text: text }; renderBanner(); }

function renderBanner() {
  const slot = document.getElementById('banner-slot');
  if (!slot) return;
  slot.replaceChildren(banner ? h('div', { class: 'banner ' + banner.kind, role: banner.kind === 'error' ? 'alert' : 'status' },
    h('p', { text: banner.text }),
    h('button', { type: 'button', 'aria-label': t('close'), onclick: () => { banner = null; renderBanner(); } }, '×')) : '');
}

function renderMain() {
  const box = document.getElementById('main-inner');
  const step = currentStep();
  const content = step.kind === 'plan' ? renderLessonPlan()
    : step.kind === 'rubric' ? renderRubric()
    : renderSheet(step.ws);
  box.replaceChildren(h('div', { id: 'banner-slot' }), content);
  renderBanner();
}

/* ---- Sheet rendering (generic, driven by WORKBOOK data) ---- */

function sheetHeader(ws) {
  const meta = [ws.guide ? t('guideRef', { guide: ws.guide }) : '', ws.standard ? t('standardRef', { standard: ws.standard }) : '']
    .filter(Boolean).join(' · ');
  return [
    h('p', { class: 'ws-kicker', text: t('sheetKicker', { n: ws.order }) }),
    h('h2', { class: 'ws-title', text: ws.title }),
    meta ? h('p', { class: 'ws-meta', text: meta }) : null,
    ws.note ? h('div', { class: 'banner warn' }, h('p', { text: ws.note })) : null,
  ];
}

function renderSheet(ws) {
  const tools = h('div', { class: 'ws-tools' },
    h('button', { class: 'btn', type: 'button', text: t('printBlank'), onclick: () => printOutputs('blank:' + ws.id) }));
  if (isPrintOnly(ws)) {
    return h('section', null, sheetHeader(ws),
      h('div', { class: 'banner warn' }, h('p', { text: t('printOnlyNote') })),
      h('div', { class: 'card' },
        h('span', { class: 'field-label', text: t('printOnlyFields') }),
        h('ol', { class: 'label-list' }, ws.fields.map(f => h('li', { text: f.label })))),
      tools);
  }
  return h('section', null, sheetHeader(ws), tools,
    ws.id === CONFIG.PLOT_SHEET ? renderPlotBar(ws) : null,
    ws.fields.map(f => renderField(ws.id, f)));
}

function fieldDomId(wsId, fid, extra) { return ['f', wsId, fid, extra].filter(x => x != null).join('-'); }

function renderField(wsId, field) {
  const value = getAnswer(wsId, field);
  const id = fieldDomId(wsId, field.id);
  const label = h('label', { class: 'field-label', for: id, text: field.label });
  switch (field.type) {
    case 'text':
    case 'long':
      return h('div', { class: 'card' }, label,
        h(field.type === 'text' ? 'input' : 'textarea', {
          id: id, type: field.type === 'text' ? 'text' : null, value: value,
          maxlength: CONFIG.MAX_TEXT_LENGTH,
          oninput: e => {
            setAnswer(wsId, field.id, e.target.value);
            if (wsId === CONFIG.PLOT_SHEET) updatePlotBar();
          },
        }));

    case 'dropdown':
      return h('div', { class: 'card' }, label,
        h('select', { id: id, value: value, onchange: e => setAnswer(wsId, field.id, e.target.value) },
          h('option', { value: '' }, t('selectPh')),
          field.options.map(o => h('option', { value: o }, o))));

    case 'list':
      return h('div', { class: 'card' },
        h('span', { class: 'field-label', id: id + '-label', text: field.label }),
        h('div', { class: 'list-inputs', role: 'group', 'aria-labelledby': id + '-label' },
          value.map((v, i) => h('div', { class: 'list-row' },
            h('span', { text: (i + 1) + ')' }),
            h('input', {
              type: 'text', value: v, maxlength: 2000, 'aria-label': field.label + ' ' + (i + 1),
              oninput: e => {
                const arr = getAnswer(wsId, field).slice();
                arr[i] = e.target.value;
                setAnswer(wsId, field.id, arr);
              },
            })))));

    case 'tags':
      return h('div', { class: 'card' },
        h('span', { class: 'field-label', id: id + '-label', text: field.label }),
        h('div', { class: 'chips', role: 'group', 'aria-labelledby': id + '-label' },
          field.options.map(o => h('button', {
            type: 'button', class: 'chip', 'aria-pressed': value.includes(o) ? 'true' : 'false',
            onclick: e => {
              const cur = getAnswer(wsId, field);
              const next = cur.includes(o) ? cur.filter(x => x !== o) : field.options.filter(x => x === o || cur.includes(x));
              e.currentTarget.setAttribute('aria-pressed', next.includes(o) ? 'true' : 'false');
              setAnswer(wsId, field.id, next);
            },
          }, o))));

    case 'table':
      return h('div', { class: 'card' },
        h('span', { class: 'field-label', id: id + '-label', text: field.label }),
        h('table', { class: 'ws-table', 'aria-labelledby': id + '-label' },
          h('thead', null, h('tr', null, h('th'), field.columns.map(c => h('th', { scope: 'col', text: c })))),
          h('tbody', null, value.map((row, r) => h('tr', null,
            h('td', { class: 'rownum', text: (r + 1) + '.' }),
            row.map((cell, c) => h('td', null, h('textarea', {
              value: cell, rows: 2, maxlength: 2000,
              'aria-label': field.columns[c] + ', ' + (r + 1),
              oninput: e => {
                const grid = getAnswer(wsId, field).map(x => x.slice());
                grid[r][c] = e.target.value;
                setAnswer(wsId, field.id, grid);
              },
            }))))))));

    case 'rubric':
      return h('div', { class: 'card' }, h('span', { class: 'field-label', text: field.label }), rubricTable(field));
  }
  return null;
}

/* Plot curve: one bar per plot-stage field, coloured once filled. */
let plotCols = {};
function renderPlotBar(ws) {
  const stages = ws.fields.filter(f => CONFIG.PLOT_CURVE[f.id] != null);
  plotCols = {};
  const shortName = f => f.label.replace(/\s*\(.*$/, '');
  const style = '--n:' + stages.length;
  return h('div', { class: 'card' },
    h('div', { class: 'stagebar', style: style, role: 'img', 'aria-label': t('plotBarLabel') },
      stages.map(f => (plotCols[f.id] = h('button', {
        type: 'button', tabindex: '-1', title: shortName(f),
        class: 'stage-col' + (filled(getAnswer(ws.id, f)) ? ' filled' : ''),
        onclick: () => document.getElementById(fieldDomId(ws.id, f.id)).focus(),
      }, h('span', { class: 'stage-bar', style: 'height:' + CONFIG.PLOT_CURVE[f.id] + '%' }))))),
    h('div', { class: 'stage-names', style: style, 'aria-hidden': 'true' }, stages.map(f => h('span', { text: shortName(f) }))));
}
function updatePlotBar() {
  const ws = WORKSHEETS[CONFIG.PLOT_SHEET];
  ws.fields.forEach(f => { if (plotCols[f.id]) plotCols[f.id].classList.toggle('filled', filled(getAnswer(ws.id, f))); });
}

function oneLine(s) { return String(s).replace(/\s*\n\s*/g, ' ').trim(); }
function findField(wsId, fid) {
  const ws = WORKSHEETS[wsId];
  return ws ? ws.fields.find(f => f.id === fid) : null;
}

/** Value of one path, or null when empty. Arrays = multi-row values. */
function resolvePath(path) {
  if (path.indexOf('label:') === 0) {
    const p = path.slice(6).split('.');
    const f = findField(p[0], p[1]);
    return f ? f.label : null;
  }
  const p = path.split('.');
  if (p[0] === 'meta') {
    const title = filled(state.meta.title) ? oneLine(state.meta.title) : t('untitled');
    switch (p[1]) {
      case 'title': return title;
      case 'author': return filled(state.meta.author) ? oneLine(state.meta.author) : null;
      case 'genre': return genre().label;
      case 'grade': return state.meta.grade ? state.meta.grade + t('gradeSuffix') : null;
      case 'topicDefault': return '«' + title + '» шығармасын талдау';
      case 'goalDefault': return '«' + title + '» шығармасының мазмұнын, құрылымын және кейіпкерлерін мәтінге сүйеніп талдау.';
      case 'assessDefault': return '31-парақтағы рубрика бойынша (12 балл).';
    }
    return null;
  }
  const field = findField(p[0], p[1]);
  if (!field) return null;
  const v = getAnswer(p[0], field);
  switch (field.type) {
    case 'list': { const xs = v.filter(filled).map(oneLine); return xs.length ? xs : null; }
    case 'tags': return v.length ? v.join(', ') : null;
    case 'table': {
      const rows = v.filter(r => r.some(filled)).map(r => r.map(c => filled(c) ? oneLine(c) : '—').join(' — '));
      return rows.length ? rows : null;
    }
    case 'rubric': return null;
    default: return filled(v) ? oneLine(v) : null;
  }
}

function resolveToken(expr, ctx) {
  if (expr === 'total') return String(ctx.total);
  for (const alt of expr.split('??')) {
    const r = resolvePath(alt.trim());
    if (r != null) return r;
  }
  return null;
}

/** Expand template lines with tokens, applying the given indent. */
function expandLines(lines, indent, ctx) {
  const out = [];
  lines.forEach(raw => {
    const optional = raw.charAt(0) === '?';
    const line = optional ? raw.slice(1) : raw;
    const solo = line.trim().match(/^\{([^{}]+)\}$/);
    if (solo) {
      const r = resolveToken(solo[1], ctx);
      const lead = line.match(/^\s*/)[0];
      if (Array.isArray(r)) { r.forEach((x, i) => out.push(indent + lead + '  ' + (i + 1) + ') ' + x)); return; }
      if (r == null) { if (!optional) out.push(indent + lead + '  ' + t('empty')); return; }
    }
    let any = false, tokens = 0;
    const text = line.replace(/\{([^{}]+)\}/g, (m, expr) => {
      tokens++;
      const r = resolveToken(expr, ctx);
      if (r == null) return t('empty');
      if (!/^label:/.test(expr) && expr !== 'total') any = true;
      return Array.isArray(r) ? r.join('; ') : r;
    });
    if (optional && tokens && !any) return;
    out.push(indent + text);
  });
  return out;
}

function activitySet() {
  return LESSON_PLAN.activities[genre().activities] || LESSON_PLAN.activities.default;
}
function stageMinutes(stage) {
  return stage.activities ? activitySet().reduce((a, x) => a + x.minutes, 0) : stage.minutes;
}

function generateLessonPlan() {
  const total = LESSON_PLAN.stages.reduce((a, s) => a + stageMinutes(s), 0);
  const ctx = { total: total };
  const min = t('minutes');
  let out = expandLines(LESSON_PLAN.header, '', ctx);
  out.push('');
  LESSON_PLAN.stages.forEach((s, i) => {
    out.push((i + 1) + '. ' + s.title + ' — ' + stageMinutes(s) + ' ' + min);
    if (s.lines) out = out.concat(expandLines(s.lines, '   ', ctx));
    if (s.activities) activitySet().forEach((a, j) => {
      out.push('   ' + (i + 1) + '.' + (j + 1) + '. ' + a.title + ' — ' + a.minutes + ' ' + min);
      out = out.concat(expandLines(a.lines, '        ', ctx));
    });
    out.push('');
  });
  out = out.concat(expandLines(LESSON_PLAN.footer, '', ctx));
  return { text: out.join('\n'), total: total };
}

/** Sheets referenced by the current template (for the info banner). */
function planSourceSheets() {
  const src = JSON.stringify([LESSON_PLAN.header, LESSON_PLAN.stages, LESSON_PLAN.footer, activitySet()]);
  const ids = new Set((src.match(/ws-\d\d-[\w-]+/g) || []));
  return Object.values(WORKSHEETS).filter(ws => ids.has(ws.id)).map(ws => ws.order);
}

function renderLessonPlan() {
  // Keep the plan in sync with answers until the teacher edits it by hand.
  const gen = generateLessonPlan();
  if (!state.lessonPlan.edited || !filled(state.lessonPlan.text)) {
    state.lessonPlan = { text: gen.text, edited: false };
    scheduleSave();

  return h('section', null,
    h('h2', { class: 'ws-title', text: t('lessonPlan') }),
    h('p', { class: 'ws-intro', text: t('planIntro') }),
    gen.total !== CONFIG.LESSON_MINUTES ? h('div', { class: 'banner error', role: 'alert' },

    h('div', { class: 'banner warn' }, h('p', { text: t('planSources', { list: planSourceSheets().join(', '), empty: t('empty') }) })),
    state.lessonPlan.edited ? h('div', { class: 'banner warn' }, h('p', { text: t('planEditedNote') })) : null,
    h('div', { class: 'ws-tools' },

function rubricField() {
  return WORKSHEETS[CONFIG.RUBRIC_SHEET].fields.find(f => f.type === 'rubric');
}

function rubricLevels(field) {
  return Object.keys(field.criteria[0].levels).map(Number).sort((a, b) => b - a);
}

function rubricTable(field) {
  const levels = rubricLevels(field);
  const max = field.criteria.length * levels[0];
  return h('table', { class: 'rubric-table' },
    h('thead', null, h('tr', null,
      h('th', { scope: 'col', text: t('criterion') }),
      levels.map(l => h('th', { scope: 'col' }, l + ' ' + t('pointsSuffix') + (STRINGS.levelNames[l] ? ' — ' + STRINGS.levelNames[l] : ''))),
      h('th', { scope: 'col', class: 'score-col', text: t('score') }))),
    h('tbody', null,
      field.criteria.map(c => h('tr', null,
        h('th', { scope: 'row', text: c.name }),
        levels.map(l => h('td', { text: c.levels[String(l)] || '' })),
        h('td', { class: 'score-col' }))),
      h('tr', null,
        h('th', { scope: 'row', colspan: levels.length + 1, style: 'text-align:right', text: t('total') }),
        h('td', { class: 'score-col' }, '    / ' + max))));
}

function rubricBands(field) {
  return h('ul', { class: 'rubric-bands' }, field.bands.map(b =>
    h('li', { text: b.min + '–' + b.max + ' ' + t('pointsSuffix') + ' — ' + b.label })));

class ImportError extends Error {}

function fail(key, vars) { throw new ImportError(t(key, vars)); }
function failAt(path, problemKey) { fail('errStructure', { path: path, problem: t(problemKey) }); }
function isObj(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }

function cleanString(v, path, max) {
  if (v === undefined || v === null) return '';
  if (typeof v !== 'string') failAt(path, 'probString');
  if (v.length > (max || CONFIG.MAX_TEXT_LENGTH)) failAt(path, 'probTooLong');
  return v;
}

function cleanStringArray(v, path, maxLen) {
  if (v === undefined || v === null) return [];
  if (!Array.isArray(v)) failAt(path, 'probArray');
  if (v.length > maxLen) failAt(path, 'probTooMany');
  return v.map((x, i) => cleanString(x, path + '[' + (i + 1) + ']'));
}

/** Validate a field value against the WORKBOOK schema; returns a clean copy. */
function cleanField(field, v, path) {
  switch (field.type) {
    case 'text': case 'long': return cleanString(v, path);
    case 'dropdown': {
      const s = cleanString(v, path);
      if (s && !field.options.includes(s)) failAt(path, 'probOption');
      return s;
    }
    case 'list': return cleanStringArray(v, path, CONFIG.LIST_ROWS);
    case 'tags': {
      const arr = cleanStringArray(v, path, field.options.length);
      arr.forEach((x, i) => { if (!field.options.includes(x)) failAt(path + '[' + (i + 1) + ']', 'probOption'); });
      return arr;
    }
    case 'table': {
      if (v === undefined || v === null) return defaultValue(field);
      if (!Array.isArray(v)) failAt(path, 'probArray');
      if (v.length > field.rows) failAt(path, 'probTooMany');
      return v.map((row, r) => cleanStringArray(row, path + '[' + (r + 1) + ']', field.columns.length));
    }
  }
  return undefined;   // rubric: nothing stored
}

/** Throws ImportError (Kazakh message) or returns a clean state object. */
function validateImport(data) {
  if (!isObj(data) || data.app !== CONFIG.APP_ID) fail('errWrongApp');
  if (typeof data.version !== 'number') failAt('version', 'probNumber');
  if (data.version > CONFIG.DATA_VERSION) fail('errNewer', { v: data.version });
  if (data.version < CONFIG.DATA_VERSION) fail('errOlder', { v: data.version });

  if (!isObj(data.meta)) failAt('meta', 'probObject');
  const genreId = cleanString(data.meta.genre, 'meta.genre') || CONFIG.DEFAULT_GENRE;
  if (!GENRES[genreId]) fail('errUnknownGenre', { genre: genreId });
  const title = cleanString(data.meta.title, 'meta.title', 300);
  const author = cleanString(data.meta.author, 'meta.author', 200);
  const grade = data.meta.grade == null ? '' : String(data.meta.grade);
  if (grade && !CONFIG.GRADES.map(String).includes(grade)) failAt('meta.grade', 'probOption');

  const answersIn = data.answers == null ? {} : data.answers;
  if (!isObj(answersIn)) failAt('answers', 'probObject');
  const answers = {};
  // Known, non-print-only sheets only; unknown keys are dropped.
  Object.values(WORKSHEETS).filter(ws => !isPrintOnly(ws)).forEach(ws => {
    const wsIn = answersIn[ws.id];
    if (wsIn === undefined || wsIn === null) return;
    if (!isObj(wsIn)) failAt('answers.' + ws.id, 'probObject');
    const out = {};
    ws.fields.forEach(f => {
      if (wsIn[f.id] === undefined) return;
      const v = cleanField(f, wsIn[f.id], 'answers.' + ws.id + '.' + f.id);
      if (v !== undefined) out[f.id] = v;
    });
    answers[ws.id] = out;
  });

  let lessonPlan = { text: '', edited: false };
  if (data.lessonPlan != null) {
    if (!isObj(data.lessonPlan)) failAt('lessonPlan', 'probObject');
    const lpText = cleanString(data.lessonPlan.text, 'lessonPlan.text');
    const edited = data.lessonPlan.edited;
    if (edited != null && typeof edited !== 'boolean') failAt('lessonPlan.edited', 'probBoolean');
    lessonPlan = { text: lpText, edited: !!edited && filled(lpText) };
  }

  return {
    app: CONFIG.APP_ID,
    version: CONFIG.DATA_VERSION,
    meta: { genre: genreId, title: title, author: author, grade: grade },
    answers: answers,
    lessonPlan: lessonPlan,
    ui: { step: 'ws-01-first-reading' },
  };
}

function importDialog() {
  const ta = h('textarea', { class: 'dlg-code', placeholder: t('importPastePh'), 'aria-label': t('importTitle') });
  openDialog(t('importTitle'), [h('p', { text: t('importHelp') }), ta], [
    { label: t('cancel') },
    { label: t('importFromFile'), onclick: () => { document.getElementById('import-file').click(); } },
    { label: t('importApply'), primary: true, onclick: () => {
      if (!filled(ta.value)) { ta.placeholder = t('importEmpty'); ta.focus(); return false; }
      importText(ta.value);
    } },
  ]);
}

function handleImportFile(file) {
  if (!file) return;
  if (file.size > CONFIG.MAX_IMPORT_BYTES) { showBanner('error', t('errTooLarge')); return; }
  const reader = new FileReader();
  reader.onerror = () => showBanner('error', t('errRead'));
  reader.onload = () => importText(String(reader.result));
  reader.readAsText(file, 'utf-8');
}

/** Parse + validate; on success ask before replacing the current analysis. */
function importText(text) {
  if (text.length > CONFIG.MAX_IMPORT_BYTES) { showBanner('error', t('errTooLarge')); return; }
  let data;
  try { data = JSON.parse(text.replace(/^\uFEFF/, '')); }
  catch (e) { showBanner('error', t('errNotJson')); return; }
  let next;
  try { next = validateImport(data); }
  catch (e) {
    showBanner('error', e instanceof ImportError ? e.message : t('errRead'));
    return;
  }
  askConfirm(t('importConfirm'), () => {
    state = next;
    banner = null;
    saveStateNow();
    render();
    showBanner('ok', t('importOk'));
  });
}

function resetAll() {
  askConfirm(t('resetConfirm'), () => {
    state = freshState();
    banner = null;
    saveStateNow();
    render();
  });
}

/* ==============================================================================
   INIT
   ============================================================================== */
document.getElementById('import-file').addEventListener('change', e => {
  handleImportFile(e.target.files && e.target.files[0]);
  e.target.value = '';   // allow re-importing the same file
});
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); saveStateNow(); });

loadState();
render();
</script>
